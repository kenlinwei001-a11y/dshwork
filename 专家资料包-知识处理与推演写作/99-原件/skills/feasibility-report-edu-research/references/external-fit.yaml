# =============================================================================
# 外部证据适配性评估（L0）—— 检索回来的东西，凭什么用在这个项目上
# -----------------------------------------------------------------------------
# SEARCH 动作会捞回一堆政策、法规、标准、规划、案例。它们**不能直接入图**。
#
# 理由：一份文件对某个项目适用，对另一个项目可能完全不适用——
#   《XX省防空地下室战时功能设置规则》对省外项目无效；
#   《高校学生宿舍建设指导意见》对科研楼项目没有引用价值；
#   一份 2015 年的指导意见可能已被 2023 年的文件替代；
#   一份省级规划里只有原则性表述，没有可引的条款。
#
# 拿一条不适配的政策去论证"符合国家政策"，比不写还糟：
# 评审专家一眼看出这条管不着本项目，整章的可信度一起塌。
#
# 所以外部证据的处置是三步，不是一步：
#   检索 → **逐条评适配性并排序** → **交客户选择**，选中的才入图
#
# agent 不替客户决定采纳哪条。它负责把选择题出好：
# 排好序、说清楚每条为什么排在这、采纳后会挂到哪条边上服务哪个维度。
# =============================================================================

meta:
  id: fsr-external-fit
  version: 0.1.0
  layer: L0
  applies_to: [E2_normative, E3_external, E5_analogical]

# =============================================================================
# 一、硬否决 —— 先淘汰，再打分
# =============================================================================
# 这四条命中任意一条，直接出局，不进排序表，但要记入"已检索未采纳"留痕。
# 留痕是有价值的：它证明检索过并作了判断，而不是没看见。
# =============================================================================
veto:

  V1_repealed:
    cn: 已废止或已被替代
    test: 现行状态 == 废止 / 被替代 / 已到期未延续
    note: 除非本项目的历史沿革需要引用旧文（此时须显式标 historical_reference）

  V2_jurisdiction_miss:
    cn: 地域不覆盖
    test: 文件的效力地域不包含项目所在地
    note: |
      **最高频的误用。** 地方规定只在本行政区划内有效。
      省级文件对省内所有地市有效，市级文件对邻市无效。
      跨省照搬地方强制配建比例是典型事故。

  V3_category_miss:
    cn: 项目类别不覆盖
    test: 文件的适用对象不包含本项目的行业 / 用房类型 / 建设性质
    note: |
      注意边界情形要**查证而不是默认**。
      例如面积指标标准是否覆盖"专职科研机构用房"，属边界情形，
      查不清楚就标 uncertain 交客户，不要自行认定覆盖。

  V4_subject_miss:
    cn: 投资主体不适用
    test: 文件仅适用于某类主体（如仅限中央预算内投资项目、仅限国有企业）而本项目不属于
    note: 分诊里的「谁投资」在这里第二次发挥作用

# =============================================================================
# 二、适配性维度 —— 通过否决的，按这六维打分
# =============================================================================
# 每维 0–3 分。总分 = Σ(得分 × 权重)。权重之和为 1。
# 分数只用于排序，不用于自动采纳。
# =============================================================================
fit_dimensions:

  F1_jurisdiction:
    cn: 地域适配度
    weight: 0.20
    scale:
      3: 与项目所在地同级且直接对应（市级文件用于本市项目）
      2: 上位覆盖（省级文件用于省内项目、国家级文件用于全国）
      1: 上位覆盖但下位另有更具体规定，本条只作背景
      0: 仅有间接关联
    note: 同时存在国家级与地方级规定时，**地方级优先作为直接依据**，国家级作为背景

  F2_category:
    cn: 项目类别适配度
    weight: 0.25
    scale:
      3: 明确点名本类项目（如"高校学生宿舍"用于宿舍项目）
      2: 覆盖本类所属的上位类别（如"教育设施""公共建筑"）
      1: 覆盖更宽的范围，本项目只是其中一小部分
      0: 仅在原则层面相关
    note: 权重最高。类别不对，其余各维再高也没有引用价值

  F3_subject:
    cn: 投资主体与建设性质适配度
    weight: 0.10
    scale:
      3: 主体与建设性质完全对应（政府投资 / 新建 / 事业单位）
      2: 主体对应，建设性质未点明
      1: 仅泛指所有投资项目
      0: 主体口径不同但不构成否决

  F4_currency:
    cn: 时效
    weight: 0.15
    scale:
      3: 现行有效，且已在 90 天内核验过
      2: 现行有效，核验记录超过 90 天
      1: 状态未查证（标 in_use_unverified）
      0: 即将失效或有替代版本在征求意见
    note: 得 1 分的必须在报告出稿前补查证；norms.yaml 的诚实纪律在此照常适用

  F5_authority:
    cn: 效力层级
    weight: 0.15
    scale:
      3: 法律、行政法规、部门规章、强制性国家标准
      2: 国务院或部委规范性文件（含发改委各类"规""意见"）
      1: 推荐性标准、地方规范性文件、行业协会文件
      0: 指南、白皮书、研究报告、新闻稿
    note: |
      0 分的不是不能用，是**不能单独作为 warrant**。
      它可以作为 backing 或背景陈述，但论证的推理许可要挂到更高层级的文件上。

  F6_specificity:
    cn: 条款针对性
    weight: 0.15
    scale:
      3: 有可直接引用的具体条款（含条款号与量化要求）
      2: 有明确的定性要求，可引但需转述
      1: 只有原则性表述（"加强""推进""鼓励"）
      0: 通篇未涉及本项目要论证的那件事
    note: |
      **这一维决定它能不能当论据用。**
      只有原则性表述的文件常被拿来充数——"本项目符合《XX规划》要求"，
      但那份规划里根本没有一条能对上本项目。C5 会追问 backing 在哪一条。

# =============================================================================
# 二之二、数值候选的适配性维度 —— 与政策候选不是同一套
# -----------------------------------------------------------------------------
# 政策候选问的是「这条规定管不管本项目」；
# 数值候选问的是「这个数和本项目的那个量，说的是不是同一件事」。
#
# 后者的头号杀手是**统计口径**。一个"单位面积能耗 60 kWh/㎡·a"，
# 如果发布方按使用面积统计而本项目按建筑面积，两个数差 30%——
# 而报告里看不出任何异常，因为它读起来完全合理。
#
# 用于 provenance-routing.yaml → ask_fallback 的 step2。
# =============================================================================
value_fit_dimensions:

  N1_metric_definition:
    cn: 口径匹配
    weight: 0.30
    scale:
      3: 分母、边界、统计方法与本项目完全一致，且发布方写明了口径
      2: 口径一致但发布方未明写，靠推断
      1: 口径可换算（如使用面积↔建筑面积），换算系数须另行确认
      0: 口径不同且无法换算
    note: |
      **权重最高，因为它最隐蔽。** 地域、年份对不上，人一眼看得出来；
      口径对不上，报告读起来完全正常，只有算到后面才会发现哪里不对——
      而那时已经写完三章了。
      至少要问清三件事：分母是什么、边界含不含哪些部分、是限额还是平均值。

  N2_object_match:
    cn: 对象匹配
    weight: 0.25
    scale:
      3: 发布值明确针对本项目的建筑/项目类型（如"高等学校科研建筑"）
      2: 针对上位类别（如"公共建筑""教育建筑"）
      1: 针对更宽的范围，本类型只是其中一小部分
      0: 对象不同，仅供参考

  N3_geography:
    cn: 地域与气候区
    weight: 0.15
    scale:
      3: 同城或同气候区且发布方即本地主管部门
      2: 同省或同气候区
      1: 全国值
      0: 异地异气候区
    note: 能耗类指标对气候区极敏感，严寒地区与夏热冬冷地区的采暖能耗不可比

  N4_vintage:
    cn: 年份
    weight: 0.15
    scale:
      3: 近三年发布，或标准现行版
      2: 三到五年
      1: 五年以上但仍现行
      0: 已被新版替代
    note: 造价类指标还要额外做价格年份调整，不能直接用

  N5_authority:
    cn: 发布机构权威性
    weight: 0.10
    scale:
      3: 强制性标准、国务院或部委发布、地方主管部门正式发布
      2: 推荐性标准、行业协会统计公报
      1: 设计院或咨询机构的公开研究
      0: 媒体报道、二手转述
    hard_rule: 0 分的不得作为候选呈报——二手转述的数字连出处都追不到

  N6_value_type:
    cn: 值的性质
    weight: 0.05
    scale:
      3: 明确的约束值/限额（说明"不得超过"）
      2: 引导值/目标值
      1: 统计平均值
      0: 性质不明
    note: |
      限额与平均值是两回事。用平均值论证"本项目节能"会被追问
      "对照的是什么"，用限额则可以直接写"满足约束值要求"。

  ranking:
    order_by: [总分 desc, N1_metric_definition desc, N5_authority desc]
    buckets:
      recommended: {test: "总分 ≥ 2.2 且 N1 ≥ 2", default_checked: false}
      optional: {test: "总分 ≥ 1.5", default_checked: false}
      reference_only: {test: "其余", default_checked: false}
    note: |
      **数值候选一律不默认勾选**，与政策候选不同。
      政策的强制适用性可以判定，数值的适用性只有客户和设计单位知道。
      默认勾选会让客户顺手确认一个他没细看的数。

  must_offer:
  - 「以上都不合适」
  - 「我方另有取值」
  note_on_options: |
    候选表必须留这两个出口。只给候选不给出口，等于把客户逼进一个
    他不认可的数——他会随便选一个，然后这个数会一路写进报告。

# =============================================================================
# 三、拟挂载角色 —— 采纳后它在图上做什么
# =============================================================================
# 排序表里必须同时给出这一项。客户选的不只是"要不要这条",
# 还是"这条用来干什么"——同一份文件挂不同的边，服务不同的维度。
# 角色定义见 ontology-core.yaml 的 Mandate。
# =============================================================================
proposed_role:
  driver: 政策要求做这件事 → mandates 边 → D1 必要性
  benchmark: 本项目不违反它 → complies_with 边 → D2 合规性
  warrant: 提供推理许可 → warrants 边 → 任意论断
  domain: 约束技术取值 → constrains 边 → 技术方案边界
  note: |
    一份文件可以同时担多个角色（校园总体规划既是 driver 又是 benchmark）。
    排序表里要分别列出，因为客户可能只认其中一个角色。

# =============================================================================
# 四、排序与呈现
# =============================================================================
ranking:

  order_by: [总分 desc, F5_authority desc, F4_currency desc]

  buckets:
    recommended:
      cn: 建议采纳
      test: 总分 ≥ 2.2 且 F2 ≥ 2 且 F6 ≥ 2
      default_checked: true
    optional:
      cn: 备选
      test: 总分 ≥ 1.5
      default_checked: false
    background:
      cn: 仅作背景
      test: 总分 < 1.5 或 F6 ≤ 1
      default_checked: false
      note: 可写进综述性文字，但不得作为某条论断的 warrant 或 backing

  mandatory_candidate:
    cn: 强制适用（默认勾选但仍须客户确认）
    test: |
      文件本身规定了强制适用范围且本项目落在其中，例如：
        · 发改投资规〔2023〕304号（本 skill 的法定基准，恒为强制）
        · 项目所在地的强制配建规定（人防、无障碍、海绵、充电桩）
        · 本行业的强制性国家标准
    behavior: 默认勾选并置顶，但**不跳过客户确认**——万一项目所在地判断错了，
      这一条会把错误固化进整份报告

  cap: 每个待决问题最多呈 6 条候选。超过 6 条说明检索式不够聚焦，先收敛检索再呈报。

presentation:
  table_columns:
  - 序
  - 文件名称与编号
  - 发文机关 / 效力层级
  - 现行状态与核验日期
  - 适配性总分
  - 地域 / 类别 / 主体（三个关键维的分值）
  - 拟担角色
  - 可引条款
  - 建议
  must_state_per_item:
  - 为什么排在这个位置（哪一维拉高、哪一维拉低）
  - 采纳后挂到哪条边、服务哪个维度、支撑哪一章的哪条论断
  - 不采纳的后果（该维度是否还有别的依据托底）
  must_state_overall:
  - 检索用的是什么检索式、检索日期
  - 被硬否决淘汰了哪些、各因为哪一条否决
  - 如果全部候选都进不了「建议采纳」，直接说"没检到能用的依据"，
    并说明这意味着该论断暂无外部支撑——不要拿背景类的凑数

# =============================================================================
# 五、客户选择与留痕
# =============================================================================
client_choice:

  rule: |
    **agent 不自行采纳任何一条外部证据。** 呈排序表，客户勾选，选中的才写入
    project.yaml 的 evidence 段并建 Mandate 节点与相应的边。

  why: |
    政策适配性的最终判断需要项目所在地的实务经验——
    某条地方规定在实际审批中是不是这么执行的，agent 查不到。
    而且采纳哪条政策会影响报告的论证走向，这是客户的决定，不是工具的决定。

  record_both:
    adopted: 写入 evidence + Mandate 节点，记录适配性总分与各维分值、检索日期、客户确认人
    considered_but_not_adopted: |
      未采纳的也要留痕，记入 project.yaml 的 `screened_evidence` 段，
      含文件名、否决/落选原因、检索日期。
      评审问"为什么没引用某某文件"时，这段留痕就是答案；
      没有它，看起来就像是没检索到。

  reask_trigger: |
    以下情况需要把某条重新拿回来让客户重选：
      · 项目所在地或投资主体在分诊后被修正（F1/F3/V2/V4 需重算）
      · 建设性质变更（新建↔改扩建↔拆除重建）
      · 出稿前的 E2 复核发现该文件已被替代
      · 客户在改稿时删掉了引用该文件的段落

# =============================================================================
# 六、检索策略
# =============================================================================
search_strategy:

  layered:
    order: [项目所在地的市/县级, 省级, 国家级, 行业主管部门]
    why: 自下而上先找最具体的。找到市级规定就不必拿省级当直接依据了

  facets:
    must_include_in_query:
    - 项目所在地（省 + 市）
    - 用房类型或行业类别
    - 要论证的那件事（配建比例 / 面积指标 / 审批程序 / 资金渠道）
    note: 三个都不带的检索式会捞回一堆背景类文件，浪费客户的选择注意力

  freshness: 检索结果按发布日期排序复查一遍——被替代的新文件常常排不到前面

  negative_result: |
    检不到就说检不到。禁止用一份"沾边"的文件顶上去。
    检不到时的正确处置：告诉客户"该事项未检索到可引依据"，
    并问客户手上有没有（地方内部文件、主管部门口头口径常常查不到）。

# =============================================================================
# 七、检查
# =============================================================================
constraints:

  C10_fit_assessed:
    cn: 外部证据须经适配性评估与客户确认
    rule: |
      每条 provenance ∈ {E2_normative, E3_external, E5_analogical} 的证据，
      若被任何论断引作 warrant 或 backing，必须带：
        a) fit 段（六维分值 + 总分）
        b) adopted_by（客户确认人）与 adopted_at
      缺 a 报 warning，缺 b 报 error。
    severity: {a: warning, b: error}
    why: |
      缺 b 意味着这条是 agent 自己塞进去的。
      本 skill 的全部可信度建立在"事实和依据都由人确认过"之上，
      这一条是它在外部证据侧的落点。

  C10b_jurisdiction:
    cn: 地方性依据须与项目所在地一致
    rule: |
      证据标记了 jurisdiction（效力地域）时，必须包含 project.location。
      不包含则报 error，不论其适配性总分多高。
    severity: error
    why: 跨地域套用地方规定是本文件开头列的第一号事故，值得一条独立的机检

# =============================================================================
# 八、实例图中的记录格式
# =============================================================================
project_yaml_section:
  example:
    evidence:
      EV_LOCAL_CD:
        provenance: E2_normative
        doc_no: 某地人防主管部门规范性文件
        title: 防空地下室配建规定
        jurisdiction: [某省, 某市]
        applies_to: [公共设施用地建设项目]
        clause: 第X条
        fit:
          F1_jurisdiction: 3
          F2_category: 3
          F3_subject: 2
          F4_currency: 3
          F5_authority: 1
          F6_specificity: 3
          total: 2.6
          bucket: recommended
        proposed_role: [benchmark, domain]
        searched_at: 2026-07-05
        adopted_by: 建设单位基建处 张工
        adopted_at: 2026-07-06
    screened_evidence:
    - title: 邻省的同类配建规定
      veto: V2_jurisdiction_miss
      searched_at: 2026-07-05
      note: 效力地域不含本项目所在地，仅作检索过程留痕
