# =============================================================================
# 双向变更回读 (L0)
# -----------------------------------------------------------------------------
# 报告交付之后，客户一定会直接改 Word 文档——这是常态，不是异常。
# 如果不处理，那份被改过的稿子就脱离了本体图谱，此后所有一致性保证全部失效：
# 客户改了第 5 章的总建筑面积，第 7 章的能耗、第 8 章的造价、第 1 章的技术
# 经济指标表全都还是旧值，而且没人知道。这正是本方案要消灭的那类事故。
#
# 所以变更必须双向：
#   图 → 文（正向）：改图上节点，重算派生，重写受影响章节
#   文 → 图（反向）：客户改了正文，回读为图上的节点变更，再走正向传播
#
# 反向是更难的一半，因为要先回答：这段被改的文字，对应图上哪个节点？
# =============================================================================

meta:
  id: fsr-reconcile
  layer: L0
  version: 0.1.0
  depends_on: [fsr-core, fsr-interaction]

# =============================================================================
# 0. 两种承载模式 —— 优先用协同文档
# =============================================================================
carrier_modes:

  preferred:
    id: collaborative_doc
    cn: 在线协同文档（腾讯文档 / 飞书文档 / 石墨等）
    why: |
      反向回读最难的一步是「把改动定位到节点」。
      docx 往返模式下只能靠书签 + 位置匹配去猜，脆弱且会漏。
      协同文档平台能提供**稳定的块 ID 与变更事件**，绑定关系就是确定的，
      不需要猜。这不是优化，是把一个不可靠环节换成可靠环节。
    requires_from_platform:
      - 稳定块 ID：段落/表格/单元格有不随编辑变化的标识
      - 变更事件：谁、何时、哪个块、改前值、改后值
      - 回写能力：agent 能就地更新下游块（否则只能提醒，不能同步）
      - 批注或建议模式（可选但很有价值）：影响提示直接挂在段落旁
    binding: |
      渲染时建立 node_id ↔ block_id 的双向映射，存入 bindings.json。
      一个块可能承载多个节点（一段话里有三个数字），
      所以映射是 block_id → [node_id]，块内再按 span 细分——
      但搜索范围已从全文缩小到一个段落，文本匹配这时是可靠的。
    unlocks:
      实时传播: |
        客户改动即时触发影响分析，当场在文档里批注：
        「您把总建筑面积改成了 26800。受影响：造价(第7章)、
         用电负荷(第5章)、综合能耗(第8章)、技术经济指标表(第1章)。
         确认后我同步更新这 4 处。」
        比事后批量回读好得多——客户还记得自己为什么要改。
      冲突前置: 改动违反 SSOT（如只改了复述处）时当场拦下，而不是等交稿

  fallback:
    id: docx_roundtrip
    cn: Word 文档往返
    when: 客户不用协同文档，或必须走离线报批流程
    note: 下面第 1-2 节的锚点与 diff 机制即为此模式设计。
          它能用，但无主变更率会明显高于协同模式，需要更多人工判定。

# =============================================================================
# 1. 锚点 —— 反向回读的前提（docx 模式）
# =============================================================================
anchoring:

  principle: |
    渲染时就把绑定关系埋进去，而不是事后靠文本匹配去猜。
    事后猜是不可靠的：同一个数字「26400」在全文出现十几次，
    有的是总建筑面积，有的是造价表的计量基数，靠正则分不清。

  mechanism:
    primary: 渲染 docx 时为每个事实值写入书签/内容控件，命名为 node id
    sidecar: |
      同时输出一份 anchors.json 旁挂映射：
        {node_id: [{section, para_index, char_span, rendered_text, value}]}
      书签可能被客户的编辑操作破坏，旁挂映射提供第二条回溯路径。
    claim_level: 论断段落同样打锚点，绑定 claim key，用于识别论证实质改动

  what_gets_anchored:
    - 全部 quantity / money / ratio / duration 类节点的每一次出现
    - 全部 claim 的论点句与限定句
    - 全部 Mandate 引用（政策法规名称与文号）
    - 表格的每个数据单元格

  what_does_not:
    - 纯过渡性文字、描述性段落
    - 客户在无锚点区域新增的内容 → 走「图外内容」处理，见第 4 节

# =============================================================================
# 2. 回读流程
# =============================================================================
reconciliation:

  trigger: 客户返回一份被编辑过的 docx

  steps:

    R1_diff:
      action: 与上次渲染的版本做结构化比对
      output: 变更片段清单（新增/删除/修改，含位置）
      note: 比对的是渲染快照，不是客户手上任意版本。必须保留每次渲染的快照

    R2_locate:
      action: 每个变更片段回溯到节点
      order_collaborative:
        1: 变更事件带块 ID → 查 bindings.json 得到该块承载的节点集
        2: 块内多节点 → 在该段落范围内按 span 与原值匹配（搜索空间小，可靠）
        3: 块无绑定 → 「图外内容」，见第 4 节
      order_docx:
        1: 命中书签/内容控件 → 直接得到 node id
        2: 书签丢失 → 用 anchors.json 的位置 + 原文本匹配
        3: 都失败 → 归入「无主变更」，交人工判定
      note: |
        无主变更比例是回读质量的度量。
        协同模式下应接近 0；docx 模式下持续偏高说明锚点机制需要加固。

    R3_classify:
      action: 判定变更类型，决定如何处置
      types: 见第 3 节

    R4_impact:
      action: 对被接受的节点变更，沿 derives / aggregates / allocates / restates 边前向传播
      output: |
        影响清单，逐条说明：
          - 哪些派生值会变（旧值 → 新值）
          - 哪些章节需要重写（及重写的是哪几段）
          - 哪些论断的 qualifier / robustness 需要更新
          - 哪些法定覆盖会因此不再成立（C7）
      note: 先出清单再执行，让客户看见这一笔修改的真实代价

    R5_apply:
      action: 客户确认后回写图，重算受影响子图，重跑 C1-C7，重写受影响章节
      forbidden: |
        静默保留过期文字。上游改了而下游正文没改，
        就是「18319 vs 18219」那类事故的成因——如果系统也这么干，就没有任何改进。

# =============================================================================
# 3. 变更分类与处置
# =============================================================================
change_types:

  T_given:
    cn: 改了客户给定事实
    example: 总建筑面积 26400 → 26800（设计方案调整）
    node_tier: core
    action: 接受
    then: 触发正向传播，重算全部下游
    note: 这是最正常的一类。图的存在意义就是让这类改动的影响可计算

  T_derived:
    cn: 改了派生值
    example: 直接把总投资从 20365 改成 21000，但没改建安费
    node_tier: derived
    action: 拒绝并解释
    message_template: |
      您修改的「{node}」是由 {formula} 计算得出的，不能直接改。
      当前上游取值：{upstream_values}
      若要得到 {new_value}，需要调整的是：{suggested_upstream}
      请确认要改哪一项。
    why: |
      允许直接改派生值，等于允许图与正文脱节。
      客户想要的从来不是"这个数变成 21000"，而是"造价上去了"——
      问清楚是哪一项涨了，下游才能跟着对。

  T_restated:
    cn: 改了复述处的值
    example: 只改了第 1 章总论里的面积，第 5 章正源没改
    action: 拒绝并解释
    message_template: |
      「{node}」在本报告中出现 {count} 处，其权威来源是 {origin_section}。
      您改的是第 {edited_section} 章的复述。
      若确需修改，请在 {origin_section} 修改，全部 {count} 处会同步更新。
    why: 这正是 SSOT 要解决的问题。允许改复述处，等于允许制造不一致

  T_prose:
    cn: 改了行文，事实未变
    example: 把「本项目建设条件具备」改成「本项目建设条件良好」
    action: 接受，不动图
    note: 记入文风偏好，后续章节生成时沿用客户的措辞习惯

  T_claim:
    cn: 改了论断实质
    example: 把「风险等级为低」改成「风险等级为中」
    action: 接受但要求补证据
    then: |
      该论断的 grounds / warrant / backing 需重新确认，
      且若该论断有 restated_in，全部复述处同步更新。
      风险等级这类由 lookup 规则派生的，还要回头改 likelihood / severity。

  T_delete:
    cn: 删除了内容
    action: 检查法定覆盖
    then: |
      若删除导致某条法定 covers 失去承载 → C7 报 error，
      并明确告知这一条来自哪本大纲哪一款，删了会在评审环节被打回。

  T_orphan:
    cn: 无主变更
    action: 交人工判定
    note: 无法回溯到节点的改动。见第 4 节

# =============================================================================
# 4. 图外内容
# =============================================================================
out_of_graph:

  problem: |
    客户在无锚点区域新增了一段文字，里面可能含有新的事实、新的论断、
    甚至新的数字。这些内容游离在一致性检查之外——它们不会被 C1-C7 检查到，
    却会被评审专家看到。

  policy:
    - 识别新增段落中的数字、政策法规名称、判断性语句
    - 逐条询问：这是否应当建为图上的节点/论断/Mandate
    - 建节点的 → 补齐来源与证据，纳入检查
    - 不建节点的 → 标记为「图外文字」，在最终一致性报告中单独列出并声明未经检查
  why: |
    不能假装图外内容不存在，也不能强迫客户把每句话都结构化。
    诚实的做法是：明确告诉客户哪些部分在保护范围内、哪些不在。

# =============================================================================
# 5. 版本与留痕
# =============================================================================
versioning:

  snapshot_on_render: 每次渲染 docx 都保存快照 + anchors.json + 图状态
  change_log:
    fields: [时间, 变更来源(客户编辑/图上修改), 节点, 旧值, 新值, 影响范围, 处置, 确认人]
  why: |
    可研报告要过评审、要备案，出了问题要能倒查。
    派生轨迹（E4 证据）+ 变更日志，共同构成报告的可审计性。
    这也是本方案相对"人写一遍"的一个不可替代的优势。

  reopen_outline: |
    若变更导致章节增删（如新增一栋单体需要加一节），
    骨架需重新走确认闸门，版本号 +1，不允许静默改动——
    因为全图的 requires/provides/restates 都引用章节 id。
