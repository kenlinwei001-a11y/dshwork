# =============================================================================
# 来源路由（L0）—— 每一条信息从哪来，由这张表判定
# -----------------------------------------------------------------------------
# 这是全 skill 最要紧的一次判断。一份可研里的每一条信息，
# 只可能来自四条路径之一：
#
#   ASK      只有客户手上有        → 问，问不到就留白
#   SEARCH   公开可查              → agent 自己查，不占客户时间
#   COMPUTE  由已确认的量算出      → 算，绝不许手填
#   WRITE    由已确认的事实组织成文 → agent 起草
#
# 还有第五种，必须单列出来：
#
#   WITHHOLD 四条路径都不成立      → 留白并写明待补，**不许编**
#
# 路由错了，后果各不相同，但都严重：
#   把 ASK 当 WRITE   → 编造。最危险，且成品最通顺，最不容易被发现
#   把 SEARCH 当 ASK  → 拿本该自己查的事去占客户时间，客户会失去回答的耐心，
#                       真正只有他能答的那几问反而被敷衍
#   把 COMPUTE 当 ASK → 客户手填了一个派生值，图与正文从此脱节（C2 会报）
#   把 WRITE 当 ASK   → 把行文工作推给客户，等于没干活
#
# 本文件是路由的权威定义。interaction.yaml 规定动作**怎么执行**，
# 本文件规定动作**该选哪个**。
# =============================================================================

meta:
  id: fsr-provenance-routing
  version: 0.1.0
  layer: L0

# =============================================================================
# 一、判定程序 —— 按顺序问，第一个命中的就是路由
# =============================================================================
# 顺序不可颠倒。COMPUTE 必须排在 ASK 之前，否则可派生的量会被问出来手填。
# =============================================================================
decision_procedure:

  step1:
    test: 这个量能不能由图中其他节点按某条规则算出？
    yes: COMPUTE
    note: |
      **排第一位是有意的。** 总投资、总面积、缺额、单方造价都能算。
      能算的去问客户，客户会给一个他自己算的数——那个数和图里的数迟早对不上。
    caution: 规则的输入齐了才 COMPUTE；输入不齐时，对**输入**继续路由，而不是退回问结果

  step2:
    test: 这个事实是不是只存在于客户的组织内部？
    yes: ASK
    tests_for_yes:
    - 它记在客户的台账、财务系统、人事系统、内部会议纪要里
    - 它是客户的决策或意图（要建多少、怎么筹钱、谁来运营）
    - 它是客户委托第三方产出的成果（设计方案、投资估算、专项评估）
    - 它是发给客户本人的行政文件（批复、决议、下达文件）
    note: 第三、四项通常以**素材**形式提供，见 references/materials.yaml

  step3:
    test: 这个信息是不是公开发布、任何人都能查到的？
    yes: SEARCH
    tests_for_yes:
    - 法律、法规、规章、规范性文件、标准规范
    - 上位规划、行业政策、统计公报
    - 公开披露的同类项目信息（属 E5，须评可比性）
    hard_rule: |
      SEARCH 回来的东西**不直接入图**。必须先过适配性评估与排序，
      交客户勾选，选中的才入图。规则见 references/external-fit.yaml。
      这是 SEARCH 与 COMPUTE 的关键差别：算出来的可以直接用，查回来的不行。

  step4:
    test: 这段内容是不是对已确认事实的组织、解释、论证与表述？
    yes: WRITE
    note: 见下节「WRITE 的边界」——这一步最容易越界

  step5:
    otherwise: WITHHOLD
    do: |
      正文该处写「待 <具体是什么> 确认后生成」，列入缺口清单，说明它卡住哪几章。
      **不估、不套同类项目、不写暂按经验值。** 见 materials.yaml 的 no_fabrication。

# =============================================================================
# 二、WRITE 的边界 —— agent 能生成什么，不能生成什么
# =============================================================================
# 这一节是 WRITE 与编造之间的那条线。写得比别处细，因为它最容易滑过去。
# =============================================================================
write_boundary:

  can_generate:
  - id: W1
    what: 事实的自然语言表述
    example: 把 scale.design_total=19500 写成"本项目总建筑面积 19500 ㎡"
    constraint: 正文里写的是 `{{scale.design_total}}`，渲染时注入。不许敲字面数字

  - id: W2
    what: 论证的组织结构
    example: 把已确认的论据、保证、支撑按 Toulmin 六元组编排成一段完整论证
    constraint: 六元组的**内容**必须各有来源；agent 组织它们的顺序与衔接，不新增断言

  - id: W3
    what: 派生关系的解释文字
    example: "总投资由建安费、其他费与基本预备费构成，其中基本预备费按前两项之和的 5% 计取"
    constraint: 解释的是图上真实存在的规则，不是编一个听起来合理的算法

  - id: W4
    what: 法定章节的结构性内容
    example: 编制依据清单、政策法规符合性对照表、章节导语与小结
    constraint: 对照表是 complies_with 边全集的渲染结果，不是手写的

  - id: W5
    what: 定性的通用技术条款
    example: 无障碍设计、绿色施工、文明施工的一般性要求
    constraint: |
      **只在客户未提供专项方案时作为占位性通用条款，且必须标注为通用条款并请客户确认。**
      通用条款一多，评审会指出"套模板"。凡本项目有特殊性的（实验室通风、
      食堂燃气、危化品储存），必须写实，写不实就走 ASK。

  - id: W6
    what: 风险清单的候选项
    example: 从项目性质推出"拆除手续未办结"属前置条件风险
    constraint: 候选项交客户确认取舍与应对措施；agent 不自行判定风险等级

  cannot_generate:
  - id: X1
    what: 任何数值
    unless: 它是 COMPUTE 出来的，或从素材中带 from 抽取的
    note: 这一条没有例外。"约""大致""量级在"都不行

  - id: X2
    what: 客户的意图与决策
    example: 资金怎么筹、建成后谁运营、要不要分期
    note: 这类内容读起来像技术判断，实则是客户的决定。写了就是替客户表态

  - id: X3
    what: 外部依据的存在性
    example: 声称"符合《某某规划》要求"而没有真去查那份规划里有没有对应条款
    note: 这是最常见的一种编造，因为它不含数字，看起来无害。C5 会追问 backing 在哪一条

  - id: X4
    what: 现状描述
    example: 现有用房多拥挤、设备多老旧、师生反映多强烈
    note: |
      现状只有客户知道。凭"一般高校都这样"写出来的现状，
      恰恰是必要性论证的地基——地基是编的，整章都是空的

  - id: X5
    what: 第三方成果的结论
    example: 代拟环评结论、代拟稳评结论、代拟造价
    note: 这些要么等素材，要么写"待 XX 单位出具"。代拟会被当成已有结论使用

  self_test: |
    写完一段，逐句问：**这句话如果被评审专家追问"依据是什么"，我答得上吗？**
    答不上的那一句，就是刚刚编的。删掉它，改成缺口条目。

# =============================================================================
# 三、按槽位族的路由表 —— 常见量的默认归属
# =============================================================================
# 这是 step1–step5 的预判结果，用于快速分诊。
# 有冲突时以判定程序为准，不以本表为准。
# =============================================================================
routing_table:

  ASK:
    cn: 必须客户输入
    families:
    - slot: "*.headcount / enroll.* / program.*"
      why: 人员与规模的规划数出自客户的事业发展规划，外部查不到
      caution: 必须一并问清**口径**（全校/校区/本期、在编/在岗/规划）
    - slot: "*.existing.*"
      why: 现有存量出自客户的房产台账。缺额法的减数，没有它规模论证不成立
    - slot: "scale.* （设计规模）"
      why: 出自设计单位的方案，属客户委托成果
    - slot: "cost.construction / cost.other / 各项费率的实际取值"
      why: 出自造价咨询单位。**费率的规范依据可 SEARCH，本项目的实际取值必须 ASK**
    - slot: "funding.*"
      why: 资金来源与落实情况是客户的决策与承诺
    - slot: "land.* / 权属 / 红线"
      why: 出自权属证明与测绘成果
    - slot: "duration.* / schedule.*"
      why: 客户的实施安排
    - slot: "project.funding_regime / location / nature"
      why: 分诊四问，无法从项目名称可靠推断
    - slot: "prior_approvals / 批复文号与内容"
      why: 发给客户本人的行政文件，属 E6
    - slot: "运营模式 / 管理机构 / 收费标准"
      why: 客户的决策
    - slot: "各类能耗、定额、指标档位（客户给不出时可回退检索候选，见 ask_fallback）"
      why: 路由仍是 ASK，但存在公开发布的基准值，客户给不出时不必死等
      caution: 回退检索得来的值**不得标 E1_given**，须标真实来源等级 + is_placeholder
    - slot: "各类口径声明（架空层是否计入、设备费是否计入总投资）"
      why: |
        **最容易被漏问的一族。** 它们不是数字，是数字的定义。
        口径不问清楚，算出来的每个数都可能是错的，而且错得看不出来。

  SEARCH:
    cn: agent 自行检索
    families:
    - slot: "index.* （面积指标、定额指标）"
      why: 出自标准规范
      caution: |
        **指标的规范值可查，本项目取哪一档要问。** 边界情形（某类用房是否在
        标准适用范围内）查不清楚就标 uncertain 交客户，不要自行认定
    - slot: "*.rate （强制配建比例、预备费费率的规范依据）"
      why: 出自地方法规与计价依据
      caution: 地方规则逐省逐市不同，检索必须带项目所在地分面
    - slot: "mandate.* （政策、法规、标准、上位规划）"
      why: 公开发布
      hard_rule: 必须过 external-fit.yaml 的适配性评估与客户勾选，不得自行采纳
    - slot: "规范的现行状态与正式名称"
      why: 可查
      hard_rule: 查不到就标 in_use_unverified 并写明查过哪些渠道，绝不臆断（norms.yaml）
    - slot: "气象、地质、抗震设防烈度等地域参数"
      why: 公开标准与公开资料
    - slot: "同类项目的公开信息"
      why: 属 E5_analogical
      hard_rule: 必须写明可比性条件，否则 C5a 报错；且不得用来填本项目的空槽（NF1）
    priority: 尽量批量前置。SEARCH 不占客户时间，早做完早解锁

  COMPUTE:
    cn: 由图派生，不许手填
    families:
    - slot: "*.demand / *.required （应建面积）"
    - slot: "*.deficit （缺额）"
    - slot: "scale.above_total / scale.design_total （面积汇总）"
    - slot: "cost.contingency / cost.total / cost.unit_price"
    - slot: "funding.total 及资金平衡校验"
    - slot: "各类配建面积、负荷、用水用电量"
    - slot: "各类比率、偏差率、达标判定"
    hard_rule: |
      派生值出现在 ASK 清单里，说明路由错了。
      正确做法是回去看它的规则缺哪个**输入**，对输入路由。

  WRITE:
    cn: agent 起草
    families:
    - slot: 全部正文行文与论证组织
    - slot: 编制依据清单、政策符合性对照表
    - slot: 章节导语、小结、过渡
    - slot: 通用技术条款（须标注并请客户确认）
    - slot: 风险候选清单
    constraint: 受 write_boundary 约束。凡越出 can_generate 的，退回 ASK 或 WITHHOLD

  WITHHOLD:
    cn: 留白待补
    when:
    - 客户明确表示暂时给不出，且无可接受的替代物
    - 第三方成果尚未出具
    - 检索确实检不到可引依据
    form: |
      正文该处写「待 <具体是什么> 确认后生成」；
      缺口清单里写明：卡住哪几章、服务哪个维度、找谁要、不给的后果。
    never: 用一段通顺的占位文字盖过去

# =============================================================================
# 三之二、ASK 回退检索 —— 客户给不出时，检索候选值请客户选
# -----------------------------------------------------------------------------
# 有一类槽位路由是 ASK，但客户确实给不出：能耗指标、用水定额、单方造价参考、
# 生均面积档位……这些东西**有机构公开发布过基准值**。
# 死等 ASK 会把项目拖住；直接拿公开值填进去就是 NF1（用别处的数填本项目的空槽）。
#
# 正解是第三条路：**检索候选 → 排序 → 客户选 → 入图但不升级证据等级。**
#
# 它与编造的分界线，全部落在这三件事上：
#
#   ① 候选值**呈给客户选**，不是 agent 挑一个用
#   ② 入图后**保留真实来源等级**（E2/E3/E5），不得标成 E1_given
#      —— 标成 E1 就等于宣称"这是本项目的实测值"，那才是编造
#   ③ 标 is_placeholder: true 并写明**何时必须换成本项目的实定值**
#
# 做到这三条，报告里那个数字是诚实的：它写着"参照某机构发布的基准值，
# 待设计单位核定后更新"。评审看得懂，也接受——可研阶段本来就允许这样。
# 做不到，它就是一个伪装成实测值的估算。
# =============================================================================
ask_fallback:

  trigger: |
    该槽位路由为 ASK，且满足其一：
      · 客户明确表示给不出（无台账、无委托方、无测算）
      · 追料已到 decide 决策点（materials.yaml → intake_sla）
      · 该值属"设计深度未到"——可研阶段本就拿不到实定值

  eligible:
    cn: 允许回退检索的槽位类型
    rule: 只有**存在公开发布的基准值或定额**的槽位才允许。判据是"查得到权威发布"
    classes:
    - class: 能耗与资源消耗指标
      examples: [单位面积能耗基准, 用水定额, 用电指标, 冷热负荷指标, PUE 参考值]
      typical_source: 国家与地方能耗标准、节能设计标准、行业能耗统计与限额公告
      provenance_after: E2_normative（标准限额）/ E3_external（机构发布的统计基准）

    - class: 定额与费率
      examples: [预备费费率, 工程建设其他费费率, 各专业估算指标]
      typical_source: 计价依据、造价管理机构发布的估算指标
      provenance_after: E2_normative

    - class: 面积与配置指标的档位
      examples: [生均面积指标档位, 配建比例, 车位配建标准]
      typical_source: 建设标准、地方规划管理技术规定
      provenance_after: E2_normative
      caution: 规范给的是区间或分档，**选哪一档仍须客户确认**（边界情形 E1）

    - class: 单方造价的量级参照
      examples: [同类项目建安单方造价]
      typical_source: 公开披露的同类项目
      provenance_after: E5_analogical
      hard_rule: |
        **只能佐证合理性，不能充当取值。** 本项目的造价必须来自造价单位。
        把 E5 当成 cost.construction 的值填进去，就是 NF1。

    - class: 地域参数
      examples: [抗震设防烈度, 气象参数, 冻土深度, 地震动参数]
      typical_source: 公开标准与官方发布
      provenance_after: E2_normative
      note: 这一类其实本就该 SEARCH，列在这里是因为常被误当成 ASK

  ineligible:
    cn: 禁止回退检索的槽位类型
    rule: 凡"只存在于本单位内部"的，检索到的任何值都不是它。查到了也不能用
    classes:
    - class: 现状描述
      why: 现有用房多拥挤、设备多老旧——只有客户知道。见 write_boundary X4
    - class: 存量台账
      why: 现有面积、现有床位是缺额法的减数。用别处的数算缺额，缺额就是假的
    - class: 人员与办学规模
      why: 出自客户的事业发展规划。行业平均值不是本单位的规划数
    - class: 客户的意图与决策
      why: 资金怎么筹、谁运营、要不要分期。见 write_boundary X2
    - class: 行政文件的内容
      why: 批复文号、批复的建设内容——检索不到，也不该猜
    - class: 本项目的设计取值
      why: |
        设计单位的成果。可以用行业典型值作**候选**请客户或设计单位确认，
        但确认前不得当作设计值使用，且必须标 is_placeholder。
    on_violation: 这几类走 WITHHOLD，正文留白并写明待补。不许回退检索

  procedure:
    step1_search:
      do: 按 external-fit.yaml 的分层检索策略找候选值
      must_include_in_query: [项目所在地, 建筑/项目类型, 要找的那个指标名, 发布年份]
      note: 不带地域与类型的检索会捞回一堆不可比的数

    step2_rank:
      do: 按数值候选的适配性维度打分排序
      tool: "scripts/fit_rank.py --mode value"
      note: 数值候选的评分维度与政策候选不同——见 external-fit.yaml → value_fit_dimensions

    step3_present:
      do: 呈候选表请客户选，每条必须给全五件事
      must_show:
      - 数值与单位
      - 出处（发布机构、文件名、发布年份、条款或表号）
      - 统计口径（按建筑面积还是使用面积？含不含地下？是限额还是平均值？）
      - 适配性评分与为什么排在这个位置
      - 选中后在报告里会怎么写（含"参照发布值，待核定"的措辞）
      must_offer: 「以上都不合适」与「我方另有取值」两个选项，别把客户逼进候选表

    step4_record:
      do: 客户选中后入图，按下表标注
      fields:
        value: 选中的数值
        provenance: 真实来源等级（E2/E3/E5）—— **不得标 E1_given**
        source: 发布机构与文件
        from: {material: 检索留痕 id, locator: 条款或表号}
        is_placeholder: true
        adopted_by: 客户确认人
        adopted_at: 确认日期
        refine_when: 何时必须替换（如"设计单位出具能耗计算书后"）
      also: 未选中的候选记入 screened_evidence，与政策候选同一规格

  provenance_rules:
    never_upgrade: |
      **回退检索得来的值永远不升级为 E1_given。**
      E1 的含义是"客户给定"，它承载的是责任归属：出了问题谁负责。
      把一个查来的值标成 E1，等于把责任悄悄记到客户头上，
      而客户从没说过这个数。这比数字本身错了更严重。
    placeholder_lifecycle: |
      is_placeholder: true 的节点，在 G4 出稿前必须逐条过一遍：
      要么已被实定值替换（去掉标记），要么客户确认"就按参照值出稿"
      （保留标记，正文措辞如实写明）。**不允许静默保留。**
    in_text_wording: |
      正文必须写明它是参照值，不能写成本项目的实测/实定值。
      「本项目单位面积能耗按《某标准》公共建筑约束值 XX 取，
       待设计单位出具能耗计算书后核定」——这是可接受的。
      「本项目单位面积能耗为 XX」——这是不可接受的，因为它宣称了一个没有的事实。

  boundary_with_NF1:
    cn: 与「不得编造」的界线
    table:
    - act: agent 检索到一个值，直接填进节点
      verdict: 违反 NF1
      why: 客户没选，也没标来源等级，读者无从分辨它是本项目的数还是别处的
    - act: agent 检索到若干候选，呈给客户，客户选一个，标 E2/E3 + is_placeholder
      verdict: 合规
      why: 值有出处、有人确认、有真实等级、有替换时点。四件事齐了它就是诚实的
    - act: agent 检索到同类项目造价，填进 cost.construction
      verdict: 违反 NF1，无论客户选没选
      why: E5 只能佐证合理性，不能充当取值。造价必须来自造价单位
    - act: 一条候选都检不到
      verdict: 走 WITHHOLD
      why: 检不到就说检不到。不许用一个"沾边"的值顶上

# =============================================================================
# 四、边界情形 —— 路由不唯一的几种，处置方式
# =============================================================================
edge_cases:

  E1_norm_value_vs_project_value:
    case: 规范给了一个区间或若干档，本项目取哪一档
    routing: SEARCH 拿到区间与分档规则 → ASK 确认本项目取值 → 两者都入图
    why: 只 SEARCH 会替客户选档；只 ASK 则失去规范依据，warrant 落空

  E2_customer_gave_a_derivable:
    case: 客户直接给了一个可派生的量（比如直接给总投资）
    routing: |
      两个都入图：客户给的记为 declared，图里算的记为 recomputed，
      由 C2 比对。**不许用客户给的值覆盖派生值，也不许悄悄改客户给的值。**
    why: 两者不一致本身就是重要发现——真实报告里的口径问题就是这样浮出来的

  E3_customer_cites_a_norm:
    case: 客户在素材里引用了某规范
    routing: 素材里的引用记为 E1（客户这么写的）→ 同时 SEARCH 核验编号、名称、现行状态
    why: 引错规范名称是高频错误，C5g 专抓这个

  E4_agent_infers_from_name:
    case: 从项目名称推断建设性质、功能类型、地域
    routing: 推断结果一律进 ASK 确认队列，不得默认采信
    why: 高校常有多校区，注册地与项目所在地经常不是一个地方

  E5_industry_common_practice:
    case: 所谓「业内通行做法」（如配套用房换算系数 0.55）
    routing: ASK。标 E1_given（编制单位口径），不得标 E2_normative
    why: 标成规范会让 C5 去找一个不存在的规范依据，然后误报——更糟的是可能不报

# =============================================================================
# 五、检查
# =============================================================================
constraints:

  C11_routing_respected:
    cn: 路由不得违反
    rule: |
      a) provenance == E4_derived 的节点必须有对应规则（否则是手填的派生值）
      b) provenance == E1_given 的节点不得同时是某条规则的 target
         —— 除非显式标 declared_vs_recomputed（边界情形 E2）
      c) provenance == E2_normative 的节点必须能指向 norms.yaml 中的登记项
      d) 出现在 ASK 清单里的节点，不得是任何规则的 target
    severity: {a: error, b: error, c: warning, d: warning}
    why: |
      这四条把路由表变成可机检的东西。
      d 尤其重要——它是"把 COMPUTE 当 ASK"这个错误的唯一自动出口。
