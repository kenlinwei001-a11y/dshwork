# =============================================================================
# 历史报告语料库（L0）—— 参照怎么写，而不是参照写了什么
# -----------------------------------------------------------------------------
# 把做过的报告攒成库、写新报告时按章检索参照，这个思路是对的。
# 图谱管不了的东西恰好都在这里：该审批口认可的话术、章节的详略与铺陈、
# 表格的栏目设置、纯定性内容（单位概况、通用条款）的行业写法。
#
# 但它有一个必须先划清的界线，否则会变成「套模板」事故的加速器：
#
#   **检索到的历史章节里混着两种东西——可复用的「形」和不可复用的「值」，
#     而它们在文本里长得一模一样。**
#
# 参照写作时最常发生的错误不是没参照，是**参照得太完整**：
# 上一份的面积、单方造价、地方配建比例、规范编号、政策文号，
# 顺手就带进了新报告。带进来之后，正文读起来毫无异常——
# 这正是这类错误最难被发现的原因。
#
# 所以本库的设计原则只有一条：**入库即脱值**。
# 库里存的是打了槽位标记的骨架，物理上带不出值来。
# 值仍然只有一个来源：图谱。
#
#   语料库    →  形（结构、话术、详略、表格栏目、论证铺陈）
#   图谱      →  值（每个数字、每条依据、每个口径）
#   法定大纲  →  覆盖（必须写到什么）
#
# 还有一条更要紧的：**历史库不是正确性的来源。**
# 我们验过的两份真实报告，一份缺 8 章法定内容、一份缺 6 章，
# 还各有断链论证与错引规范名称。拿它们当模板，等于把缺陷一并继承。
# 所以入库时必须跑检查器并把缺陷标在库里，检索时一并返回。
# =============================================================================

meta:
  id: fsr-corpus
  version: 0.1.0
  layer: L0

# =============================================================================
# 一、库条目的构成 —— 三份，不是一份
# =============================================================================
entry:

  layout:
    cn: 条目的目录结构
    tree: |
      corpus/<entry-id>/
      ├── entry.yaml          元数据 + fit_meta + 每章的「形」 + 缺陷 + 投影自检
      ├── index.yaml          chunk 索引：id / 所属章 / 标题 / 段数字数 / 功能配比 / 表栏
      ├── meta.yaml           入库配方（脱敏词表 + 切章规则）
      └── chunks/
          ├── technical-01.md   设计总说明
          ├── technical-02.md   建筑设计
          ├── technical-03.md   结构设计
          └── …
    granularity: |
      **存储、检索、写作、图谱锚定用同一个粒度：语义 chunk。**
      一开始按「章」存，一份 MD 一万四千字——写给排水那一节，
      检索出来的是整个设计方案章，没法用。
      chunk 的边界取「写作单元」：一次可交付的写作、一次可核对的事实闭合。
      实测一份 5.4 万字的高校科研用房可研切出 71 个 chunk，
      其中设计方案章 7 个（设计总说明 / 建筑 / 结构 / 给排水 / 强电 / 弱电 / 暖通）。
    chunk_id: |
      `章节key-序号`，如 technical-03。**不用内容哈希**——
      哈希会在改一个错别字之后变，而图上挂着的引用不该因此断掉。
    why_md: |
      正文落 MD 不落 YAML，是因为入库会报回一批**疑似漏投影的专名**
      （实测 29 个），这些必须有人过一遍。40 万字塞进一个 YAML 没人读得动，
      读不动就没人过，那批专名就会留在库里，迟早被带进新报告。
      拆成 MD 还有第二个作用：检索只读 index.yaml 与 entry.yaml，
      **物理上不可能顺手把原文带进起草上下文**。

  skeleton:
    cn: chunk 骨架（脱敏投影后的正文）
    what: 按语义 chunk 切片的正文，其中全部数值、专名、文号、规范编号已替换为槽位标记
    use: 人工核对投影是否干净
    hard: |
      **它不是"允许拿去参照行文"的部分。** 检索默认不返回它，
      要看得显式索取（--show-skeleton）。原文一旦进起草上下文，
      模型就不再是「写」而是「改」，产出必然带着那份报告的骨相。
      能进起草上下文的只有 index.yaml 里量出来的形。

  graph:
    cn: 该报告的图谱编码
    what: 与骨架配套的 project.yaml
    use: |
      两个用途：① 知道每个槽位对应哪个节点，参照时能看懂这一段在讲什么量；
      ② 可以对这份历史报告做验算，看它自己的数对不对
    hard: 它是**那个项目**的值，不是新项目的值。任何情况下都不许拿来填

  defects:
    cn: 入库检查得到的缺陷清单
    what: 入库时跑一遍 validators.py，把结果按章挂上
    use: 检索时一并返回——参照一份有断链论证的章节，会把断链一起学过来
    hard: 缺陷清单不可省略。省了就等于把这份报告当成了正确答案

  fit_meta:
    cn: 适配性元数据
    fields:
      vertical: 垂类
      subtypes: 子类（可多个）
      funding_regime: 投资主体
      reporting_to: 报送层级（同一口径的参照价值最高）
      outline_version: 依据哪版大纲编制
      year: 编制年份
      review_outcome: 评审结果（通过 / 退回补正 / 未知）
      known_gaps: 相对现行大纲缺哪些法定内容
    why: |
      没有这些元数据，检索出来的可能是一份异地、旧口径、且被退回过的报告。
      **outline_version 尤其要紧**：2023 大纲之前编制的，只能参照行文，不能参照结构。

# =============================================================================
# 二、脱敏投影 —— 入库时把值抽掉
# =============================================================================
# 为什么必须是强制投影，而不是"提醒注意不要照抄数字"：
# 提醒不管用。参照写作时人和模型都会顺手带值，而带过来之后看不出异常。
# 把值物理抽掉，就带不过来。
# =============================================================================
projection:

  rules:
  - kind: 数值
    match: 正文中的数字（含千分位、小数、百分比）
    replace: 能对上图谱节点的替换为 ⟨节点名⟩；对不上的替换为 ⟨数值⟩
    why: 参照的是"这里要写一个总建筑面积"，不是"这里写 18319"

  - kind: 建设单位专名
    match: 该报告的建设单位全称与简称
    replace: ⟨建设单位⟩
    why: 带过去会出现"本项目由某某大学建设"而实际是另一家

  - kind: 地名
    match: 项目所在地的省市区、路名、校区名
    replace: ⟨项目所在地⟩
    why: 地名带过去，连带地方规定也会被带过去

  - kind: 文号
    match: 〔年份〕编号 号 形式的行政文件号
    replace: ⟨文号⟩
    why: |
      **这一条最危险。** 政策文号带过去，新报告就引用了一份
      与它无关的批复——而文号看起来完全正常，评审要查了才知道。

  - kind: 规范编号与名称
    match: GB / GB50 / JGJ / 建标 等标准编号，及其后跟的标准名称
    replace: ⟨规范·类别⟩
    why: 标准会换版。带一个已废止的编号过去，整段论证的 warrant 就不成立了

  - kind: 年份
    match: 四位年份
    replace: ⟨年份⟩
    why: 价格年份、统计年份、规划期都会随之带错

  verify: |
    投影完成后自检：骨架里不应再出现任何阿拉伯数字（除章节号与序号外）。
    出现了就是漏投影，必须补——**一个漏网的数字就够引发一次事故**。

  reversible: |
    投影不可逆，也不该逆。想知道原值去看 graph 那一份，
    但那是**那个项目**的值，看是为了理解语境，不是为了填进新报告。

# =============================================================================
# 三、检索契约
# =============================================================================
retrieval:

  query: {section: 章节 key, vertical: 垂类, subtype: 子类, reporting_to: 报送层级}

  rank:
    order: [同垂类同子类同报送层级, 同垂类同子类, 同垂类, 同大纲版本]
    tie_break: 评审通过的优先；编制年份新的优先
    cap: 每章最多返回 3 条。返回多了等于让人在长表里挑，实际会只看第一条

  returns:
  - 脱敏骨架（段落结构、句式、表格栏目）
  - 该章的篇幅（字数）与在全篇的占比
  - 该章的论证铺陈方式（先讲什么后讲什么）
  - "**该条目在这一章的已知缺陷**"
  - 适配性元数据与差异提示（哪些地方与本项目不同）

  diff_hint: |
    返回时要主动指出差异：「这份是省级发改口径，您这份报部委」
    「这份依据 2019 前的旧大纲，结构不可参照」
    「这份的子类是干实验室，您这份是湿实验室，暖通部分不通用」。
    不指出差异，参照者会默认它是可比的。

# =============================================================================
# 四、使用边界
# =============================================================================
boundary:

  P1_form_not_value:
    cn: 只参照形，不参照值
    rule: 槽位标记一律由图谱填充，不许"还原"成参照来源的值
    check: C19a

  P2_old_outline_no_structure:
    cn: 旧口径不参照结构
    rule: outline_version 早于现行大纲的条目，只参照行文，章节结构以法定大纲为准
    why: |
      我们验过的旧口径样本缺 8 章法定内容——照抄它的结构，等于把缺失继承下来。
      **这也是当初把样本降级为验证材料、把法定大纲立为锚点的原因。**

  P3_read_the_defects:
    cn: 缺陷清单必须一并读
    rule: 检索结果里的 defects 要在起草前过一遍，明确不重复这些问题
    why: 参照一份缺 warrant 的必要性章，写出来的多半也缺 warrant

  P4_more_than_one:
    cn: 参照不止一份
    rule: 同一章至少看两份来源不同的条目再动笔
    why: 只参照一份，等于把那一份编制人的个人习惯当成了行业惯例

  P7_norms_are_soft:
    cn: 库里的规范与政策一律是软约束，且默认已过期
    rule: |
      语料库里的规范编号、政策文号、定额指标，一律按 volatility.yaml 的
      软约束处理，而且**默认已过期**——库里那份报告是哪年编的，
      它的编号就是哪年的。
      检索到的历史 chunk 提示「这里要引一条节能设计标准」，
      具体引哪一版，现查。查到的新版**直接替换，不走冲突裁决**。
    why: |
      源样本自己就在这上面翻了车：同一份报告的暖通章引 GB50189-2015、
      节能章引 GB50189-2005；《建筑照明设计标准》一处 2013 一处 2004。
      一份走完了内部流程的真实报告尚且如此，照抄它的编号只会把错误复制一遍。
    see: volatility.yaml → V1_norm_version / V2_policy_document

  P8_tables_are_derived:
    cn: 表格是推演结果，入库时要连它的推演一起挖
    rule: |
      入库不是把表里的数抄进图。**先判断这张表是源数据还是推演结果**：
        源数据    气象参数、规范限值表、既有财务决算、地勘结论
        推演结果  规模需求表、用水量表、负荷表、能耗表、投资估算表
      推演结果的表要往下挖到叶子，把「工程量 × 单价」「分项 × 指标」
      这一层的输入建成节点，汇总值建成 derived。
    why: |
      验过的真实报告里，「建安工程费 11188 万元」看着像源数据——它印在估算表上——
      实际是 27 个分项四层汇总上来的；「科研人员 315 人」是四个研究中心的合计。
      把汇总值当源数据入库，这条链从此不能重算，
      而分项与合计对不上也查不出来（那份报告的室外总体差 6.1%）。
    payoff: |
      挖到叶子之后，改一个研究中心的人数会自动牵动 7 项派生值，
      设计对需求偏差从 +1.55% 翻成 −1.09%——这在原报告里根本发现不了，
      因为 315 是个死数。
    check: 汇总节点的 inputs 为空 = 只收到了汇总值

  P5_no_facts_from_corpus:
    cn: 参照不产生事实
    rule: |
      任何数值、政策、规范、口径，仍然走原来的来源路由
      （ASK / SEARCH / COMPUTE），**不因为"上一份是这么写的"就成立**。
    why: 这是本文件与 no_fabrication 的接口。语料库不是证据来源

  P6_no_wholesale_copy:
    cn: 不整章套用
    rule: 参照的粒度是段落结构与句式，不是整章文本
    why: |
      整章套用出来的东西，评审一眼看得出来——他见过那份原件。
      而且会把原件的论证逻辑一并带来，那套逻辑是给**那个项目**的。

# =============================================================================
# 五、检查
# =============================================================================
constraints:

  C19a_no_unresolved_slot:
    cn: 槽位必须解析
    rule: 正文中不得出现未解析的 ⟨⟩ 槽位标记
    severity: error
    note: 与 {{节点名}} 同一条硬约束——渲染遇到未解析槽位直接中止，不出半成品

  C19b_no_source_leakage:
    cn: 参照来源不得泄漏
    rule: |
      正文中不得出现参照来源特有的专名、文号、规范编号。
      入库时登记的专名清单在这里第二次发挥作用。
    severity: error
    why: 这是「套模板」事故最直接的机检出口

  C19c_defects_reviewed:
    cn: 缺陷清单已过目
    rule: 使用了某条目参照的章节，须记录其 defects 已被过目
    severity: warning
    why: 不记录就无从判断这一章是不是又把参照的毛病学了一遍

# =============================================================================
# 六、与图谱的关系
# =============================================================================
relation_to_graph:
  complementary: |
    两者互补，不重叠：
      图谱回答「这个数是多少、凭什么、改了会牵动什么」
      语料库回答「这一段该怎么组织、写多长、表该怎么列」
    图谱没有语料库，写出来的东西正确但生硬；
    语料库没有图谱，写出来的东西顺畅但数字会串。
  order: |
    先图谱后语料库。**事实先定下来，再考虑怎么表述。**
    反过来做——先照着历史章节写，再往里填数——是套模板的标准路径。
