# =============================================================================
# 骨架变形（L0）—— 不同项目的报告为什么可以「神似形不似」
# -----------------------------------------------------------------------------
# 三层解耦回答了「谁说了算」：法定大纲管覆盖，垂类模版管切分，本项目骨架管落地。
# 但它没回答「切分依据什么变」。垂类模版若是一套写死的章节，
# 拿去套所有项目，结果还是形也似——报省里的和报部委的长得一模一样，
# 评审一看就知道是模板出来的。
#
# 本文件定义**变形**：在保持「神」不变的前提下，按甲方基本情况改「形」。
#
#   神（不可变）      形（随甲方变）
#   ─────────────    ─────────────
#   法定 covers 全集   章节数、排序、命名
#   D1–D11 合取分解    详略与篇幅分配
#   数据链派生拓扑     表与图的组织方式
#                     哪些内容合并、哪些单列
#
# 判断一次变形是否合法，只看一件事：**covers 全集是否不变**。
# 变形只搬动内容的容器，不增减内容本身。C7 是这条不变量的守门人。
# =============================================================================

meta:
  id: fsr-outline-shaping
  version: 0.1.0
  layer: L0

# =============================================================================
# 一、甲方基本情况 —— 决定「形」的那组变量
# =============================================================================
# 这些在分诊时问，与 triage.yaml 的 Q1–Q8 一起构成骨架生成的输入。
# 它们**不影响报告写什么**，只影响报告长什么样。
# =============================================================================
client_profile:

  reporting_to:
    question: 这份可研最终报给谁审？
    values: [国家部委, 省级发改, 市级发改, 主管部门内部, 单位内部决策]
    cannot_infer: true
    affects: 详略程度、是否需要把某些内容单列成章、篇幅预期
    note: |
      **权重最高的一问。** 同一个项目报部委和报市里，报告形态差别很大：
      报得越高，越要求主线清晰、结论前置、支撑材料附后；
      报得越低，越容易要求把过程写细、把台账贴进正文。
      问不到就默认按最高层级从严——从严的可以删，从简的补不回来。

  reviewer_convention:
    question: 该审批口有没有惯例要求的章节安排？（如"资金筹措必须单列一章"）
    values: 自由文本，逐条登记
    cannot_infer: true
    affects: PROMOTE / DEMOTE / REORDER
    note: |
      地方审批口的惯例是**成文规范里查不到**的东西，只有做过的人知道。
      它不是法定要求，但不遵守会被退回补正。
      这一问是本文件里唯一必须靠客户经验、agent 完全查不到的输入。

  org_type:
    question: 建设单位是什么性质？
    values: [事业单位, 国有企业, 民营企业, 政府部门, 社会组织]
    affects: 治理结构与决策程序的写法、资金来源的合规论证路径

  project_complexity:
    question: 建设内容的复杂度？
    values: [单体建筑, 建筑群, 多功能混合体, 含大型专用工艺, 线性工程, 非实体]
    inferrable_from: 素材中的设计方案
    affects: 技术方案章是否需要按单体拆分、专业条件是否需要独立成节

  phasing:
    question: 是否分期建设？本次是第几期？
    values: [不分期, 分期建设的首期, 分期建设的后续期]
    affects: 是否需要"与总体规划及前期的衔接"专节、规模论证是否需要双口径

  prior_work:
    question: 已有哪些前期成果？
    values: [无, 项目建议书已批, 可研已编过一轮需修改, 概念方案已做]
    affects: 是否需要"相对前期成果的调整说明"专节
    note: 已批项目建议书的，本次可研必须逐项说明相对批复的调整（C5f）

  length_expectation:
    question: 篇幅有无预期或限制？（总页数或总字数）
    values: [无限制, 控制在 N 页内, 越详细越好]
    affects: 总篇幅预算、合并算子的激进程度
    note: |
      有页数限制时，**先合并容器，不删内容**。
      删内容会破坏 covers 全集；合并只是把两节写进一章。

  total_length_target:
    question: 全篇总字数有没有要求？按哪个口径数？
    values: 整数，登记为 total_length_target；口径登记为 count_mode
    cannot_infer: true
    affects: 篇幅门禁的总量判定；口径不一致会直接导致「我们算达标、客户一数不达标」
    note: |
      **必须同时问口径。**「5 万字」在三种口径下差别很大：
      不计空格字符数（Word 的口径，也是本 skill 语料库入库的口径）、
      纯汉字数（剔除标点数字字母，通常比前者低 15%~18%）、
      折算字数。客户说不清口径的，默认按不计空格字符数，并在报告交付说明中写明。
      **总量要单独判，不能只判分章。** 分章下限 90%，逐章都擦线通过，
      全篇就只有 90%——5 万字的要求会变成 4.5 万，而客户是按总量提的要求。
      因此总量门禁比分章更严（98%）。
    order: 与 per_chapter_length 同批问

  per_chapter_length:
    question: 有没有逐章的字数要求？（有几章算几章，其余按同垂类语料库的实测配比折算）
    values: 自由文本，逐条登记为 sections[].length_target
    cannot_infer: true
    affects: 篇幅门禁的判定基准
    default_from_corpus: true
    note: |
      **这一问要单独问，不能并进上一问。** 「总共控制在 60 页内」和
      「规模论证章至少 3000 字」是两种约束：前者是上限，后者是下限，
      而下限才是门禁判定的依据。
      客户答不上分章的，就只登记他答得上的那几章——**部分登记优于不登记**。
      登记了的按 length_target 判；没登记的按**同垂类语料库的实测配比**折算，
      语料库也没有时才退回大纲权重。
      顺序不能颠倒的理由：大纲权重是全垂类通用的粗权重，而语料库配比是
      这一垂类里真实报告各章实际写了多少字——后者贴切得多。
      本 skill 用一份 5.4 万字的高校科研用房可研量得的配比举例：
      需求论证章占 20%、技术方案章占 27%、投资估算章占 3%。
      按大纲权重折算的结果与之相差很远。
      配比只取字数与占比，**不取任何值**，与语料库其他用法同一条边界。
    order: 要在起草前问。写完再问，等于把返工写进流程

  emphasis_chapters:
    question: 该审批口在这类项目上，哪几章看得最细？
    values: 自由文本，逐条登记
    cannot_infer: true
    affects: 篇幅权重的调整、起草时的投入分配
    note: |
      **这一问的价值不在字数，在重心。** 缺额法项目的规模论证章
      被一句话带过，就是评审的靶子；而无关紧要的章写了三页，
      读者会觉得这份报告没有主次。
      与 reviewer_convention 一样，属只有做过的人才知道的信息，agent 查不到。

# =============================================================================
# 二、变形算子 —— 允许对骨架做什么
# =============================================================================
# 每个算子都必须保 covers 全集不变。带 * 的会改变章号，须在 G1 之前完成——
# 章号是全图的引用锚点，G1 冻结之后再动等于全图返工。
# =============================================================================
operators:

  MERGE:
    cn: 合并
    do: 把两个或多个内容量小的相邻章合成一章，原各章降为节
    covers_effect: 合并后的章承接全部原 covers。不减
    when:
    - 篇幅有上限
    - 报送层级高，要求主线清晰
    - 某几章在本项目上内容确实很少（如非经营性项目的财务分析群）
    caution: 不要合并跨维度的章。D2 合规性与 D8 经济性合成一章，读者找不到论证主线
    changes_numbering: true

  SPLIT:
    cn: 拆分
    do: 把一个内容量大的章拆成多章，原章降为篇或群
    covers_effect: 拆出的各章分担原 covers，并集不变
    when:
    - 建设内容含大型专用工艺，技术方案章会膨胀到失衡
    - 建筑群或多功能混合体，需按单体或功能分区分述
    caution: 拆分后每个 cover 只能由**一个**章承载。两章都声明承载同一个 cover 会破坏 SSOT
    changes_numbering: true

  PROMOTE:
    cn: 升级
    do: 把某一节升为独立章
    when:
    - 审批口惯例要求单列（reviewer_convention）
    - 该内容在本项目上是论证重心（如缺额法项目的规模论证）
    covers_effect: 不变，只改层级
    changes_numbering: true

  DEMOTE:
    cn: 降级
    do: 把某一章降为节，并入相邻章
    when: 该章在本项目上内容很少但**不可删**（法定要求）
    covers_effect: 不变，只改层级
    note: 降级是"不删又不占篇幅"的正解。不要因为内容少就声明不适用
    changes_numbering: true

  REORDER:
    cn: 调序
    do: 调整章节顺序
    when: 审批口惯例、或论证主线要求某章前置
    covers_effect: 不变，只改先后
    constraint: |
      不得违反数据依赖：造价章不能排在规模章之前——
      读者会在读到造价时不知道面积是多少。
      检查器按 provides / requires 判定是否违反依赖序。
    changes_numbering: true

  APPEND_SUB:
    cn: 追加垂类子节
    do: 在某章下增加垂类特有的子节
    when: 垂类模版规定，或本项目有特殊性需要专述
    covers_effect: 新增子节不承载法定 covers，属增量内容
    changes_numbering: false

  DECLARE_NA:
    cn: 声明不适用
    do: 某维度或某章在本项目上不适用
    constraint: |
      **必须给理由，且理由要可检验。**
      「本项目为非经营性项目，无营业收入，盈利能力分析不适用」——可检验。
      「本项目情况特殊，不适用」——不可检验，C4e 会拒绝。
    covers_effect: 该 cover 仍在清单上，状态为"已声明不适用"，不是消失
    note: 这是唯一会让 covers 出现在"未承载"之外状态的算子，所以门槛最高

  forbidden:
    cn: 不允许的操作
    list:
    - act: 删除法定 covers
      why: 评审按大纲逐项对照，删了会被打回。客户要求删时，说明这条来自哪本大纲哪一款
    - act: 让同一个 cover 由多个章承载
      why: 破坏 SSOT，两处内容迟早不一致
    - act: G1 冻结之后再动章号
      why: 章号是全图的引用锚点，动一次等于全图返工

# =============================================================================
# 三、变形规则 —— 从甲方情况到具体动作
# =============================================================================
# 这些是**建议**，不是自动执行。变形方案在 G1 呈给客户确认。
# =============================================================================
shaping_rules:

- id: SR1
  when: "reporting_to in [国家部委, 省级发改]"
  suggest: [MERGE 财务分析群, REORDER 结论前置]
  rationale: 报送层级高时，评审看的是主线与结论；过程性内容合并后放附件更清楚

- id: SR2
  when: "reporting_to in [市级发改, 主管部门内部]"
  suggest: [保持垂类模版的默认切分]
  rationale: 基层评审习惯逐章对照大纲，拆得细反而好核

- id: SR3
  when: "project_complexity in [建筑群, 多功能混合体]"
  suggest: [SPLIT 技术方案章 → 按单体或功能分区]
  rationale: 一章里塞三栋楼的全部专业，读者无法定位

- id: SR4
  when: "project_complexity == 含大型专用工艺"
  suggest: [PROMOTE 工艺专项 → 独立章, APPEND_SUB 专业条件表]
  rationale: 工艺条件是这类项目论证的重心，埋在建筑方案里会被评审指出未论证

- id: SR5
  when: "phasing == 分期建设的后续期"
  suggest: [APPEND_SUB 与总体规划及前期的衔接, APPEND_SUB 相对总批复的调整说明]
  rationale: 分期项目最常见的退回理由就是没说清本期与总批复的关系（C5f）

- id: SR6
  when: "prior_work == 项目建议书已批"
  suggest: [APPEND_SUB 相对项目建议书批复的调整情况]
  rationale: 法定要求逐项说明调整，不是可选项

- id: SR7
  when: "commercial == false"
  suggest: [MERGE 盈利能力与偿债能力 → 一节并声明不适用, PROMOTE 财务可持续性]
  rationale: |
    非经营性项目的重点不是能不能赚钱，是运营期的钱从哪来。
    但**不适用要显式声明**，不能直接不写（C4e）

- id: SR8
  when: "length_expectation 有上限"
  suggest: [MERGE 内容量小的相邻章, 把台账与计算过程移入附件]
  rationale: 先合并容器再考虑别的。删内容是最后手段，且删不了法定 covers
  hard_rule: 篇幅压力不构成删 covers 的理由

- id: SR9
  when: "reviewer_convention 非空"
  suggest: [按惯例逐条 PROMOTE / REORDER]
  rationale: 惯例查不到但会导致退回补正。这一条优先级高于本表其他各条
  note: 与其他规则冲突时以惯例为准，并在骨架确认表里注明"依审批口惯例"

# =============================================================================
# 三之二、篇幅预算 —— 分章的详略，不是分章的字数
# -----------------------------------------------------------------------------
# 直接给每章定一个字数会出事：agent 会去**凑字数**。
# 凑出来的字是注水——把台账贴进正文、把规范条文整段抄进来、
# 把一句话拆成三句说。这些都能把字数做够，但每一条都在降低报告质量。
#
# 所以这里定的是**权重**，即「这一章在全篇里占多重」。
# 字数 = 总预算 × 权重，只作为区间提示，不作为达标线。
#
# 权重表达的是论证重心，这才是真正要向客户收集的信息：
#   哪几章评审看得最细？哪几章在本项目上确实没多少可写？
# =============================================================================
length_budget:

  total:
    source: client_profile.length_expectation
    defaults_by_reporting_to:
      国家部委: {pages: [40, 60], note: 主线清晰、结论前置，过程性内容进附件}
      省级发改: {pages: [50, 80]}
      市级发改: {pages: [60, 100], note: 基层评审习惯逐章对照大纲，写细一些反而好核}
      主管部门内部: {pages: [40, 80]}
      单位内部决策: {pages: [30, 60]}
    note: |
      页数只是量级参照，正文字数按每页约 800 字折算。
      客户明确给了上限就用客户的，**上限不构成删 covers 的理由**（SR8）。

  weights:
    source: 垂类 outline.yaml 每章的 weight 字段
    scale: 相对权重，全篇归一。不写默认按 1
    adjust_by:
    - when: 该章在 client_profile.emphasis_chapters 中
      effect: 权重 × 1.5
      why: 审批口看得细的章，写薄了就是靶子
    - when: 该章服务的维度是本垂类的论证落点
      effect: 权重 × 1.3
      why: 缺额法垂类的规模论证章、拆除重建项目的拆除相关章
    - when: 该章已声明不适用
      effect: 权重 = 0.2（只保留声明与理由）
      why: 不适用不等于不写，但也不该占篇幅

  bands:
    cn: 区间而非定值
    rule: 每章给 [下限, 上限]，下限 = 目标 × 0.6，上限 = 目标 × 1.6
    why: |
      定值会诱发凑字数。区间的作用是发现**异常**——
      某章只有目标的三成，说明论证没展开；
      某章是目标的两倍，多半是把台账或规范原文贴进了正文。

  hard_rules:
  - id: LB1
    rule: 字数不足**不许靠注水补**
    detail: |
      短了只有三条出路：补事实（去追料）、补论证（去补论据）、
      或者承认这一章在本项目上内容就这么多并如实告知客户。
      **不许把规范条文整段抄进来充数**——评审一眼看得出，而且会怀疑其余各章。
  - id: LB2
    rule: 超上限时先移附件，不删内容
    detail: 计算过程、台账、逐项清单移入附件，正文留结论与关键中间量
  - id: LB3
    rule: 篇幅从不构成删除法定内容的理由
    detail: 见变形算子 forbidden 第一条

  per_chapter_target:
    cn: 分章字数要求（客户输入）
    field: project.yaml → sections[].length_target（绝对字数）
    priority: |
      客户给的分章字数**优先于权重折算值**。它是输入，不是我们算出来的建议，
      不该被权重覆盖。没给的章才退到「总预算 × 归一权重」。
    collect: |
      收料时逐章问，不要只问总页数。问不到分章的，至少问出
      **哪几章评审看得最细**，那几章按 emphasis_chapters 加权。
    note: 只对正文（para/heading）计数。表格与插图不计，否则贴一张大表就能蒙混过关

  gate:
    cn: 篇幅门禁
    when: 出稿前（G4 之前）
    rule: 声明了 length_target 的章，实际字数低于目标 90% 的**不放行**
    tool: scripts/length_gate.py
    why: |
      以前这里只是提示。提示没有强制力——某章被一笔带过，报告照样出得来，
      然后在评审那里被指出来。所以改成门禁。
    but: |
      门禁只解决「不放行」，不解决「怎么补」。**差 800 字时正确的动作不是
      「再写点」，是把图上还没写进这一章的东西找出来。** 所以门禁的主要产出
      是缺口清单而不是判定：本章还有哪些节点没写进正文、哪些必写项没核销、
      哪些检索没做、哪些取值点空着，每条附字数估算。
    exits:
      - 补事实（清单里「已有值但正文没引用的节点」优先，不需要再问任何人）
      - 补论证（补论据、补 warrant）
      - 请客户书面下调本章目标
    forbidden: |
      清单全部补完仍然不够，说明目标定高了，走第三条出口。
      **抄规范条文充数、把一句话拆成三句、贴台账**都不在出口之列——
      评审一眼看得出，而且会连带怀疑其余各章。
    over_limit: 超上限先移附件，不删内容（LB2/LB3）

# =============================================================================
# 四、不变量与检查
# =============================================================================
invariants:

  I1_covers_conserved:
    rule: 变形前后，法定 covers 全集完全相同（不增不减）
    check: C7
    note: 这是「神」的机检定义。任何变形方案先过这一条

  I1b_covers_unique:
    rule: 每个 cover 恰好被一个章节承载
    check: C7c
    why: 多章承载同一 cover 会破坏 SSOT——两处内容迟早不一致

  I2_dependency_order:
    rule: 章节顺序不得违反 provides / requires 的数据依赖
    check: C7d
    why: 造价排在规模之前，读者读到造价时还不知道面积是多少

  I3_na_justified:
    rule: 声明不适用的必须给可检验的理由
    check: C4e

  I4_frozen_after_g1:
    rule: G1 冻结之后不再执行 changes_numbering 的算子
    check: 人工 + 变更日志

presentation:
  gate: G1
  must_show:
  - 变形前（垂类默认模版）与变形后的章节对照
  - 每一处变形用了哪个算子、依据哪条规则、为什么
  - covers 全集对照表：变形前 N 项 / 变形后 N 项 / 差异 0
  - 声明不适用的清单及理由，请客户逐条确认
  must_say: |
    「标题和切分您可以改，覆盖不能少。」
    客户要求删某个法定 cover 时，说明它来自哪本大纲哪一款、删了会在评审环节被打回，
    并给出替代方案（降级为节、或声明不适用并给理由），而不是简单拒绝。
