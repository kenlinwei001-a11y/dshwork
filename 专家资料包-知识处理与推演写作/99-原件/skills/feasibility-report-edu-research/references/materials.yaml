# =============================================================================
# 素材本体（L0）—— 客户交来的东西，怎么变成图上的事实
# -----------------------------------------------------------------------------
# 可研的真实工作形态：客户丢过来一堆材料——设计方案、造价书、批复文件、
# 学校规划、现状台账、施工组织设想——要求"照这些写一份合规的可研"。
#
# 危险在于：材料永远不齐。缺的那部分如果被顺手编出来，报告读起来最通顺，
# 却在评审环节爆掉，而且**编造的痕迹已经被抹平，没人能倒查是哪一步开始虚构的**。
#
# 本文件规定三件事：
#   ① 素材按类登记，每份素材有 id 和承载的节点范围
#   ② 每个取值必须能指回「哪份素材的哪一页/哪张表」，指不回去的不入图
#   ③ 指不回去也问不到的，节点保持 UNKNOWN，正文空着并写明待补——不允许估、
#      不允许"参考同类项目"、不允许"暂按经验值"
#
# 与 triage.yaml 的分工：
#   triage 问的是**项目是什么**（谁投资、什么性质、在哪）——决定用哪本大纲；
#   本文件管的是**事实从哪来**（哪份材料、第几页）——决定图上能填什么。
# =============================================================================

meta:
  id: fsr-materials
  version: 0.1.0
  layer: L0

# =============================================================================
# 一、不得编造 —— 硬规则
# =============================================================================
# =============================================================================
# 收到哪一层才算收到 —— 表格是推演结果，不是源数据
# -----------------------------------------------------------------------------
# 这一条是从一份真实报告里挖出来的，代价很具体。
#
# 那份报告的「建筑安装工程费 11188 万元」，第一眼看是源数据——它印在投资估算表上，
# 客户也是这么给的。往下挖才发现它是 **27 个分项、四层汇总**上来的：
#     工程量 × 单位造价 = 分项造价 → 外立面 → 土建 → 单体 → 建安费
# 同一份报告的「科研人员 315 人」也一样，它是四个研究中心人数的合计。
#
# 把汇总值当源数据收，后果不是"少了点细节"，是**这条链从此不能重算**：
#   · 改一个分项，总数不会跟着变，只能手工改，改一次就与图脱节
#   · 分项与合计对不上，查不出来（那份报告的室外总体：分项和 52，合计写 49，差 6.1%）
#   · 评审问「这 11188 怎么来的」，答不上
#
# 所以收料的深度标准是一句话：
#
#     **收到能复算的那一层，不是能填表的那一层。**
#
# 判断方法：拿到一个数，问「它能不能由别的数算出来」。
# 能，就往下要一层；要不到就如实标为汇总值，并说明无法复算。
# =============================================================================

granularity:

  rule: 凡"数量 × 单价""分项之和"这类结构，必须收到分项，不收汇总
  check: 汇总节点的输入若为空，说明只收到了汇总值，C2 无从复算

  must_be_itemized:

  - what: 投资估算
    not_enough: 费用构成四项（建安费 / 工程建设其他费 / 基本预备费 / 拆除费）
    need: |
      估算表的**明细页**：每个分项的工程量、单位、单位造价、合价。
      单位造价那一栏尤其要紧——它是 E2 证据（造价指标），
      而工程量多数直接等于面积节点，一接上，改面积就自动改造价。
    ask: |
      请提供投资估算书的**分项明细表**（不是汇总表）：每一分项的工程量、
      单位、单位造价、合价。我们据此逐项复算，也便于后续调整面积时自动重算造价。
    if_refused: 只收到汇总的，图上标为无法复算，并在正文注明"投资估算未提供分项明细"

  - what: 人员规划数
    not_enough: 按类别给的总数（科研人员 X 人、研究生 Y 人）
    need: |
      **组织单元 × 类别的矩阵**。真实报告里的 315 人是四个研究中心的合计，
      而学院往往按中心/团队报数——收总数等于把这一层丢了。
      少了这一层，"某个中心扩编"这类最常见的变更就没法算影响。
    ask: 请按**各研究中心/团队**分列，每个单元再分科研人员与研究生等类别

  - what: 配套用房
    not_enough: 配套用房合计使用面积
    need: 各功能用房的**间数与单间标准**（交流室几间、每间多少㎡）
    ask: 请提供配套用房清单：功能、间数、单间用房标准、合计面积
    why: |
      真实报告的这张表里有一处算术错——接待室 1 间 × 60 ㎡/间 写成了 70 ㎡，
      并计进了合计。收到分项才查得出来，只收合计就永远查不出来。

  - what: 用水量
    not_enough: 最高日用水量一个数
    need: 分类用水定额、各类用水人数、小时变化系数、用水时间
    ask: 请提供用水量计算表（分类定额 × 人数的明细），不是只给最高日用水量

  - what: 用电负荷
    not_enough: 总计算负荷一个数
    need: 分区用电面积、用电指标、**需要系数**、同时使用系数
    ask: 请提供负荷计算表明细
    why: |
      需要系数最容易漏。那份真实报告的电气章给了指标 70 W/㎡ 和结果 952 kW，
      中间的需要系数从未出现——而它在节能章的表里躺着（0.8 / 0.6）。
      两章各算各的，谁也没发现对不上。

  what_is_genuinely_source:
    cn: 这些确实是源数据，不要往下挖
    items:
    - 气象参数（室外空气计算参数）—— 当地气象台数据
    - 规范限值表（防烟分区面积上限、荷载标准值）—— 那是**依据**不是事实，一个节点都不该建
    - 单位既有财务决算 —— 不是本项目推演
    - 地勘结论 —— 勘察成果，只能要不能算
    note: |
      判据是「它在本项目里能不能由别的数算出来」。规范限值算不出来（它是外部给定的），
      但**它也不是本项目的事实**——它是 warrant。这两类都不建节点，理由不同。

no_fabrication:
  statement: |
    没有素材依据、也没有客户答复的量，一律保持 UNKNOWN。
    不估算、不套用同类项目、不写"暂按经验值"、不用行业均值填坑。

  forbidden:
  - id: NF1
    act: 用同类项目的数值填补本项目的空槽
    why: |
      同类项目的单价、指标、系数只在其自身的可比性条件下成立。
      填进来读者无从分辨它是本项目的数据还是别处搬来的，
      而正文一旦写成"本项目单方造价 6400 元/㎡"，来源就永久丢失了。
    instead: 标 UNKNOWN，生成追料条目；若客户确实要参照，须显式记为 E5_analogical 并写明可比性条件

  - id: NF2
    act: 把上游算不出来的派生值直接手填
    why: 等于切断了派生链，C2 从此对这个数字失效——图与正文脱节正是从这里开始
    instead: 追缺失的上游输入；上游确实拿不到时，整条链保持 UNKNOWN

  - id: NF3
    act: 为了让正文通顺，先写一个占位数字/占位段落
    why: |
      占位文字会被当成初稿，被润色，然后被遗忘。
      更要命的是客户看到通顺的段落就会去改句子，而不是纠正数字。
    instead: 正文该处写「待 <素材名> 提供后生成」，并在缺口清单里列出

  - id: NF4
    act: 把从素材里读出的数四舍五入/换算后录入，却不记原值与换算过程
    why: 换算错了无法倒查；且原值与录入值不一致时，C2 会误判为口径冲突
    instead: 原值入图为叶子节点，换算写成派生规则

  - id: NF5
    act: 素材里写得含糊（如"约 2 万平米"），录入时替客户精确化
    why: 「约 2 万」和 20000 不是同一个断言。精确化是替客户做决定
    instead: 原样录入并标 precision=approximate，同时生成一条向客户求证的追料条目

  applies_to_agent: |
    这条规则约束的是 agent 自己。检查器抓不到全部编造——
    一个编得像模像样的数字在图上和真实数字长得一样。
    唯一的防线是：**凡入图必带 from（素材 id + 定位）**，
    带不出 from 的就不入图。C8 检查这一点。

# =============================================================================
# 二、素材分类 —— 客户交来的东西归到哪
# =============================================================================
# provider: 谁手上有这份东西，追料时找谁
# carries:  这份素材通常承载哪些事实（节点名用通配写法，垂类可细化）
# provenance: 从中抽取的节点默认标什么证据级别
# blocking: 缺了会卡住什么
# substitutes: 正式件拿不到时的临时替代物，及其降级后果
# =============================================================================
material_classes:

  M1_approval:
    sla: administrative
    cn: 立项与批复类
    provider: 建设单位（发展规划处 / 基建处）
    examples:
    - 上级主管部门立项批复、项目建议书批复
    - 校（院）党委会、办公会关于本项目的决议
    - 分期建设项目的总批复及历期实施情况
    - 中央预算内投资或专项资金的下达文件
    carries: [project.approval_*, funding.gov, mandate.*(role=driver)]
    provenance: E6_administrative
    must_capture: [文号, 批复日期, 批复的建设内容与规模, 有效期或时效说明]
    blocking: D1 必要性的行政依据、D9 资金来源的合法性
    if_missing:
      ask: 请提供本项目的立项批复或上级决议文件（含文号与日期）；若尚未取得，请说明当前审批进度
      consequence: 无批复则 D1 缺 E6 支撑；分期项目还会触发 C5f（未说明相对批复的调整）
    substitutes:
    - what: 会议纪要、领导批示
      degrade: 仍属 E6 但效力弱，须在报告中注明"正式批复办理中"，并进 CH9 风险

  M2_planning_land:
    sla: internal
    cn: 规划与用地类
    provider: 建设单位 / 自然资源主管部门
    examples:
    - 校园总体规划、控制性详细规划图则、规划条件通知书
    - 土地权属证明、用地红线图、宗地面积测绘成果
    - 选址意见书、规划设计条件
    carries: [land.*, plot_ratio, density, green_rate, height_limit, mandate.*(role=benchmark)]
    provenance: E1_given
    must_capture: [用地面积, 容积率与限高等控制指标, 权属状态, 图纸出图日期]
    blocking: D3 选址与用地、D2 规划符合性
    if_missing:
      ask: 请提供用地红线图与规划条件（容积率、建筑密度、绿地率、限高），以及土地权属证明
      consequence: 无控制指标则规模方案的合规性无法论证，D2 与 D3 均不成立
    substitutes:
    - what: 校园总体规划中的地块图
      degrade: 可作规划依据，但不能替代权属证明；权属仍须单列追问

  M3_design:
    sla: commissioned
    cn: 设计方案类
    provider: 设计单位
    examples:
    - 方案设计说明、总平面图、各层平面图
    - 建筑面积分项表（地上/地下/各功能分区/架空层）
    - 结构选型与抗震设防说明、机电系统方案
    - 绿建星级、装配率、节能设计说明
    carries: [scale.*, 各专业技术参数, 建筑分类与耐火等级, 负荷等级]
    provenance: E1_given
    must_capture: [面积分项表, 分项口径（架空层/设备层/地下是否计入）, 出图版本与日期]
    blocking: D5 技术方案、D6 节能环保、造价链的分母、能耗链的输入
    if_missing:
      ask: 请提供方案设计的建筑面积分项表（注明架空层与地下部分的计入口径）与总平面图
      consequence: 无面积分项则总建筑面积无法交叉校验，造价单方、用水用电、人防配建全部悬空
    substitutes:
    - what: 任务书里的估算面积
      degrade: 只能作为需求侧目标值，不得当作设计规模；两者须建成不同节点并显式比对

  M4_cost_finance:
    sla: commissioned
    cn: 造价与财务类
    provider: 造价咨询单位 / 建设单位财务处
    examples:
    - 投资估算书、估算指标表、单方造价分析
    - 费用构成清单（建安费 / 工程建设其他费 / 预备费 / 专项费）
    - 资金筹措方案、自筹资金的落实证明
    - 运营期成本测算、收费标准依据
    carries: [cost.*, funding.*, opex.*, revenue.*]
    provenance: E1_given
    must_capture:
    - 价格年份与所在地
    - 建安费与其他费的分项明细
    - 预备费费率及其计价依据
    - 明确的不含项清单（家具、专用设备、大市政增容费等）
    blocking: D8 经济与投资估算、D9 资金筹措
    if_missing:
      ask: 请提供投资估算书（含费用构成分项、价格年份）与资金筹措方案（各来源金额及落实情况）
      consequence: 无估算则 D8 整体不成立；无筹措方案则 C3 资金平衡无从校验
    substitutes:
    - what: 概算指标或同类项目单方造价
      degrade: 属 E5_analogical，必须写明可比性条件（地域/年份/装配率/绿建/装修/有无地下室），否则 C5a 报错

  M5_construction:
    sla: commissioned
    cn: 施工与实施类
    provider: 建设单位 / 施工组织编制方
    examples:
    - 施工组织设想、总进度计划、分期实施安排
    - 场地现状与三通一平情况、临时设施安排
    - 拆除工程的范围、面积、腾空与过渡安排
    - 招标方式与发包模式设想
    carries: [duration.*, schedule.*, demolition.*, temp_facility.*]
    provenance: E1_given
    must_capture: [开完工节点, 关键线路, 拆除范围与手续状态, 过渡安置安排]
    blocking: D7 实施进度、拆除类项目的 CH5.4 征收补偿方案
    if_missing:
      ask: 请提供总进度安排（开完工时间、关键节点）与场地现状说明；涉及拆除的请一并提供拆除范围与手续办理进度
      consequence: 无进度则 D7 不成立；拆除类缺腾空安排会在评审被直接追问

  M6_baseline:
    sla: internal
    cn: 建设单位基础资料类
    provider: 建设单位（发展规划处 / 资产处 / 人事处 / 教务处）
    examples:
    - 现有房产台账（分用途、分校区的建筑面积）
    - 人员与规模的分类统计及规划数
    - 现状使用情况说明（拥挤程度、借用外部房源、危房情况）
    - 单位基本情况与既往同类项目实施经验
    carries: ["*.existing.*", "*.headcount", "enroll.*", "program.*"]
    provenance: E1_given
    must_capture: [统计口径与统计时点, 分类方式, 规划数的出处（哪份规划、哪一年）]
    blocking: D1 必要性、D4 建设规模（缺额法的减数）
    if_missing:
      ask: 请提供现有房产台账（按用途与校区分列的建筑面积，注明统计时点）与规划人数的分类统计
      consequence: 无存量数据则缺额无法计算，规模论证退化为"只算应建"，无法排除重复建设
    caution: |
      **口径是这一类素材的头号风险。** 同一份台账里"建筑面积/使用面积"、
      "全校/本校区/本期"、"在编/在岗/规划"混着写是常态。
      抽取时必须把口径一并记入节点，口径不明就追问，不要挑一个看起来合理的。

  M7_special_assessment:
    sla: administrative
    cn: 专项评估与配套类
    provider: 建设单位 / 各专项评估单位 / 地方主管部门
    examples:
    - 环评、能评、稳评、交评、水保、地灾评估
    - 人防配建要求与易地建设费口径
    - 消防、卫生防疫、职业安全的专项意见
    - 市政接入条件（水、电、气、热、通信、排水）
    carries: [mandate.*(role=domain), env.*, energy.*, utility.*]
    provenance: [E3_external, E6_administrative]
    must_capture: [出具单位, 文号或批复日期, 结论性意见, 提出的强制要求]
    blocking: D2 合规性、D6 节能环保、D10 风险
    if_missing:
      ask: 请提供已取得的专项评估意见与市政接入条件确认；未办理的请说明计划办理时间
      consequence: 专项未办不等于不能编可研，但必须在 CH9 列为前置条件风险并给办理计划
    note: 这一类里的**规范与地方法规部分可由 agent 自行 SEARCH**（E2/E3），不必等客户

  M8_norms:
    cn: 规范、政策与标准类
    provider: agent 自行检索（E2/E3），客户只需确认适用性
    examples:
    - 面积指标标准、专业设计规范、计价依据
    - 上位政策文件、行业发展规划
    - 地方强制配建规定
    carries: ["index.*", "*.rate", mandate.*]
    provenance: E2_normative
    must_capture: [编号, 正式名称, 现行状态与核验日期, 引用条款号]
    blocking: 全部论断的 warrant
    if_missing:
      action: web_search
      note: 这一类**不占客户时间**，尽量批量前置检索。登记与时效纪律见 references/norms.yaml

  M0_unclassified:
    cn: 未归类素材
    note: |
      客户常常直接丢一个压缩包过来。凡无法归入 M1–M8 的，先登记为 M0 并列出，
      **请客户确认它是什么**，不要自行猜测用途后抽取——
      猜错会把一份过期草案当成正式件用。

# =============================================================================
# 二之二、缺省必备素材集 —— 没有匹配垂类时用它
# -----------------------------------------------------------------------------
# 垂类的 materials.yaml 会给出更具体的要求；没有垂类时**不能退化为"什么都不要求"**。
# 那样扫描会报"缺素材：无"，读起来像资料齐了——比不检查更危险。
#
# 这一组是任何实体投资项目都绕不过去的：
#   谁批的（M1）· 地在哪、能不能建（M2）· 建什么、多大（M3）·
#   多少钱、钱从哪来（M4）· 现状是什么、为什么要建（M6）
# 它们各自对应一个法定章节群，缺一个就有整章写不出来。
# =============================================================================
default_required_materials:

  M1_approval:
    required: true
  M2_planning_land:
    required: true
    required_when_not: "not project.physical"   # 纯软件/纯服务项目无用地
  M3_design:
    required: true
    required_when_not: "not project.physical"
  M4_cost_finance:
    required: true
  M6_baseline:
    required: true
  M5_construction:
    required: false
    required_when: "project.nature == 拆除重建"
  M7_special_assessment:
    required: false

  note: |
    这是**下限，不是清单**。定了垂类就用垂类的——垂类知道本类项目还要什么，
    也知道追料话术该怎么写才能让客户听懂要给什么。

# =============================================================================
# 三、抽取契约 —— 从素材到节点
# =============================================================================
extraction_contract:

  rule: |
    每一个从素材抽取的节点，必须带 `from`：素材 id + 定位（页码/表号/图号/条款号）。
    定位到不了具体位置，就不算抽取，算推测——推测不入图。

  node_form:
    example:
      scale.design_total:
        value: 19500
        unit: ㎡
        provenance: E1_given
        source: 方案设计说明
        from:
          material: M3-01
          locator: 建筑面积分项表（第 12 页）
          verbatim: 总建筑面积 19500 ㎡（其中地上 18700，地下 800）
    fields:
      material: 已登记素材的 id
      locator: 页码 / 表号 / 图号 / 条款号，能让人翻回去的粒度
      verbatim: 素材中的原话或原值，用于事后核对抽取有无走样
      precision: 可选。exact（默认）/ approximate（素材本身就写的"约"）

  conflict_between_materials: |
    两份素材给出同一节点的不同值（造价书按 19500 算、设计说明写 19850），
    **不许挑一个用**。两个值都登记，标为素材冲突，抛给客户裁决，
    并说明各自出自哪份素材的哪一页、选哪个会影响哪些下游。
    裁决前该节点保持冲突态，依赖它的章节不起草。

  stale_material: |
    素材有版本。设计方案改了三版，客户只发了第一版是常态。
    抽取时记录素材的出具日期与版本号；同一素材类出现多版本时，
    以最新版为准并把旧版标 superseded——但**须告知客户你用的是哪一版**。

# =============================================================================
# 四、摄入流程
# =============================================================================
intake_workflow:

  step1_register:
    do: 逐份登记素材，写入 project.yaml 的 `materials:` 段
    fields: [id, class, name, provider, date, version, pages, received_at]
    note: 登记是无条件的第一步。没登记的素材等于不存在，抽取时无 from 可写。

  step2_extract:
    do: 按 material_classes[*].carries 定位该素材应当承载的节点，逐个抽取
    hard_rule: 抽不到就留空，不推断。抽到但口径不明的，抽取后立刻标 `ambiguous` 并入追问清单

  step3_reconcile_sources:
    do: 跨素材比对同名节点，冲突登记为素材冲突
    tool: scripts/intake_scan.py

  step4_gap_report:
    do: 生成缺口清单，两张表
    tables:
    - name: 缺素材
      content: 本垂类要求但客户未提供的素材类，含追料话术与阻塞后果
    - name: 有素材但抽不出的节点
      content: 素材类已提供、但其中未找到该值——这类要具体到"请在第几类材料里补哪一项"
    order: 按阻塞度降序，不按素材类编号顺序

  step5_ask:
    do: 按 interaction.yaml 的 ASK 动作发出，每批不超过 5 项
    must_include_per_item: [问题, 为什么需要（服务哪个维度）, 不给会卡住哪几章, 可接受的替代物]

  step6_loop:
    do: 客户补料后回到 step1，直到阻塞项清零
    note: 非阻塞项可以带着走，但必须在 G4 出稿前显式列出并由客户确认"就这样出"

# =============================================================================
# 四之二、追料时限与到期处置
# -----------------------------------------------------------------------------
# 追料发出去，客户不回，循环就挂着。没有时限的等待会一直等下去——
# 直到某个人受不了了，随手把那个数填上。**编造多数是这样发生的，不是恶意，是拖久了。**
#
# 所以时限的目的不是催客户，是**逼出一个显式决定**：
# 要么补料，要么走替代物，要么把这块显式留白并承担后果，要么暂停。
# 四条出口都可以，唯独"到期就估一个"不行。
#
# 时钟从 asked_at 起算，按工作日计。
# **客户答复「正在办理中」不重置时钟**——否则永远不到期，这是最常见的规避方式。
# 只有实际收到素材（或客户明确给出替代方案）才停表。
# =============================================================================
intake_sla:

  profiles:

    internal:
      cn: 建设单位内部资料
      applies_to: [M2_planning_land, M6_baseline]
      note: 这些东西客户手上就有，找对人就能拿到，慢通常是没找对人
      remind_days: 3
      escalate_days: 7
      decide_days: 14

    commissioned:
      cn: 第三方委托成果
      applies_to: [M3_design, M4_cost_finance, M5_construction]
      note: |
        设计单位、造价单位出成果有自己的节奏，催不动是常态。
        升级的正确对象是**建设单位的项目负责人**，不是设计单位——
        委托关系在建设单位手上。
      remind_days: 5
      escalate_days: 10
      decide_days: 20

    administrative:
      cn: 行政批复与专项评估
      applies_to: [M1_approval, M7_special_assessment]
      note: |
        办理进度不由客户控制，也不由我们控制。
        这一类**多数情况下正确的出口是 S2**（显式留白 + 进风险章），
        而不是死等——可研本来就允许在前置手续办理中的状态下编制。
      remind_days: 10
      escalate_days: 20
      decide_days: 30

  stages:
    open:
      cn: 待补
      do: 正常等待，不打扰
    remind:
      cn: 到催办点
      do: 第一次催办。重述这份素材卡住哪几章、可接受的替代物是什么
      tone: 提醒，不施压。多数情况是对方忘了或转办了
    escalate:
      cn: 到升级点
      do: |
        升级到建设单位的项目负责人，并**同时给出替代方案**。
        只说"还没收到"是无效升级；要说"若 X 日前仍拿不到，
        建议按 S1 用概算指标顶上并标为待细化，请确认"。
    decide:
      cn: 到决策点
      do: |
        停止等待，把四条出口摆给客户，请其**书面选一条**。
        选择本身要入账（audit.py log），因为它会影响报告的可用性与后续责任。
      must_present: [S1, S2, S3, S4]

  exits:
    S1_substitute:
      cn: 用可接受的替代物
      do: 按 material_classes[*].substitutes 降级取用
      cost: 证据等级下降（如正式估算 → 概算指标，E1 → E5），必须在正文显式标注降级
      constraint: 替代物也要有 from。没有替代物的素材类不适用本出口

    S2_withhold_and_risk:
      cn: 显式留白 + 进风险章
      do: |
        正文该处写「待 <素材名> 提供后生成」，并在 CH9 风险中列为
        **前置条件未闭合**，给出办理计划与影响判断。
      applicable: 行政批复与专项评估类的默认出口。可研允许在手续办理中的状态下编制
      constraint: 不得只留白不进风险章——那是漏项，不是处置

    S3_narrow_scope:
      cn: 缩小出具范围
      do: 该可行性维度显式声明"资料不足，本次不出具结论"，并说明补齐后如何补充论证
      cost: 报告的完整性下降，评审可能要求补充后再报
      constraint: 须客户书面确认。这是降低交付物范围，不是我们单方能决定的

    S4_suspend:
      cn: 暂停并告知阻塞
      do: 停止推进，明确告知阻塞在哪、找谁、拿到什么才能继续
      applicable: 阻塞类素材缺失时的唯一出口——M3 设计、M4 造价缺位时，报告的主干写不出来
      note: 暂停不是失败。带着空洞往下写，两周后返工才是

    forbidden:
      cn: 到期后不允许的做法
      list:
      - 估一个数填上
      - 套用同类项目的取值
      - 写"暂按经验值"或"参照类似工程"
      - 先写一段通顺的占位文字等以后替换
      why: 见本文件 no_fabrication。**时限到期不改变编造的性质，只是给了它一个借口。**

  proactive_disclosure: |
    到期必须**主动**告知客户，不能等客户来问。
    一份可研拖期的常见剧情是：agent 一直在等，客户以为在写，
    两周后双方才发现谁都没动——而那时留给决策的时间已经没有了。

  record: |
    每笔追料在 project.yaml 的 material_gaps 里留痕：
    asked_at（起算）/ reminded_at / escalated_at / resolved_at / exit（走了哪条出口）。
    走 S1–S4 的都要入变更日志，写明是谁在什么时候做的决定。

# =============================================================================
# 四之三、收到什么程度算够 —— 就绪度分级
# -----------------------------------------------------------------------------
# 「材料收集到什么程度」如果答"全部齐了"，那永远开不了工——材料永远不齐。
# 正确的答法是分级：**每一级解锁一批动作**，不齐但够这一级，就可以往下走。
#
# 这样做还有一个副作用是好的：客户看得见自己交的东西换来了什么进展，
# 比一句"资料还不全"更容易推动补料。
# =============================================================================
readiness_levels:

  L1_triage_ready:
    cn: 起步级 —— 能做骨架
    unlocks: [分诊, 骨架生成, G1 骨架确认, 批量 SEARCH]
    requires:
      answers: [项目全称, 由谁投资, 项目所在地（省+市）, 建设性质, 本次编制阶段]
      materials: []
    note: |
      **这一级不需要任何素材**，只要五个回答。
      很多项目卡在"等资料"其实是没必要的——骨架可以先做，
      做完客户看见目录，反而更清楚该给什么。

  L2_draft_ready:
    cn: 主干级 —— 能起草主干章节
    unlocks: [规模论证章, 技术方案章, 投资估算章的起草]
    requires:
      materials: [M3_design, M4_cost_finance, M6_baseline]
      key_facts:
      - 设计面积分项及其口径声明
      - 分类人数或分类需求量及其口径
      - 现有存量及统计时点（缺额法垂类必需）
      - 费用构成分项与价格年份
    note: 这三类素材撑起数据链的主干。缺任意一类，主干章就只能写空话

  L3_review_ready:
    cn: 完备级 —— 能出稿送审
    unlocks: [G4 出稿]
    requires:
      materials: [M1_approval, M2_planning_land, M5_construction, M7_special_assessment]
      key_facts:
      - 批复文号与相对批复的调整说明
      - 用地权属与规划控制指标
      - 进度安排与关键节点
      - 专项评估的取得情况或办理计划
      checks: C1–C11 全绿，或未绿项已留痕裁决
    note: |
      这一级允许「以 S2 方式满足」——专项评估未办不阻塞出稿，
      但必须在 CH9 列为前置条件风险并给办理计划。
      **未办 ≠ 未交代。** 漏项才是问题，如实说明不是。

  reporting: |
    每轮扫描都要报当前处在哪一级、下一级还差什么。
    「已达 L2，可起草规模与技术方案章；距 L3 还差用地权属证明与进度安排」
    比「资料不全」有用得多。

# =============================================================================
# 四之四、要不要给客户一份固定模板
# -----------------------------------------------------------------------------
# 结论：**固定「要素清单」，不固定「文档模板」。**
#
# 理由是实际的：甲方手上的材料形态千差万别——有的给盖章 PDF 扫描件，
# 有的给一个 Excel 台账，有的只有微信里的一段话，有的直接给设计单位的联系方式
# 让我们自己去要。硬性要求"请按此模板填写"会显著降低回收率：
# 填不进去的人干脆不填，本来能拿到的原始材料也拿不到了。
#
# 但要素清单必须固定。清单固定的是**要什么口径、什么粒度、缺了拿什么顶**，
# 与材料长什么样无关。
# =============================================================================
template_policy:

  fixed:
    cn: 固定下来的（结构）
    items:
    - 要素清单：每个素材类要哪些字段（material_classes[*].must_capture）
    - 口径声明：面积算不算架空层、人数是全校还是本期、设备费计不计入
    - 追料话术与可接受的替代物
    - 就绪度分级与各级解锁的动作
    why: 这些不固定，每个项目问法都不一样，客户答得也不一样，抽取就没法自动化

  not_fixed:
    cn: 不固定的（形式）
    items:
    - 客户交材料的文件格式与组织方式
    - 是否用我们提供的表格
    - 一次交齐还是分批交
    why: 强求形式会降低回收率。我们负责从原始材料里抽，这本来就是我们的活

  offer_but_dont_require:
    cn: 提供但不强制
    what: |
      按要素清单导出一份 intake 表（每行一个要素，含口径说明与替代物），
      作为**可选加速器**交给客户：能填的填，填不了的按原始材料交。
    why: |
      表格的价值不在收集，在**对齐口径**——客户填的时候会发现
      "原来要分全校/本期两个数"，这个发现本身就避免了后面的返工。
    hard_rule: |
      不得把"没按表格填"当成不推进的理由。
      客户扔过来一个压缩包，也要照样归类、抽取、报缺口。

  never:
    cn: 不做的
    items:
    - act: 要求客户按可研章节顺序提供材料
      why: 材料是按来源组织的（谁出的），不是按章节组织的。按章节要，客户会重复交同一份东西
    - act: 把 intake 表设计成需要客户做计算的
      why: 客户一算就会给一个他自己算的数，那个数和图里算的迟早对不上（COMPUTE 路由）
    - act: 要求一次交齐才开工
      why: 见 readiness_levels。L1 不需要任何素材就能开工

# =============================================================================
# 五、缺口清单的呈现格式
# =============================================================================
gap_report_format:
  material_gaps: |
    | 素材类 | 缺什么 | 找谁要 | 不给的后果 | 阻塞章节 |
  node_gaps: |
    | 节点 | 应出自 | 阻塞度 | 服务维度 | 追问话术 |
  principle: |
    追料话术里要写清楚**可接受的替代物**。
    "请提供投资估算书"客户可能没有；"投资估算书；若尚未编制，
    请提供概算指标表或立项批复中的投资规模，我们据此标为待细化"——
    后者能拿到东西。

# =============================================================================
# 六、检查
# =============================================================================
constraints:

  C8_provenance_traceable:
    cn: 取值可溯源
    rule: |
      当 project.yaml 存在 `materials:` 段时：
        a) 每个带 `from` 的节点，其 from.material 必须是已登记素材的 id；
        b) from 必须有 locator，空 locator 视同未抽取；
        c) 全部 E1_given / E6_administrative 节点中，无 from 的会被汇总报出——
           它们是"来源不可倒查"的取值，编造若发生，必然发生在这一批里。
    severity:
      a: error
      b: error
      c: warning（汇总为一条，列出节点名）
    why: |
      这是不得编造规则唯一可机检的部分。它不能证明有 from 的数是对的，
      但能保证每个数都指得回一份材料的一页——评审问起来答得上，
      事后倒查也找得到是谁给的。

  C9_material_coverage:
    cn: 素材类覆盖
    rule: |
      垂类 materials.yaml 中 required: true 的素材类，
      在 project.yaml 的 `materials:` 段中必须至少有一份登记。
      缺失按该类的 blocking 级别报 error 或 warning。
    severity: error（blocking 类）/ warning（可延后类）
    why: 素材缺口要在动笔之前暴露，不要写到第七章才发现造价书从来没拿到

# =============================================================================
# 七、实例图中的登记格式
# =============================================================================
project_yaml_section:
  example:
    materials:
    - id: M3-01
      class: M3_design
      name: 方案设计说明
      provider: 设计单位
      date: 2026-06-20
      version: V2
      pages: 48
      received_at: 2026-07-01
    - id: M4-01
      class: M4_cost_finance
      name: 投资估算书
      provider: 造价咨询单位
      date: 2026-06-28
      received_at: 2026-07-01
    material_gaps:
    - class: M1_approval
      status: pending
      asked_at: 2026-07-02        # 时钟起算。客户答复「正在办理中」不重置它
      reminded_at: 2026-07-16
      note: 客户答复批复正在办理中，预计 8 月取得
      planned_exit: S2_withhold_and_risk
