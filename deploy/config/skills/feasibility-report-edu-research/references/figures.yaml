# =============================================================================
# 插图生成（L0）—— 客户没给图时，哪些图可以由参数生成，哪些绝对不能
# -----------------------------------------------------------------------------
# 可研里有两类图，性质完全不同：
#
#   ① **数据图** —— 面积构成、投资构成、资金平衡、缺额对比、进度横道。
#      它们的全部内容都来自图上已确认的节点，画图只是换一种表述方式。
#      客户没提供也可以生成，因为**没有引入任何新事实**。
#
#   ② **设计图** —— 总平面、建筑平面立面剖面、结构布置、机电系统、管线综合。
#      它们承载的是设计单位的专业判断：柱网怎么排、管线怎么走、疏散怎么组织。
#      这些内容 agent 没有，也推不出来。**画出来就是编造，而且是最难被发现的一种**——
#      一张看起来像模像样的平面图，评审会当成设计成果来审，
#      审出来的问题会被记到设计单位头上。
#
# 所以规则是：**数据图可生成，设计图一律不生成。**
# 缺设计图时走 WITHHOLD：正文写明「详见设计单位提供的 XX 图」并列入缺口清单。
#
# 与 render 的关系：正文里写 {{figure:F_XXX}}，渲染时生成 SVG 并嵌入该段落。
# 与占位符同一条硬约束——所需节点缺任何一个，直接中止，不出半成品。
# =============================================================================

meta:
  id: fsr-figures
  version: 0.1.0
  layer: L0

# =============================================================================
# 一、硬规则
# =============================================================================
rules:

  R1_data_only:
    cn: 图上每个数字都必须来自节点
    rule: |
      生成图所用的每一个数值，都必须是 project.yaml 里已存在的节点。
      **不许有只存在于图里的数。**
    why: |
      图和正文说的必须是同一件事。一旦图里出现一个正文没有的数，
      SSOT 就破了，而且破得最隐蔽——没有人会去核对一张图里的数字。

  R2_abort_on_gap:
    cn: 缺节点直接中止
    rule: 所需节点缺任何一个，渲染中止，不生成半成品图
    why: 与 {{节点名}} 占位符同一条约束。带着空白坐标轴的图流出去，会有人手工把数填上

  R3_label_as_schematic:
    cn: 必须标为示意图
    rule: |
      图题固定格式：`图 X-Y 〈名称〉（示意图，据本报告数据生成）`
      **不得标注为设计图、方案图、施工图，也不得署设计单位名。**
    why: 让读者一眼知道这是数据的图形表述，不是设计成果。混淆的后果由谁承担是很实际的问题

  R4_cite_nodes:
    cn: 图注列出所用节点
    rule: 每张生成图的图注列出数据来源节点，可倒查
    why: 评审问「这张图的数从哪来」，答得上

  R5_yield_to_real:
    cn: 正式图到位即让位
    rule: |
      客户后续提供设计单位的正式图时，用正式图替换示意图，
      并在变更日志中记录替换。示意图退出，不并列。
    why: 两张图同时在，读者不知道该信哪张

  R6_no_design_figures:
    cn: 设计图一律不生成
    rule: 见下方 forbidden 清单。缺设计图走 WITHHOLD，不用示意图顶替
    why: |
      **这是本文件里唯一不可协商的一条。**
      数据图错了顶多是数错；设计图编了，是把一份不存在的专业判断
      伪装成了设计成果。

# =============================================================================
# 二、可生成的图 —— 参数驱动的数据图
# =============================================================================
# requires 里的节点缺任何一个，该图不生成（R2）。
# fallback_when_missing 说明缺了怎么办——通常是转成表格或走 WITHHOLD。
# =============================================================================
figures:

  F_AREA_COMPOSITION:
    cn: 建筑面积构成图
    kind: stacked_bar
    section_hint: 建设内容与规模章
    requires: [scale.design_above, scale.design_under]
    optional: [scale.stilt_floor]
    caption: 本项目建筑面积按地上、地下分项构成
    note: 架空层单列时须与正文的计入口径声明一致，否则图与文互相打架

  F_DEMAND_BREAKDOWN:
    cn: 用房需求构成图
    kind: bar
    section_hint: 建设规模论证章
    requires_pattern: "*.demand"
    min_items: 2
    caption: 按分类人数与人均指标测算的各类用房需求
    note: 分项名称取自节点名的中文映射，不另起名——起名会引入图里独有的信息

  F_DEMAND_VS_DESIGN:
    cn: 需求测算与设计规模对比图
    kind: compare_bar
    section_hint: 建设规模论证章
    requires: [scale.demand_total, scale.design_total]
    caption: 需求测算值与设计规模的对比
    note: |
      偏差超阈值时，图上标注偏差率并**在正文给反驳项**说明超出部分的构成。
      只画图不解释，等于把问题摆到了评审眼前却没回答。

  F_DEFICIT:
    cn: 缺额分析图
    kind: deficit_bar
    section_hint: 建设规模论证章
    requires_pattern: ["*.required.*", "*.existing.*", "*.deficit.*"]
    caption: 应建规模、现有存量与缺额的关系
    note: 缺额法垂类的核心图。本次新建量应一并画出，直观显示「新建 ≤ 缺额」

  F_COST_COMPOSITION:
    cn: 投资构成图
    kind: stacked_bar
    section_hint: 投资估算章
    requires: [cost.construction, cost.other, cost.contingency]
    optional: [cost.demolition, cost.equipment]
    caption: 项目总投资的费用构成
    note: 分项之和必须等于 cost.total。不等说明图或图外有遗漏项，此时中止并报错

  F_FUNDING_BALANCE:
    cn: 资金来源与平衡图
    kind: balance_bar
    section_hint: 资金筹措章
    requires: [funding.total, cost.total]
    requires_pattern: "funding.*"
    caption: 资金来源构成及其与总投资的平衡关系
    note: 硬等式。两条柱不等高时图会显式标出差额——这比表格里的数字更容易被看见

  F_FUNDING_ANNUAL:
    cn: 年度资金安排图
    kind: grouped_bar
    section_hint: 资金筹措章
    requires: [funding.annual]
    caption: 分年度资金安排
    note: 各年之和必须等于 funding.total

  F_SCHEDULE:
    cn: 实施进度横道图
    kind: gantt
    section_hint: 实施进度章
    requires: [schedule.milestones]
    caption: 项目实施进度安排
    note: |
      里程碑取自图上的进度节点，不自行编排工期。
      客户只给了总工期没给里程碑时，**不要自己拆**——拆出来的节点会被当成承诺。

# =============================================================================
# 三、禁止生成的图
# =============================================================================
forbidden:

- kind: 总平面图
  why: 承载建筑布局、间距、朝向、场地竖向、出入口组织——全是设计判断
  instead: 正文写「详见设计单位提供的总平面图」，列入 M3 设计类素材缺口

- kind: 建筑平面 / 立面 / 剖面图
  why: 柱网、房间划分、疏散组织、层高关系，agent 推不出来
  instead: 同上

- kind: 结构布置图
  why: 结构选型与构件尺寸涉及计算，画出来会被当成已有计算依据
  instead: 同上

- kind: 机电系统图 / 管线综合图
  why: 系统形式、设备选型、管径与走向，属专业设计成果
  instead: 同上

- kind: 效果图 / 鸟瞰图
  why: 它塑造的是评审对项目的第一印象，而这个印象没有任何依据
  instead: 不画。缺就缺着，可研不因为没有效果图被否

- kind: 工艺流程图
  why: |
    看起来像数据图，其实是设计图。流程节点、物料走向、关键参数
    都出自工艺设计，编一个"合理的流程"是这一类里最危险的做法
  instead: 走 ASK，向客户或工艺设计方索取

  boundary_note: |
    判据是一句话：**这张图里有没有「图上没有的信息」。**
    有 → 是设计图，不生成。没有 → 是数据图，可以生成。
    拿不准时按设计图处理。

# =============================================================================
# 四、样式约定
# =============================================================================
style:
  target: 打印友好 —— 白底、深色墨、灰度可辨
  palette_rule: 相邻分项的明度差要够，黑白打印后仍能区分
  labels: 每个分项直接标数值与单位，不依赖图例猜读数
  no_chartjunk: 不加阴影、渐变、3D。可研的图是用来核对数字的，不是用来好看的
  font: 不嵌字体，用通用无衬线族，避免不同机器上渲染成方框

# =============================================================================
# 五、检查
# =============================================================================
constraints:

  C15_figure_data_traceable:
    cn: 插图数据可溯源
    rule: |
      a) 生成图所用的每个数值都必须对应到图上的节点
      b) 图注必须列出所用节点
      c) 构成类图（投资构成、面积构成）分项之和必须等于对应的合计节点
    severity: {a: error, b: warning, c: error}
    why: c 是最实用的一条——它把「图漏了一个分项」变成可机检的问题

  C15b_no_design_figure:
    cn: 不得生成设计图
    rule: 正文中标为生成图的，其类型必须在 figures 清单内；命中 forbidden 的报错
    severity: error
