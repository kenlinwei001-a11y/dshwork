# =============================================================================
# 分诊与骨架确认 (L0)
# -----------------------------------------------------------------------------
# 报告编制的第一阶段。目标不是收集全部信息，而是：
#   ① 确定用哪本法定大纲、加载哪个垂类章节模版
#   ② 判定各可行性维度的适用性
#   ③ 生成候选章节骨架，**交客户确认后冻结**
#
# 冻结之后，章节 id 不可变——全图的 provides/requires/restates 都引用它。
# 客户后续可以改标题、调顺序，但不能改 id，也不能删除法定覆盖。
# =============================================================================

meta:
  id: fsr-triage
  layer: L0
  version: 0.1.0
  depends_on: [fsr-core, fsr-argumentation, outline-gov-2023, outline-ent-2023]

# =============================================================================
# 1. 分诊输入 —— 必须由客户提供，无法推导
# =============================================================================
triage_inputs:

  Q1_project_name:
    question: 项目全称是什么？
    type: string
    required: true
    note: |
      项目名称是分诊的主要线索。可从中初步推断建设性质、功能类型、主体类型、地域，
      但推断结果**一律须客户确认**，不得默认采信。
    inference_hints:
      建设性质: [新建, 改建, 扩建, 迁建, 拆除重建, 一期/二期/续建]
      功能类型: [宿舍, 食堂, 教学楼, 实验楼, 道路, 管网, 厂房, 园区, 系统, 平台]
      主体类型: [大学, 医院, 集团, 有限公司, 管委会]
      地域: 省市区名称 → 决定地方标准、气象地质参数、造价指数
    example: |
      "某大学新校区二期学生宿舍X组团A区（含学生食堂）"
        → 建设性质=新建（二期）｜功能=学生宿舍+食堂｜主体=高校｜地域=从校名与校区推断，须确认
        → 推荐垂类模版 edu-student-life｜推荐大纲 gov-2023
        → 待确认项：项目所在地的市/县、是否含既有建筑拆除、是否分期报批

  Q2_funding_regime:
    question: 由谁投资？
    type: enumeration
    values: [政府投资, 企业投资, 混合投资]
    required: true
    cannot_infer: true
    note: |
      这是分诊中权重最高的一问，且**无法从项目名称推断**，必须客户明确。
      它决定三件事：
        1. 适用哪本大纲——政府投资走通用大纲（强制），企业投资走参考大纲（参考）
        2. C7 按哪套 mandatory_coverage 检查
        3. D11 盈利能力维度是否默认适用
      混合投资：按政府投资口径从严，同时补做企业口径的盈利能力分析。
    binds:
      政府投资: {outline: outline-gov-2023, force: 强制适用}
      企业投资: {outline: outline-ent-2023, force: 参考适用}
      混合投资: {outline: outline-gov-2023, plus: outline-ent-2023#CH6.2, force: 从严}

  Q3_commercial:
    question: 项目建成后有没有经营性收入？
    type: boolean
    required: true
    note: 决定 D11 盈利能力成立是否适用。答否时，必须在报告中显式声明不适用及理由

  Q4_physical:
    question: 项目是否含实体工程建设（有没有要盖/要修的东西）？
    type: boolean
    required: true
    note: 答否（纯软件/纯服务）时，CH4.1 选址不适用，D3 退化为现状差距 + 运行环境保障

  Q5_prior_approvals:
    question: 已取得哪些前置批复？（项目建议书批复、用地预审、选址意见书、环评批复等）
    type: "list[E6_administrative]"
    required: true
    allow_empty: true
    note: |
      每份批复登记为一个 Mandate(mandate_type=approval) + 一条 E6 证据，
      须带文号、发文机关、批复日期、有效期。
      若本项目现状相对批复有变化，须逐项列出调整情况（C5f）。

  Q8_location:
    question: 项目具体在哪个省、哪个市（县/区）？
    type: string
    required: true
    cannot_infer: true
    note: |
      **不得从单位名称推断。** 高校常有多校区，单位注册地与项目所在地经常不是一个地方。
      这一问决定的是外部依据的效力地域：
        · 地方强制配建规定（人防、无障碍、海绵、充电桩）逐省逐市不同
        · 抗震设防烈度、气象参数、造价指数按地取值
        · 检索政策法规时的地域分面，以及适配性评估的 F1 与硬否决 V2
      答错这一问，会把一整套管不着本项目的地方规定固化进报告。
      评估与排序规则见 references/external-fit.yaml。

  Q6_stage:
    question: 本次编制处于哪个阶段？
    type: enumeration
    values: [项目建议书, 可行性研究, 初步设计, 概算]
    default: 可行性研究

  Q7_vertical:
    question: 属于哪个垂类？
    type: enumeration
    values: 由已安装的垂类 skill 列表决定
    inferrable_from: Q1_project_name
    note: 推断后须确认。无匹配垂类时，退回使用 L0 法定大纲的裸骨架

# =============================================================================
# 2. 垂类章节模版 —— L1 提供，L0 只规定它必须长什么样
# =============================================================================
vertical_template_contract:

  purpose: |
    三层解耦（法定大纲 / 垂类模版 / 本项目骨架）的说明见 SKILL.md，此处不重复。
    本节只规定垂类模版这一层必须长什么样。

  required_fields:
    id:            垂类标识，如 edu-dormitory / municipal-road / gov-it-system
    extends:       继承哪本大纲（outline-gov-2023 / outline-ent-2023）
    sections:      本垂类的章节列表
    naming_rules:  标题生成规则（可含项目名称变量）
    tailoring:     条件裁剪规则

  section_fields:
    id:       稳定标识，冻结后不可变。全图引用它
    title:    显示标题，客户可改
    order:    排序，客户可调
    covers:   承载哪些法定内容。**客户不可删减**，删了 C7 报错
    required: true / conditional
    condition: conditional 时的判定表达式

  invariants:
    - 模版的 covers 并集必须覆盖所属大纲的全部 required 内容（C7 静态检查）
    - id 全局唯一且稳定；title 与 order 可由客户在确认阶段调整
    - 允许一章承载多条 covers（合并），不允许任何 covers 无人承载
    - 允许在叶子下新增垂类子节（如高校类的「宿舍套型设计」），但不得新增一级章与法定章并列

  example:
    vertical: edu-dormitory
    extends: outline-gov-2023
    merges:
      - {sections: [CH8.4, CH8.5], into: 一节「能源利用与双碳分析」, reason: 高校宿舍类两者篇幅均短}
    adds_subsections:
      - {under: CH3.2, title: 宿舍套型与床位配置}
      - {under: CH5.1, title: 装配式建筑设计}
      - {under: CH5.1, title: 人防配建}
    conditional_off:
      - {section: CH5.4, reason: 新校区用地已征已供，无征收拆迁}

# =============================================================================
# 3. 骨架生成与确认闸门
# =============================================================================
outline_gate:

  note: |
    这是人机交互的第一个硬闸门。骨架未经确认，不得进入内容编制阶段——
    因为章节 id 一旦被 provides/requires/restates 引用，再改就是全图返工。

  steps:

    S1_infer:
      action: 由 Q1 项目名称 + Q2-Q7 分诊输入，推断垂类与项目属性
      output: 推断结果清单，逐条标注「已确认 / 待确认 / 推断」

    S2_load:
      action: 按 Q2 加载法定大纲，按 Q7 加载垂类章节模版
      fallback: 无匹配垂类时使用大纲裸骨架，并提示"未找到垂类模版，将使用法定大纲通用结构"

    S3_tailor:
      action: 按项目属性求值 conditional 节点，生成本项目候选骨架
      output_per_section: [序号, 标题, 承载的法定内容, 状态]
      status_values:
        必备:     required=true
        条件适用: conditional 且条件成立
        不适用:   conditional 且条件不成立——**须给出理由，客户确认后方可移除**

    S4_confirm:
      action: 向客户呈现候选骨架，请求确认
      presentation: |
        以表格呈现：章号 / 章节标题 / 承载法定内容 / 状态 / 说明
        并单独列出：
          - 判定为「不适用」的章节及理由（客户须逐条确认）
          - 相对法定大纲的合并与新增（客户须知晓）
      customer_may:
        - 修改章节标题
        - 调整章节顺序
        - 新增垂类子节
        - 推翻「不适用」判定，要求保留某章
      customer_may_not:
        - 删除任何法定 covers —— 系统拒绝并说明该条来自哪本大纲哪一条
        - 修改已冻结的章节 id
      note: |
        允许改名、允许调序、允许合并——这些都不影响法定覆盖。
        唯独不允许少覆盖。这是 C7 存在的意义。

    S5_freeze:
      action: 冻结骨架，写入实例图 sections[]
      effects:
        - 章节 id 成为全图引用锚点，此后不可变更
        - 各章的 requires/provides 契约据此建立
        - C7 由静态检查转为持续检查——后续任何删章都会触发
      output: 冻结确认单（含冻结时间、确认人、骨架版本号）

  reopen_policy: |
    骨架冻结后若需变更（如新增一栋单体导致需要增加章节），
    走变更流程：记录变更原因 → 重跑 C7 → 重新确认 → 骨架版本号 +1。
    不允许静默改动，因为全图的引用完整性依赖它。

# =============================================================================
# 4. 分诊之后
# =============================================================================
next_phase:
  note: |
    骨架冻结后进入槽位收集（Intake）。此时提问不再是泛泛的问卷，
    而是由图上的空槽驱动——每个 requires 但未满足的节点生成一个问题，
    并标注它服务于哪个维度、缺失会导致哪一章写不下去。
  question_ordering: |
    按「阻塞下游节点数」降序提问。
    先问总建筑面积（阻塞造价、负荷、能耗、进度四条链），
    再问装修标准（只阻塞造价一条链）。
