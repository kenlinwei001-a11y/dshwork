  ECON-PARAM-V3:
    code: 建设项目经济评价方法与参数（第三版）
    title: 建设项目经济评价方法与参数
    issuer: 国家发展改革委、住房和城乡建设部
    status: in_use_unverified
    role: [warrant]
    scope: [财务评价]
    used_by: [industrial-park]
    caveat: |
      图书形式发行（中国计划出版社），无官方免费全文。
      本 skill 的指标体系与报表清单，是通过国家能源局正式发布的
      《煤炭建设项目经济评价方法与参数实施细则》（该细则明文依据第三版编制）
      + 上市公司实际可研附表 + 教育机构解读，三方交叉印证得出，
      **严格说是"依据第三版编制的下位文件"，不是第三版原文。**
    key_points:
      - 借款偿还期自第三版起降级为估算 ICR/DSCR 的辅助参数，不应与之并列
      - 「资金来源与运用表」是第二版术语，第三版已由「财务计划现金流量表」取代
      - 国民经济评价已更名为「经济费用效益分析 / 经济费用效果分析」
    verify:
      search_hints: ["建设项目经济评价方法与参数 第三版 财务评价指标",
                     "煤炭建设项目经济评价方法与参数实施细则"]

  GF-2015-51:
    code: 国发〔2015〕51号
    title: 国务院关于调整和完善固定资产投资项目资本金制度的通知
    issuer: 国务院
    status: in_use_unverified
    role: [benchmark]
    scope: [资本金比例]
    used_by: [industrial-park]
    verify:
      why: 产业类项目资本金比例的基准依据，直接决定 D8 融资方案是否成立
      questions:
        - 是否仍现行有效，有无被后续文件整体替代
        - 产业园区/标准厂房适用哪一档比例
        - 可分割销售的厂房是否按房地产口径认定
      search_hints: ["国发〔2015〕51号 固定资产投资项目资本金 现行",
                     "投资项目资本金比例 最新规定"]

  GF-2019-26:
    code: 国发〔2019〕26号
    title: 国务院关于加强固定资产投资项目资本金管理的通知
    issuer: 国务院
    status: in_use_unverified
    role: [benchmark]
    scope: [资本金比例]
    used_by: [industrial-park]
    key_points:
      - 只调整了基础设施口径；产业园区/厂房属"其他项目"，不在其列
      - 补短板项目下调不超过 5 个百分点，且须投资回报机制明确、收益可靠、风险可控
    verify:
      why: 与国发〔2015〕51号 共同决定资本金比例，两者的适用边界易被混淆
      questions:
        - 本项目是否落入 26 号文调整的基础设施范围
        - 若属补短板项目，下调是否满足"回报机制明确、收益可靠、风险可控"三条件
      search_hints: ["国发〔2019〕26号 项目资本金 基础设施 下调",
                     "固定资产投资项目资本金管理 现行规定"]

  HB-RF-2021-31:
    code: 鄂人防〔2021〕31号
    title: 湖北省防空地下室战时功能设置规则（试行）
    issuer: 湖北省人民防空办公室、湖北省自然资源厅
    status: in_use_unverified
    role: [benchmark, domain]
    scope: [湖北省, 强制配建]
    used_by: [edu-campus]
    note: |
      地方强制配建的示例条目。公共设施用地按地上总建筑面积 5% 配建民防工程。
      **地方规则差异极大，其他省份须按项目所在地重新登记，不得套用。**
    verify:
      why: 配建不达标直接导致 D2 合规性不成立，不只是技术问题
      questions:
        - 该规则是否仍现行，试行期是否已到期或转正式
        - 本项目用地性质是否属"公共设施用地"，适用哪一档配建比例
        - 是否可易地建设及其费用标准
      search_hints: ["鄂人防〔2021〕31号 防空地下室 战时功能设置规则",
                     "湖北 人防工程 配建比例 现行"]
      caution: 项目不在湖北的，本条不适用，须按项目所在地人防部门规定重新登记

