# =============================================================================
# 规范登记册
# -----------------------------------------------------------------------------
# 用途：把散落在各章的规范引用集中登记，供两件事——
#   ① 名称与编号比对（引错名字是可研的高频低级错误，见下方 JB191 的实例）
#   ② 时效核验的调度（哪些该查、查什么、上次查的是什么时候）
#
# 诚实原则：**本文件不臆断任何规范的现行状态。**
# 没有查证的一律标 status: in_use_unverified，并给出核验方法。
# 一个登记册如果假装知道自己不知道的事，比没有登记册更危险——
# 编制人员会信任它，然后引用一份已经废止的标准。
#
# status 取值：
#   verified_current    已查证现行有效（须填 verified_at 与 verified_source）
#   in_use_unverified   业内在用但未查证现行性 —— 默认值
#   superseded          已被替代（须填 superseded_by）
#   repealed            已废止
#   unknown             连是否存在都未确认
# =============================================================================

meta:
  id: fsr-norms
  version: 0.1.0
  policy: 每次成稿前对本项目实际引用的全部条目重新核验一遍
  staleness_window_days: 90

# =============================================================================
# 法定基准
# =============================================================================
norms:

  NDRC-2023-304:
    code: 发改投资规〔2023〕304号
    title: 关于印发投资项目可行性研究报告编写大纲及说明的通知
    issuer: 国家发展改革委
    effective_from: 2023-05-01
    status: verified_current
    verified_at: 2026-08-06
    verified_source: https://www.ndrc.gov.cn/xxgk/zcfb/ghxwj/202304/t20230407_1353356.html
    role: [benchmark, warrant]
    scope: [全部投资项目]
    components:
      - 政府投资项目可行性研究报告编写通用大纲（2023年版）—— 强制适用
      - 企业投资项目可行性研究报告编写参考大纲（2023年版）—— 参考适用
      - 关于投资项目可行性研究报告编写大纲的说明（2023年版）
    note: 本 skill 的法定锚点。C7 覆盖检查以此为准

  JB191-2018:
    code: 建标191-2018
    title: 普通高等学校建筑面积指标
    aliases_seen_in_practice:
      - 普通高等学校建筑规划面积指标   # 真实报告中见过的写法，多一个「规划」
      - 普通高校建筑规划面积指标       # 部分高校基建处网页的写法
    correct_title_note: |
      检索到的多数来源（含多所高校基建处的公开转载）使用《普通高等学校建筑面积指标》。
      我们验证过的一份真实报告写作《普通高等学校建筑规划面积指标》，多了「规划」二字。
      引错标准名称在评审中会被直接指出，属低级但高频的错误。
      **本项目实际引用前，请以纸质版或官方发布页面的封面为准再核一次。**
    status: in_use_unverified
    verify:
      why: |
        它是高校基建垂类全部规模测算的依据（E2 证据），
        两份验证样本都以它为准。若已换版或适用范围有变，整个规模论证的
        warrant 就不成立了——这是本垂类最关键的一次核验。
      questions:
        - 是否现行有效，有无废止或替代公告
        - 正式名称到底是《普通高等学校建筑面积指标》还是含「规划」二字
        - 适用范围是否覆盖：专职科研机构用房、留学生公寓
        - 留学生是否享受与硕士/博士同类的补助指标
      search_hints:
        - "建标191-2018 现行 废止 替代"
        - "普通高等学校建筑面积指标 建标191 site:gov.cn"
        - "教育部 高校建筑面积指标 最新版本"
      known_sources:
        - https://jjc.usx.edu.cn/info/1004/1333.htm
        - https://jjgcc.cmc.edu.cn/info/1003/1348.htm
        - https://fzgg.jscst.edu.cn/1f/cb/c1903a73675/page.htm
      caution: |
        上述来源均为高校基建部门的转载页，**不是发布机关的官方发布页**。
        它们能说明这份标准在业内被广泛使用，不能证明它现行有效。
    role: [warrant, domain]
    scope: [高校基建]
    used_by: [edu-campus]

  FGSH-2024-25:
    code: 发改社会〔2024〕25号
    title: 国家发展改革委等部门关于加强高校学生宿舍建设的指导意见
