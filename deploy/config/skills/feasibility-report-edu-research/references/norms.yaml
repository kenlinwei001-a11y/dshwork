    note: |
      这些专业在源样本里各引了一条上海地标。地标本身不可复用，
      但「这个专业需要一条地标」这件事可复用——它提示起草时去查当地对应标准。
      查不到当地有对应地标是正常的，不是所有省市都发。
    STRU: [地基基础设计规范, 建筑抗震设计规程]
    WSD: [民用建筑水灭火系统设计规程]
    ELEC: [民用建筑电气防火设计规程]
    HVAC: [公共建筑绿色设计标准, 机动车停车库(场)环境保护设计规程]
    HSE: [上海市建筑抗震设计规程]
