    - 节能与能耗限额标准（国标 + 地方标准）
    - 环境质量标准与排放标准
    - 地方装配率评价标准
    - 地方海绵城市建设标准
    - 地方园区用地约束指标（容积率/投资强度/亩均税收）
    - 造价定额与计价依据（地方年度版本）
    - 项目专属的行政批复（E6，逐份登记文号与有效期）

# =============================================================================
# 核验流程
# =============================================================================
verification_workflow:
  when:
    - 分诊完成、确定垂类后，对该垂类 used_by 的全部条目批量核验
    - 任一条目 verified_at 距今超过 staleness_window_days
    - 成稿前（G4 闸门）对本项目实际引用的全部条目再核一遍
  how:
    - 用条目的 search_hints 做 web 检索
    - 优先采信发布机关官方页面；高校/企业转载页只能作为"在用"的旁证
    - 核到结果后回写 status / verified_at / verified_source
    - 若发现已替代或废止：更新 superseded_by，并跑 impact.py 评估影响
  honesty_rule: |
    查不到就写 in_use_unverified 并说明查了哪些渠道，
    不要因为"业内都在用"就标 verified_current。
    登记册的价值全部建立在它不撒谎之上。

# =============================================================================
# 各专业设计依据清单 —— 从一份真实高校科研用房可研反推
# -----------------------------------------------------------------------------
# 来源：一份 5.4 万字的真实可研，各专业「设计依据」节共列 68 条标准。
# 它回答的是一个查不到的问题：**这类项目每个专业该引哪些规范。**
# 这个清单在成文规范里没有，只能从做过的报告里反推。
#
# 但这里必须把两样东西分开，它们在原文里长得一模一样：
#
#     标准名称 + 适用专业   →  形。稳定，可复用，就是本清单
#     标准编号（版本）      →  值。会换版，**一律不可复用**
#
# 所以每条只记 code_seen —— 「样本里写的是这个」，不是「应该引这个」。
# code_seen 的唯一用途是检索时当线索，**不得直接抄进报告**。
#
# 为什么这条要写得这么硬：源样本自己就在这上面翻了车。同一份报告里——
#   《公共建筑节能设计标准》暖通章写 GB50189-2015，节能章写 GB50189-2005
#   《建筑照明设计标准》电气章写 GB50034-2013，节能章写 GB50034-2004
#   《采暖通风与空气调节设计规范》写了 GB50736-2012 和 GB50019-2003 两个
#   《无障碍设计规范》挂了 GB50763-2012 和 GB50673-2002 两个编号
#   GB3096-2008 在两章里被冠以《声环境质量标准》和《城市区域环境噪声标准》
# 一份通过了内部流程的真实报告尚且如此，照抄它的编号只会把错误复制一遍。
#
# 地方标准（DGJ/DBJ）不入清单——那是项目所在地的值，不是这类项目的形。
# 只在 local_slots 里留一个槽位说明该专业需要一条地标，编号按所在地查。
# =============================================================================

design_basis_by_discipline:

  usage:
    do: 起草某专业的「设计依据」节时，用本清单确定**该引哪些标准**
    then: 逐条走 RS11_norm_currency 查现行版本，查到的版本才写进报告
    never: 直接把 code_seen 抄进报告。它是线索，不是依据
    check: C10 会拦下未经核验直接采用的外部依据

  status_of_all_entries: |
    全部条目一律视同 in_use_unverified。本清单**不声称任何一条现行有效**——
    一个登记册如果假装知道自己不知道的事，比没有登记册更危险。

