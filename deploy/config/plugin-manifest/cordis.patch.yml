# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: agent-loop
  name: "@deepseek-ai/dsh-agent-loop"
  config:
    agents: []
    maxParallelToolCalls: 20
- id: mcp-connector
  name: 'dsh-mcp-connector'
  config:
    showSidebarEntry: false
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
# 每个会话都拉起一个 Playwright MCP 进程；空会话累积后工具表膨胀，
# “新会话”从 1 秒退化到 80 秒。Web 侧关闭该实验特性，保留手动选择的
# playwright 连接器；Desktop 仍由 workdsh-browser-session 提供。
- id: browser-use-playwright-mcp
  name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
  disabled: true
- id: workdsh-activity
  disabled: true

- insert:
    - id: workdsh-cad-expert-gate
      name: "workdsh-cad-expert-gate"
