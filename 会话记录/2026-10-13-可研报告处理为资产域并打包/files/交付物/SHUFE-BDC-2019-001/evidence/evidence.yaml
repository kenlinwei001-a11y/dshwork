    "doc": "《建筑抗震设计规范》",
    "quote": "抗震设防烈度为7度，设计基本地震加速度值为0.10g：第一组：上海（黄浦区、卢湾区、徐汇、长宁、静安区、普陀区、闸北区、虹口、杨浦、闵行区、宝山、嘉定区、浦东、松江、青浦、南汇、奉贤）。抗震设防烈度为6度，设计基本地震加速度值为0.05g：",
