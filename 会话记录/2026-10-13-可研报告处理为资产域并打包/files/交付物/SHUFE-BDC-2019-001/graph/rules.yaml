[
  {
    "id": "R-总投资构成",
    "kind": "compute",
    "label": "总投资",
    "expr": "round({建安工程费用}+{工程建设其他费用}+{预备费}+{原建筑拆除费用}, 2)",
    "deps": [
      "建安工程费用",
      "工程建设其他费用",
      "预备费",
      "原建筑拆除费用"
    ],
    "target": "总投资",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-建筑面积构成",
    "kind": "compute",
    "label": "总建筑面积",
    "expr": "round({地上建筑面积}+{地下建筑面积}, 0)",
    "deps": [
      "地上建筑面积",
      "地下建筑面积"
    ],
    "target": "总建筑面积",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-配套用房建筑面积",
    "kind": "compute",
    "label": "公共服务配套用房建筑面积",
    "expr": "round({公共服务配套用房使用面积合计}/{公共服务配套用房综合平面利用系数}, 0)",
    "deps": [
      "公共服务配套用房使用面积合计",
      "公共服务配套用房综合平面利用系数"
    ],
    "target": "公共服务配套用房建筑面积",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-应建规模",
    "kind": "compute",
    "label": "地上总建筑面积需求",
    "expr": "round({科研人员规划人数}*{科研人员用房人均建筑面积指标}+{研究生博士生访问学者规划人数}*{研究生博士生访问学者用房人均建筑面积指标}+{公共服务配套用房建筑面积}, 0)",
    "deps": [
      "科研人员规划人数",
      "科研人员用房人均建筑面积指标",
      "研究生博士生访问学者规划人数",
      "研究生博士生访问学者用房人均建筑面积指标",
      "公共服务配套用房建筑面积"
    ],
    "target": "地上总建筑面积需求",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-科研人员规划人数合计",
    "kind": "compute",
    "label": "科研人员规划人数",
    "expr": "{管理科学与量化信息研究中心·规划科研人员}+{理论计算机研究中心·规划科研人员}+{应用统计研究中心·规划科研人员}+{数据科研与统计研究院·规划科研人员}",
    "deps": [
      "管理科学与量化信息研究中心·规划科研人员",
      "理论计算机研究中心·规划科研人员",
      "应用统计研究中心·规划科研人员",
      "数据科研与统计研究院·规划科研人员"
    ],
    "target": "科研人员规划人数",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-研究生规划人数合计",
    "kind": "compute",
    "label": "研究生博士生访问学者规划人数",
    "expr": "{管理科学与量化信息研究中心·规划研究生博士生访问学者}+{理论计算机研究中心·规划研究生博士生访问学者}+{应用统计研究中心·规划研究生博士生访问学者}+{数据科研与统计研究院·规划研究生博士生访问学者}",
    "deps": [
      "管理科学与量化信息研究中心·规划研究生博士生访问学者",
      "理论计算机研究中心·规划研究生博士生访问学者",
      "应用统计研究中心·规划研究生博士生访问学者",
      "数据科研与统计研究院·规划研究生博士生访问学者"
    ],
    "target": "研究生博士生访问学者规划人数",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-规模符合性",
    "kind": "select",
    "label": "设计规模合理性判定",
    "expr": "{地上总建筑面积需求} <= {地上建筑面积} => 规模合理；否则 => 待审",
    "deps": [
      "地上总建筑面积需求",
      "地上建筑面积"
    ],
    "target": "设计规模合理性判定",
    "guard": "前提不满足 => 待审"
  },
  {
    "id": "R-建筑高度校核",
    "kind": "compute",
    "label": "建筑高度控制",
    "expr": "round({一层层高}+({层数}-1)*{标准层层高}, 1)",
    "deps": [
      "一层层高",
      "层数",
      "标准层层高"
    ],
    "target": "建筑高度控制",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-最高日用水量",
    "kind": "compute",
    "label": "最高日用水量",
    "expr": "round(({科研学生用水人数}*{科研学生用水定额}+{办公用水人数}*{办公用水定额})/1000*(1+{未预见系数}/100), 2)",
    "deps": [
      "科研学生用水人数",
      "科研学生用水定额",
      "办公用水人数",
      "办公用水定额",
      "未预见系数"
    ],
    "target": "最高日用水量",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-消防用水量合计",
    "kind": "compute",
    "label": "消防用水量总计",
    "expr": "{室外消火栓系统用水量}+{室内消火栓系统用水量}+{自动喷水灭火系统用水量}",
    "deps": [
      "室外消火栓系统用水量",
      "室内消火栓系统用水量",
      "自动喷水灭火系统用水量"
    ],
    "target": "消防用水量总计",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-总计算负荷",
    "kind": "compute",
    "label": "总计算负荷",
    "expr": "round({本项目面积口径}*({空调负荷密度指标}+{照明及其他负荷密度指标})/1000, 0)",
    "deps": [
      "负荷估算面积口径",
      "空调负荷密度指标",
      "照明及其他负荷密度指标"
    ],
    "target": "总计算负荷",
    "guard": "口径缺失 => undefined"
  },
  {
    "id": "R-供电容量匹配",
    "kind": "select",
    "label": "变压器容量匹配校核",
    "expr": "{原变电站变压器容量} -> {增容后变压器容量} >= {总计算负荷}/{功率因数} => 通过；口径不全 => 待审",
    "deps": [
      "原变电站变压器容量",
      "增容后变压器容量",
      "总计算负荷"
    ],
    "target": "供电容量匹配校核",
    "guard": "口径不全 => 待审"
  },
  {
    "id": "R-冷负荷",
    "kind": "compute",
    "label": "冷负荷",
    "expr": "round({本项目建筑面积}*{单位面积冷负荷指标}/1000, 0)",
    "deps": [
      "本项目建筑面积",
      "单位面积冷负荷指标"
    ],
    "target": "冷负荷",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-热负荷",
    "kind": "compute",
    "label": "热负荷",
    "expr": "round({本项目建筑面积}*{单位面积热负荷指标}/1000, 0)",
    "deps": [
      "本项目建筑面积",
      "单位面积热负荷指标"
    ],
    "target": "热负荷",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-多联机冷量校核",
    "kind": "compute",
    "label": "多联机装机冷量",
    "expr": "{30HP机组单台制冷量}*{30HP机组台数}+{16HP机组单台制冷量}*{16HP机组台数}+{10HP机组单台制冷量}*{10HP机组台数}",
    "deps": [
      "30HP机组单台制冷量",
      "30HP机组台数",
      "16HP机组单台制冷量",
      "16HP机组台数",
      "10HP机组单台制冷量",
      "10HP机组台数"
    ],
    "target": "多联机装机冷量",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-年用水量",
    "kind": "compute",
    "label": "年总用水量",
    "expr": "round({教师用水日水量}*{年工作天数}/10000, 2)+round({学生用水日水量}*{年工作天数}/10000, 2)+round(({教师用水日水量}+{学生用水日水量})*{年工作天数}/10000*({未预见系数}/100), 2)",
    "deps": [
      "教师用水日水量",
      "学生用水日水量",
      "年工作天数",
      "未预见系数"
    ],
    "target": "年总用水量",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-年用电量",
    "kind": "compute",
    "label": "年总耗电量",
    "expr": "round(({科研用房用电面积}*{科研用房用电指标}*{科研用房需要系数}*{科研用房同时使用系数}+{公共配套服务用房用电面积}*{公共配套服务用房用电指标}*{公共配套服务用房需要系数}*{公共配套服务用房同时使用系数})*{日均工作小时数}*{年工作天数}/10000000, 1)",
    "deps": [
      "科研用房用电面积",
      "科研用房用电指标",
      "科研用房需要系数",
      "科研用房同时使用系数",
      "公共配套服务用房用电面积",
      "公共配套服务用房用电指标",
      "公共配套服务用房需要系数",
      "公共配套服务用房同时使用系数",
      "日均工作小时数",
      "年工作天数"
    ],
    "target": "年总耗电量",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-综合能耗",
    "kind": "compute",
    "label": "综合能耗（当量值）",
    "expr": "round({年总耗电量}*{电力折标系数当量值}+{年总用水量}*{水折标系数}, 0)",
    "deps": [
      "年总耗电量",
      "电力折标系数当量值",
      "年总用水量",
      "水折标系数"
    ],
    "target": "综合能耗（当量值）",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-单位面积综合能耗",
    "kind": "compute",
    "label": "单位面积综合能耗（当量值）",
    "expr": "round({综合能耗（当量值）}*1000/{本项目建筑面积}, 2)",
    "deps": [
      "综合能耗（当量值）",
      "本项目建筑面积"
    ],
    "target": "单位面积综合能耗（当量值）",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-单位建筑面积电耗",
    "kind": "compute",
    "label": "单位建筑面积电耗",
    "expr": "round({年总耗电量}*10000/{本项目建筑面积}, 2)",
    "deps": [
      "年总耗电量",
      "本项目建筑面积"
    ],
    "target": "单位建筑面积电耗",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-节能合规判定",
    "kind": "select",
    "label": "建筑节能合规判定",
    "expr": "{建筑节能设计标准版本} == 现行版本 且 {规定性指标} 满足 => 合规；版本不一致 => 待审",
    "deps": [
      "建筑节能设计标准版本",
      "规定性指标"
    ],
    "target": "建筑节能合规判定",
    "guard": "版本不一致 => 待审"
  },
  {
    "id": "R-稳评等级判定",
    "kind": "select",
    "label": "项目社会稳定风险等级判定",
    "expr": "{措施后单因素风险是否均可控} => 低风险；存在不可控因素 => 中/高风险",
    "deps": [
      "措施后单因素风险是否均可控"
    ],
    "target": "项目社会稳定风险等级判定",
    "guard": "单因素风险未全部给出量化估计 => 待审"
  },
  {
    "id": "R-建安工程费口径核对",
    "kind": "select",
    "label": "建安工程招标估算金额一致性",
    "expr": "{建安工程费用} == {建安工程招标估算金额} => 一致；否则 => 待审",
    "deps": [
      "建安工程费用",
      "建安工程招标估算金额"
    ],
    "target": "建安工程招标估算金额一致性",
    "guard": "不一致 => 待审"
  },
  {
    "id": "R-基本预备费",
    "kind": "compute",
    "label": "基本预备费",
    "expr": "round(({建筑安装工程费用}+{工程建设其他费})*{基本预备费费率}/100, 2)",
    "deps": [
      "建筑安装工程费用",
      "工程建设其他费",
      "基本预备费费率"
    ],
    "target": "基本预备费",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-建安工程费用",
    "kind": "compute",
    "label": "建筑安装工程费用",
    "expr": "round({单体工程}+{室外总体工程}+{抗震支架}+{绿色二星增量费用}, 2)",
    "deps": [
      "单体工程",
      "室外总体工程",
      "抗震支架",
      "绿色二星增量费用"
    ],
    "target": "建筑安装工程费用",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-单体工程",
    "kind": "compute",
    "label": "单体工程",
    "expr": "round({土建工程}+{安装工程}, 2)",
    "deps": [
      "土建工程",
      "安装工程"
    ],
    "target": "单体工程",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-土建工程",
    "kind": "compute",
    "label": "土建工程",
    "expr": "round({桩基工程}+{基坑围护工程}+{地下建筑结构工程}+{地上建筑结构工程}+{装配式结构增加费}+{室内装饰工程}+{外立面及屋面装饰工程}, 2)",
    "deps": [
      "桩基工程",
      "基坑围护工程",
      "地下建筑结构工程",
      "地上建筑结构工程",
      "装配式结构增加费",
      "室内装饰工程",
      "外立面及屋面装饰工程"
    ],
    "target": "土建工程",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-安装工程",
    "kind": "compute",
    "label": "安装工程",
    "expr": "round({给排水工程}+{消防工程}+{通风空调工程}+{强电工程}+{弱电工程}+{电梯工程}, 2)",
    "deps": [
      "给排水工程",
      "消防工程",
      "通风空调工程",
      "强电工程",
      "弱电工程",
      "电梯工程"
    ],
    "target": "安装工程",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-室外总体工程",
    "kind": "compute",
    "label": "室外总体工程",
    "expr": "round({道路广场硬地铺装}+{绿化景观}+{室外安装工程}+{标识工程}, 2)",
    "deps": [
      "道路广场硬地铺装",
      "绿化景观",
      "室外安装工程",
      "标识工程"
    ],
    "target": "室外总体工程",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-工程建设其他费",
    "kind": "compute",
    "label": "工程建设其他费",
    "expr": "round({建设单位管理费}+{前期工程咨询费}+{勘察费}+{设计费}+{招标代理费}+{清单及标底编制费}+{施工监理费}+{施工图审图费}+{竣工图编制费}+{场地准备及临时设施费}+{低压电缆}+{人防易地建设费}, 2)",
    "deps": [
      "建设单位管理费",
      "前期工程咨询费",
      "勘察费",
      "设计费",
      "招标代理费",
      "清单及标底编制费",
      "施工监理费",
      "施工图审图费",
      "竣工图编制费",
      "场地准备及临时设施费",
      "低压电缆",
      "人防易地建设费"
    ],
    "target": "工程建设其他费",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-单位造价",
    "kind": "compute",
    "label": "单位造价（总投资口径）",
    "expr": "round({总投资}*10000/{本项目建筑面积}, 0)",
    "deps": [
      "总投资",
      "本项目建筑面积"
    ],
    "target": "单位造价（总投资口径）",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-投资闭合校核",
    "kind": "select",
    "label": "投资构成闭合校核",
    "expr": "abs({建筑安装工程费用}-({单体工程}+{室外总体工程}+{抗震支架}+{绿色二星增量费用})) > 0 => 待审",
    "deps": [
      "建筑安装工程费用",
      "单体工程",
      "室外总体工程",
      "抗震支架",
      "绿色二星增量费用"
    ],
    "target": "投资构成闭合校核",
    "guard": "存在差额 => 待审"
  },
  {
    "id": "R-资金筹措构成",
    "kind": "compute",
    "label": "总投资（筹措口径）",
    "expr": "round({国拨资金}+{学校自筹资金}, 2)",
    "deps": [
      "国拨资金",
      "学校自筹资金"
    ],
    "target": "总投资",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-国拨资金占比",
    "kind": "compute",
    "label": "国拨资金占比",
    "expr": "round({国拨资金}/{总投资}*100, 2)",
    "deps": [
      "国拨资金",
      "总投资"
    ],
    "target": "国拨资金占比",
    "guard": "missing_any_dep => undefined"
  },
  {
    "id": "R-资产负债率",
    "kind": "compute",
    "label": "资产负债率",
    "expr": "round({负债总额}/{资产总额}*100, 2)",
    "deps": [
      "负债总额",
      "资产总额"
    ],
    "target": "资产负债率",
    "guard": "missing_any_dep => undefined"
  }
]