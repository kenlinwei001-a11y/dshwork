      "id": "CL-必要性-00",
      "text": "为实现上海财经大学“初步建成具有鲜明财经特色的高水平研究型大学”的战略目标，推进学校“统计学”世界一流学科的发展，本项目提出对中山北一路校区原有第五教学楼进行拆除，重新建设大数据研究中心。",
      "claim_type": "inference",
      "status": "unverified",
      "toulmin": {
        "claim": "本项目应当立项建设",
        "grounds": "学校战略目标 + 统计学一流学科发展 + 现有第五教学楼条件不足",
        "warrant": "一流学科建设依赖科研能力提升，而科研用房是科研能力的基础与支撑（原文第3.2.3节给出）",
        "backing": "《上海财经大学推进世界一流大学和一流学科建设方案》",
        "qualifier": "",
        "rebuttal": "——"
      },
      "evidence_refs": [
        "EV-内部-05",
        "EV-内部-06"
      ]
    },
    {
