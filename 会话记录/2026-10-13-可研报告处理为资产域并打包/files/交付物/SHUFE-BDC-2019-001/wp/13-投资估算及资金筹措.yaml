      "expr": "round({地上建筑面积}+{地下建筑面积}, 0)",
      "deps": [
        "地上建筑面积",
        "地下建筑面积"
      ],
      "target": "总建筑面积",
      "recheck": "闭合"
    },
    {
      "id": "R-基本预备费",
      "label": "基本预备费",
      "expr": "round(({建筑安装工程费用}+{工程建设其他费})*{基本预备费费率}/100, 2)",
      "deps": [
        "建筑安装工程费用",
        "工程建设其他费",
        "基本预备费费率"
      ],
      "target": "基本预备费",
      "recheck": "派生差异"
    },
    {
      "id": "R-单位造价",
      "label": "单位造价（总投资口径）",
      "expr": "round({总投资}*10000/{本项目建筑面积}, 0)",
      "deps": [
        "总投资",
        "本项目建筑面积"
      ],
      "target": "单位造价（总投资口径）",
      "recheck": "阻塞(冲突未裁决)"
    },
    {
      "id": "R-资金筹措构成",
      "label": "总投资（筹措口径）",
      "expr": "round({国拨资金}+{学校自筹资金}, 2)",
      "deps": [
        "国拨资金",
        "学校自筹资金"
      ],
      "target": "总投资",
      "recheck": "闭合"
    },
    {
      "id": "R-国拨资金占比",
      "label": "国拨资金占比",
      "expr": "round({国拨资金}/{总投资}*100, 2)",
      "deps": [
        "国拨资金",
        "总投资"
      ],
      "target": "国拨资金占比",
      "recheck": "闭合"
    },
    {
      "id": "R-资产负债率",
      "label": "资产负债率",
      "expr": "round({负债总额}/{资产总额}*100, 2)",
      "deps": [
        "负债总额",
        "资产总额"
      ],
      "target": "资产负债率",
      "recheck": "闭合"
    }
  ],
