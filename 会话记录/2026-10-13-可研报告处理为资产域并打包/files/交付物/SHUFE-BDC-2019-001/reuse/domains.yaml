          },
          {
            "label": "总投资",
            "unit": "万元",
            "formula": "建安工程费用 + 工程建设其他费用 + 预备费 + 拆除费用"
          },
          {
            "label": "单位造价",
            "unit": "元/㎡",
            "formula": "总投资 / 总建筑面积"
          },
          {
            "label": "国拨资金占比",
            "unit": "%",
            "formula": "国拨资金 / 总投资"
          },
          {
            "label": "资产负债率",
            "unit": "%",
            "formula": "负债总额 / 资产总额"
          },
          {
            "label": "最高日用水量",
            "unit": "m³/d",
            "formula": "(分类人数×用水定额)/1000 ×(1+未预见系数)"
          },
          {
            "label": "消防用水量",
            "unit": "L/s",
            "formula": "室外消火栓 + 室内消火栓 + 自动喷水"
          },
          {
            "label": "年用电量",
            "unit": "万kW·h",
            "formula": "Σ(面积×用电指标×需要系数×同时使用系数)×日工时×年天数"
          },
          {
            "label": "冷负荷 / 热负荷",
            "unit": "kW",
            "formula": "建筑面积 × 单位面积(冷|热)负荷指标"
          },
          {
            "label": "综合能耗（当量值/等价值）",
            "unit": "tce",
            "formula": "Σ(能耗量 × 折标系数)"
          },
          {
            "label": "单位面积综合能耗 / 单位建筑面积电耗",
            "unit": "kgce/㎡、kW·h/㎡",
            "formula": "能耗 / 总建筑面积"
          }
        ],
        "unit_traps": [
          "未预见系数原文以 % 表达（10），公式中须 /100，否则结果放大 100 倍",
