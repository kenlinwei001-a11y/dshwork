        "unit": "W/㎡",
        "type": "number"
      },
      {
        "label": "折标系数（电力当量值 / 水）",
        "unit": "tce/万kW·h、tce/万m³",
        "type": "number"
      },
      {
        "label": "年工作天数",
        "unit": "d",
        "type": "int"
      }
    ],
    "computed": [
      {
        "label": "科研人员规划人数",
        "unit": "人",
        "formula": "各科研中心科研人员之和"
      },
      {
        "label": "研究生博士生访问学者规划人数",
        "unit": "人",
        "formula": "各科研中心研究生之和"
      },
      {
        "label": "公共服务配套用房建筑面积",
        "unit": "㎡",
        "formula": "使用面积合计 / 综合平面利用系数"
      },
      {
        "label": "地上总建筑面积需求",
        "unit": "㎡",
        "formula": "科研人员数×科研人均指标 + 研究生数×研究生人均指标 + 配套用房建筑面积"
      },
      {
        "label": "总建筑面积",
        "unit": "㎡",
        "formula": "地上建筑面积 + 地下建筑面积"
      },
      {
        "label": "基本预备费",
        "unit": "万元",
        "formula": "(建筑安装工程费用 + 工程建设其他费) × 费率"
      },
      {
        "label": "建筑安装工程费用",
        "unit": "万元",
        "formula": "单体工程 + 室外总体工程 + 抗震支架 + 绿色二星增量费用"
      },
      {
        "label": "总投资",
        "unit": "万元",
        "formula": "建安工程费用 + 工程建设其他费用 + 预备费 + 拆除费用"
      },
      {
        "label": "单位造价",
        "unit": "元/㎡",
        "formula": "总投资 / 总建筑面积"
      },
      {
        "label": "国拨资金占比",
        "unit": "%",
        "formula": "国拨资金 / 总投资"
      },
      {
        "label": "资产负债率",
        "unit": "%",
        "formula": "负债总额 / 资产总额"
      },
      {
        "label": "最高日用水量",
        "unit": "m³/d",
        "formula": "(分类人数×用水定额)/1000 ×(1+未预见系数)"
      },
      {
        "label": "消防用水量",
        "unit": "L/s",
        "formula": "室外消火栓 + 室内消火栓 + 自动喷水"
      },
      {
        "label": "年用电量",
        "unit": "万kW·h",
        "formula": "Σ(面积×用电指标×需要系数×同时使用系数)×日工时×年天数"
      },
      {
        "label": "冷负荷 / 热负荷",
        "unit": "kW",
        "formula": "建筑面积 × 单位面积(冷|热)负荷指标"
      },
      {
        "label": "综合能耗（当量值/等价值）",
        "unit": "tce",
        "formula": "Σ(能耗量 × 折标系数)"
      },
      {
        "label": "单位面积综合能耗 / 单位建筑面积电耗",
        "unit": "kgce/㎡、kW·h/㎡",
        "formula": "能耗 / 总建筑面积"
      }
    ],
    "unit_traps": [
      "未预见系数原文以 % 表达（10），公式中须 /100，否则结果放大 100 倍",
      "用电量由 W·h 折「万 kW·h」除数为 1e7（不是 1e4），否则结果放大 1000 倍",
      "「万元」与「元」在单位造价与分项金额之间必须显式换算"
    ]
  },
