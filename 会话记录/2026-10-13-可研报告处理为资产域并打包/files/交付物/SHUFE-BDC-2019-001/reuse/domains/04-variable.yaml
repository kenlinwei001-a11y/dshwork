        "type": "number"
      },
      {
        "label": "未预见系数",
        "unit": "%",
        "type": "number"
      },
      {
        "label": "用电指标 / 需要系数 / 同时使用系数",
        "unit": "W/㎡ / - / -",
        "type": "number"
      },
      {
