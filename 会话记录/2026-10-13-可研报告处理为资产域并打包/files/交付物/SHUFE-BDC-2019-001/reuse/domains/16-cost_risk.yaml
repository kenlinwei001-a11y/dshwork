    "cost_methods": [
      {
        "name": "费用构成归集法",
        "expr": "总投资 = 建安工程费用 + 工程建设其他费用 + 预备费 + 拆除费用"
      },
      {
        "name": "单位造价法",
        "expr": "分项金额 = 数量 × 单位造价"
      },
      {
        "name": "费率法",
        "expr": "基本预备费 = (建安工程费用 + 工程建设其他费用) × 费率"
      },
      {
        "name": "系数法",
        "expr": "前期费用 = 基数 × 系数（如 勘察费 = 建安费×0.35%、竣工图编制费 = 设计费×8%）"
      },
      {
        "name": "造价指标法",
        "expr": "参照类似工程造价指标（原文列为估算依据，但未给出指标来源与数值）"
      }
    ],
