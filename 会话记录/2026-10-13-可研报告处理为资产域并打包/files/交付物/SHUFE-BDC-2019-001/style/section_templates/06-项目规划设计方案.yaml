    {
      "type": "heading",
      "level": 0,
      "title": "2. 供电电源"
    },
    {
      "type": "paragraph",
      "n": 2,
      "skeleton_sample": "拟从学校距离{{node}}m的原变电站引来⟨数字⟩回路⟨数字⟩V电源，电缆穿管埋地敷设至本工程配电间。二级负荷电源引自不同变压器母线段。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "3. 计量"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "本项目电业量电方式采用原有高供高量。原变电站低压出线及本项目配电间出线设多功能表，用于内部计量考核。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "4. 配电系统"
    },
    {
      "type": "paragraph",
      "n": 2,
      "skeleton_sample": "本工程对消防设备用电、电梯电力等设备采用双电源供电，两路电源在末端自切；每层设强电井，强电井中设五种配电箱，即普通照明、重要照明、应急照明、普通动力、消防动力。普通照明、普通动力采用树干式单电源供电，重要照明、应急照明、消防动力采用树干式双电源供电。"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "照明设计"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "1. 照明光源：为实施绿色照明宗旨，即在满足照度标准和照明质量要求前提下，达到\t节约能源、保护环境，故考虑以选用发光效能高的LED光源为主。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "2. 除对光源有特殊要求的场所则按工艺要求设计，其余按功率相同而光通量大的光源\t选择灯具。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "3. 照明标准：所有场所的照度标准、照明质量标准以及照明节能标准均按照国家标准GB50034—2013《建筑照明标准》执行。"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "火灾自动报警系统"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "1. 火灾自动报警采用控制中心报警系统，在一层设分消防控制室，并设直通室外疏散门。与保卫处主消防控制室联网。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "2. 系统由火灾报警控制器、消防联动控制器、消防控制室图形显示装置、消防应急广播、消防专用电话、火灾探测器、手动火灾报警按钮、火灾声光警报器等组成，火灾报警控制器选用智能型控制器，能显示各报警点的位置，并根据报警信号发出联动控制指令，控制器预留RS232通讯接口。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "3. 设漏电火灾报警系统。"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "系统由电气火灾监控器、剩余电流式和测温式电气火灾监控探测器组成。在低压配电系统首端、在第一级配电箱出线端设置探测器，在火灾危险性大、人员密集等场所的区域配电箱设置二级电气火灾探测装置。电气火灾监控器设置在消防安保中心，并应在消防控制室图形显示装置上显示。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "4. 设防火门监控系统。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "5. 设消防电源监控系统。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "6. 设智能应急照明系统。"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "消防应急照明和疏散指示系统采用集中电源集中控制型。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "7. 设余压监控系统。"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "防雷接地及保安措施"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "1. 本工程为大数据研究中心，按二类防雷建筑设防。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "2. 建筑物电子信息系统雷达防护等级为B级。在变电站低压母线、屋顶室外电力配电箱，楼层配电箱，电梯机房等配电箱设SPD.进出建筑物的所有电子系统信号线路均设置SPD。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "3. 防雷接地、工作接地、保护接地等合一为联合接地系统，要求接地电阻小于1欧姆。变配电间、配电间、弱电设备用房、消控安保机房、楼层配电竖井、柴油发电机房储油间等均要求专用引下线与基础联合接地体焊接。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "4. 本项目的接地形式采用TN-S系统。所有进入楼内的各种设备金属管道均要与接地装置可靠联接。所有单相用电插座回路应设漏电保护开关装置。"
    },
    {
      "type": "heading",
      "level": 2,
      "title": "弱电设计"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "设计内容"
    },
    {
      "type": "paragraph",
      "n": 7,
      "skeleton_sample": "数据/语音通信系统与综合布线系统"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "数据/语音通信系统与综合布线系统"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "1. 服务器、核心交换机设在学校原通信机房内。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "2. 整个建筑数据、语音通信等采用综合布线系统。语音、数据信息点可灵活调配，以满足科研及办公自动化语音、数据、图像等信息资源高速交换的业务需要。系统采用星型物理拓扑结构，工作区、水平布线均采用六类屏蔽线缆（STP）及器件，干线采用光缆和大对数电缆，支持包括令牌环网、ATM、快速以太网、千兆以太网在内的多种局域网。系统组成如下："
    },
    {
      "type": "paragraph",
      "n": 4,
      "skeleton_sample": "工作区：根据用户要求，在各个科研用房、办公室、会议室、实验室、阅览室等处设置可用于电话、计算机网络的信息插座。"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "安全防范系统"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "1. 本系统接入原监控机房系统，与原有系统兼容。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "2. 视频安防监控系统"
    },
    {
      "type": "paragraph",
      "n": 3,
      "skeleton_sample": "在主要出入口处、走廊、电梯前室等处设置半球固定式彩色摄像机或室内一体化球形彩色摄像机，在地下车库设置固定式或带云台与变焦镜头的彩色摄像机，在电梯轿厢内设针孔式黑白摄像机。所有摄像机处配置红外灯。"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "校园公共广播与应急广播系统"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "1. 根据使用要求，校园公共广播和应急广播合用一套系统，系统主机设置在原学校广播站。本项目信号引自原学校广播站。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "2. 在走廊、科研用房等处设3W吸顶扬声器。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "3. 校园公共广播系统采用数字化传输与各个校园单体建筑相联系。"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "有线电视系统"
    },
    {
      "type": "paragraph",
      "n": 2,
      "skeleton_sample": "本系统节目来自原学校电视机房。系统采用全频段双向光纤、同轴电缆混合的方式，支持模拟电视与数字电视的传输应用。采用⟨数字⟩MHZ邻频电视系统，带宽⟨数字⟩GHZ，使系统频道扩展及功能均能满足将来有线电视的发展要求。有线电视采用分支分配方式，使各电视终端相互独立、互不影响、方便维护。"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "会议与扩声系统"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "在多功能厅设会议与扩声系统，设置调音台、音箱、投影仪、音视频切换器、多媒体电脑等设备，可进行会议扩声和播放视频图像、多媒体数据图像。并预留同声传译系统条件，同声传译系统采用无线式（直接感应式）。"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "多媒体科研系统"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "在各个科研用房，实验室设置多媒体科研系统，在科研用房讲台处设置一套多媒体科研控制台，包括多媒体集中控制主机及操作键盘、多媒体计算机、实物投影机、幻灯机、DVD机、录像机、功放等设备。根据房间的大小在侧墙上设置几组扬声器，在科研用房内吊挂多媒体投影仪和电动投影幕。教师可控制各种设备（包括投影幕、电动窗帘、灯光等），实现多媒体科研。"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "电子信息系统防浪涌保护设施"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "$$ 根据《建筑物电子信息系统防雷技术规范》，所有进出校区的各个系统的缆线，均设置防浪涌保护器。光缆的金属接头、金属挡潮层、金属加强芯等，在入户处直接接地。建筑采用共用接地方式，各弱电机房和竖井内设置接地端子，接地电阻≤⟨数字⟩Ω。 $$"
    },
