      "skeleton_sample": "上海财经大学是我国历史最悠久的高等财经学府，学校源于⟨数字⟩年南京高等师范学校创办的商科。⟨数字⟩年，学校东迁上海，创建上海商科大学，成为中国教育史上最早的商科大学，郭秉文任校长，马寅初任教务主任。新中国成立后，学校更名为上海财政经济学院，孙冶方担任首任院长。⟨数字⟩年，学校更名为上海财经大学。⟨数字⟩年⟨数字⟩月，学校由财政部划归教育部领导。学校为国家首批"
