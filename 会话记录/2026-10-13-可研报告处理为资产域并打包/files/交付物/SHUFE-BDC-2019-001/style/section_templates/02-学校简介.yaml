      "level": 0,
      "title": "2. 国际人才集聚，师资结构优化。学校以引进海外优秀人才并切实发挥作用为突破口，开创性实施“海外院长实聘”制、“常任轨”制、海外特聘教授制等系列举措，大力引进海外高层次人才，建设高水平国际化师资队伍，进而实施对接国家战略和主动融入国际教育发展趋势的综合教育改革，得到国家和地方的充分肯定与认可。“常任轨”制度实践被上海市委组织部和中共中央组织部采纳；学校入选中共中央组织部批准的第三批“海外高层次人才创新创业基地”；学校入选国家教育体制改革试点项目“探索开放环境下高校师资队伍建设模式”。"
    },
    {
