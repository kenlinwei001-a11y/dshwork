      "title": "1. 财经特色鲜明，学科优势明显。学校拥有会计学、财政学、经济思想史、金融学（培育）4个国家级重点学科；拥有财政部重点学科4个、上海市重点学科6个和上海市一流学科6个。经济学和商学学科在国际学术界已具显著影响力。在荷兰蒂尔堡大学（Tilburg University）世界经济学顶尖期刊发文排名、美国UT达拉斯分校（University of Texas at Dallas）世界顶尖商学期刊发文排名、美国亚里桑那州立大学（Arizona State University）世界金融学顶尖期刊排名中，学校位列国内、亚洲前茅。"
