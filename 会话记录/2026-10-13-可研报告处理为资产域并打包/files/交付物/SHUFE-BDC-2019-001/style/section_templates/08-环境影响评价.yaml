    },
    {
      "type": "heading",
      "level": 0,
      "title": "1. 废气处理措施"
    },
    {
      "type": "paragraph",
      "n": 4,
      "skeleton_sample": "（⟨数字⟩）排风口与环境敏感目标的间距不小于{{node}}m，排风口朝向人员活动区域时，其底部离地面不小于⟨数字⟩m。"
    },
    {
