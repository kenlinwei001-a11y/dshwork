    },
    {
      "type": "paragraph",
      "n": 3,
      "skeleton_sample": "（⟨数字⟩）本工程噪声源热泵机组、风机、水泵、空调机组等动力设备均设置在设备机房内或屋顶。设计时，动力设备应选用低噪声设备，按规定采取隔振降噪措施，动力设备机房和值班室、控制室采用吸音墙面、吸音吊顶处理和隔音措施，设隔声门以降低噪声。"
