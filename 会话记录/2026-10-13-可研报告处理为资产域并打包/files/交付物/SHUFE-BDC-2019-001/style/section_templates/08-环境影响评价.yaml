      "title": "1．扬尘及废气影响分析"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "施工建设过程中产生的粉尘污染主要来自水泥的运输和搅拌作业，扬尘污染主要来自挖土、运土、装卸等施工环节。施工期间的废气污染主要为内燃机械和车辆尾气污染。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "2．废水影响分析"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "施工期间的废水主要为施工人员的生活污水和施工过程中的土方阶段降排水、冲车水、混凝土养护水及路面清洗水。施工废水含砂量较大，直接排放会污染附近的地表水体；施工机械和车辆滴漏的油类由雨水径流携带进入施工场地附近的地面和地表水体，如果不注意，亦可能导致环境污染。而生活污水中亦含有较大量的有机物和悬浮物。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "3．噪声影响分析"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "施工噪声污染主要来自施工中采用的大型施工机械设备，如各种打桩、吊装设备，混凝土拌、施工等。还有运输车辆、拖拉机、卡车等产生的机械振动噪声和行驶噪声。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "4．固体废物影响分析"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "项目施工期间产生的固体物主要为建筑垃圾、施工及挖土方产生的弃土、装修垃圾及施工人员产生的生活垃圾。如随意堆放，将占用土地，并对周围环境产生较大影响。"
    },
    {
      "type": "heading",
      "level": 3,
      "title": "运营期环境影响分析"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "1．废气影响分析"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "运营期废气主要来自于地面汽车尾气等。汽车排放尾气中的污染物主要是一氧化碳（CO）、二氧化氮（NO⟨数字⟩）、碳氢化合物（THC）等有害物。"
    },
    {
