      "title": "施工期环境保护措施"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "1．施工扬尘防治措施"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "为了减少施工扬尘对周围环境的影响，要对弃土表面作洒水处理，及时运走弃土，在装运过程中避免超载，确保装土车沿途不洒落。车辆驶出工地前应将轮子的泥土清除干净，防止沿程影响环境整洁。同时施工者应对工地门前的道路实行保洁制度，一旦有弃土、建材洒落，应及时清理。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "2．水污染防治措施"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "施工期间作业产生的泥浆水等污水，要建造简易沉淀池经沉淀后排放或回用，以保护地表水河道；施工人员的生活污水及设备车辆的冲洗水等，禁止乱排、漫流，受纳水体应设置格栅，以滤去粗颗粒及杂物等。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "3．噪声防治措施"
    },
    {
      "type": "paragraph",
      "n": 4,
      "skeleton_sample": "为了减少施工噪声对周围居民及师生的影响，施工及运输物料时应合理安排施工时间与地点。对施工机械采取降噪措施，同时也可在工地周围设立临时隔声屏障，以保证区域环境质量。施工的设备噪声治理难度大，一般采取以下措施："
    },
    {
      "type": "heading",
      "level": 0,
      "title": "4．固废防治措施"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "建设单位及工程承包单位应与当地环卫部门联系，及时清理施工现场的生活废弃物。对施工人员要加强岗位培训教育，将生活及建筑废弃物定点存放、及时清运，不随意乱扔废弃物，以保证环境卫生质量。"
    },
