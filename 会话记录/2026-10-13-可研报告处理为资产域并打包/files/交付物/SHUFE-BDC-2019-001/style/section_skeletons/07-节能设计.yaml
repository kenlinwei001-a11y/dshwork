    },
    {
      "type": "heading",
      "level": 3,
      "title": "给排水节能措施"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "1. 本工程一层由市政管网压力直接供水，二层及以上楼层采用变频增压供水，增压系统选用节能高效的设备；给水系统分区合理，无超压出流现象。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "2. 给水系统中配水支管用水点供水压力大于0.20MPa的楼层均设置支管减压阀减压，控制各用水点处水压小于或等于0.20MPa，且不小于用水器具要求的最低工作压力，合理采取减压限流的节水措施"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "3. 采取有效措施避免管道、阀门和设备的漏水、渗水或结露。选用密闭性能好的阀门、设备，使用耐腐蚀、耐久性能好的管材、管件。室外埋地管道采取有效措施避免管网漏损。根据水平衡测试的要求设置分级计量水表。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "4. 管材、管路附件及设备等供水设施的选取和运行不对水质造成二次污染。各类不同水质要求的给水管线有明显的管道标识。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "5. 所有用水器具均采用节水型产品。用水效率达到2级。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "6. 选用高灵敏度水表，按使用用途、付费或管理单元情况，对不同部位的用水分别设置用水计量装置。"
    },
    {
      "type": "heading",
      "level": 0,
      "title": "7. 根据用水要求的不同，给水水质应达到国家、行业或地方标准的要求。"
    },
    {
      "type": "heading",
      "level": 2,
      "title": "节能效果分析"
    },
    {
      "type": "paragraph",
      "n": 1,
      "skeleton_sample": "本项目为达到节能的目标，在建筑设计、给排水设计、电气设计、暖通设计等方面严格执行国家相关方面的标准、规范。项目积极选用高效节能的设备、材料和技术方案，符合国家相关的节能要求。项目不采用国家明令禁止或淘汰的落后工艺、设备，在节能措施中积极采用新设备、新工艺、新技术、新产品，达到节能效果，保证绿色经济、低碳经济的实现。"
    }
