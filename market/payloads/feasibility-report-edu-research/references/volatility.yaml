# =============================================================================
# 时效性与约束强度 —— 哪些事实会过期，过期了谁能替换它
# -----------------------------------------------------------------------------
# 图上的事实不是同一种东西。有两类，寿命完全不同：
#
#   硬约束  这个项目的事实。总建筑面积、师生人数、投资额、建设地点。
#           它不会自己变。要变必须走变更流程：客户确认 + 影响分析 + 留痕。
#
#   软约束  会随时间失效的事实。规范版本、政策文号、面积定额、单方造价、
#           统计数据、对标案例。它**不因为写进了图就成立**，
#           只是「截至某日查到的是这个」。
#
# 这个区分以前是隐含的，代价很具体：软约束被当成硬约束保护起来，
# 于是查到了新版规范也不敢直接换——要走冲突裁决，问客户"两个值用哪个"。
# 客户看着 GB50189-2005 和 GB50189-2015 也不知道该选哪个，
# 于是这件事就一直挂着，最后带着旧版本出稿。
#
# **软约束的正确处置是：新证据直接替换，不走裁决，但留痕。**
# 版本更新不是冲突——旧的那个不是"另一种意见"，是过期了。
#
# 反过来也要守住：软约束**只能被更新的同类证据替换**，
# 不能被"我觉得应该是"替换。替换仍然要过 external-fit 的适配性评估。
# =============================================================================

meta:
  id: fsr-volatility
  version: 0.1.0
  layer: L0

# =============================================================================
# 一、软约束的类别与保鲜期
# =============================================================================
# TTL 不是"过了就错"，是"过了就必须重新查一次才能用"。
# 定得太长等于没有；定得太短会让每次出稿都在查规范。
# 下面的天数按**这类东西实际的换版频率**定，不是拍的整数。
# =============================================================================

volatile_classes:

  V1_norm_version:
    cn: 规范/标准的版本号
    examples: [GB50189-2015, JGJ16-2008, 建标191-2018]
    ttl_days: 90
    why: |
      **最要紧的一类。** 规范换版之后，整段论证的 warrant 就不成立了——
      正文读起来完全正常，评审一查条款号才发现引的是废止版。
      源样本里同一份报告的两章引了 GB50189 的两个版本，
      说明这件事连人工复核都挡不住。
    replace_by: [SEARCH, 客户素材]
    on_replace: 更新编号与颁布年份，并复核**引用的条款号在新版里是否还在同一位置**
    trap: 只换编号不换条款号是半吊子替换，比不换更危险——编号新了，条款对不上了

  V2_policy_document:
    cn: 政策/规划/批复的文号与有效期
    examples: ["〔2023〕304号", 十四五专项规划, 地方配建标准]
    ttl_days: 120
    why: 规划有期限，政策会被新文替代。引用一份已被替代的规划做必要性论证，是整章塌掉
    replace_by: [SEARCH, 客户素材]
    on_replace: 新文与旧文的关系要写明（替代 / 补充 / 并行），不是简单换个文号
    trap: 「十四五」这类带期限的规划，跨期之后不是失效而是**不再适用于本期**，两回事

  V3_index_quota:
    cn: 面积定额、用地指标、配建比例
    examples: [生均建筑面积指标, 停车配建比, 绿地率下限]
    ttl_days: 180
    why: 定额一改，规模测算的整条链重算。它是 E2 证据，不是可以"沿用上次"的东西
    replace_by: [SEARCH, 客户素材]
    on_replace: 必须重跑规模测算（COMPUTE），不许只改数不重算

  V4_price_cost:
    cn: 单方造价、材料价格、费率
    examples: [土建单方造价, 基本预备费率, 人工单价]
    ttl_days: 180
    why: 价格年份不匹配是投资估算最常见的硬伤，而且一眼看不出来
    replace_by: [SEARCH, 客户素材]
    on_replace: 换价必须同时更新价格年份口径，并说明是否做了调价系数
    trap: 拿三年前的单方造价配今年的面积，算出来的总投资看着很正常

  V5_statistics:
    cn: 统计数据与区域背景数据
    examples: [国民经济和社会发展统计公报口径, 在校生规模, 人口数据]
    ttl_days: 365
    why: 统计公报有年份。引用时要写明是哪一年的数，别把三年前的当现状
    replace_by: [SEARCH, 客户素材]

  V6_benchmark:
    cn: 同类项目对标值
    examples: [同类项目单方造价, 同类项目建设周期]
    ttl_days: 365
    why: 对标案例本身会过时，而且新案例出现后旧案例的代表性会下降
    replace_by: [SEARCH]
    note: 对标值本来就是 E5 类比证据，等级不高。过期后**宁可不对标**，不要硬用

  V7_org_public_info:
    cn: 建设单位的公开信息
    examples: [机构设置, 人员规模, 科研平台名录, 获奖情况]
    ttl_days: 180
    why: 官网常年不更新，而写进「单位概况」的每一句都是以客户的名义在说
    replace_by: [客户素材]
    hard: |
      **这一类不接受 SEARCH 单方替换。** 查到的新信息仍须客户核对后才落图——
      同名单位、宣传口径两个坑都在这里。见 section-research.yaml 的 hard_rule。

# =============================================================================
# 二、什么是硬约束 —— 不在上面清单里的，默认是硬的
# =============================================================================
hard_constraints:
  cn: 本项目的事实
  examples: [总建筑面积, 分项面积, 师生人数, 投资额, 资金来源, 建设地点, 用地面积]
  rule: |
    硬约束不会自己过期，也不许被检索结果替换。
    要变只有一条路：客户确认 → impact.py 算影响 → 变更日志留痕。
  why: |
    把硬约束当软的，后果是 agent 查到一个"同类项目一般是多少"就去改客户的数。
    那不是更新，那是编造。

  boundary_case: |
    有一类容易判错：**客户素材里的定额引用**。
    客户给的材料里写着「按 XX 指标 14 ㎡/生」——
    指标本身是软的（V3），但「客户认可按这个指标算」是硬的。
    处置：指标值走 V3 复核，客户的认可留在原处不动。
    查到指标换版了，要回去问客户「新版是 15 ㎡/生，是否按新版重算」。

# =============================================================================
# 三、替换协议
# =============================================================================
replacement:

  not_a_conflict: |
    **软约束被新证据替换，不是素材冲突，不走客户裁决。**
    旧值不是"另一种意见"，是过期了。把它当冲突抛给客户，
    客户面对 GB50189 的两个版本也不知道选哪个，这件事就会一直挂着，
    最后带着旧版本出稿——这是软硬不分最实际的代价。

  still_gated: |
    但替换不等于自动采纳。新证据仍要过 external-fit 的硬否决与六维打分。
    「更新」不构成"更适配"——一份新发的外省文件，比不上一份在用的本省文件。

  record: |
    每次替换写一条变更记录：旧值 / 新值 / 来源 / 核验日期 / 触发的重算。
    不留痕的替换，等于把"这个数什么时候查的"这个信息丢了，
    下次复核时又得从头查一遍。

  recompute: |
    V3/V4 类替换后**必须重跑依赖它的派生**（impact.py）。
    只改定额不重算规模，是图与正文脱节的标准入口。

  from_corpus: |
    语料库里的规范编号、政策文号一律是软约束，而且**默认已过期**——
    库里那份报告是哪年编的，它的编号就是哪年的。
    检索到的历史章节提示「这里要引一条节能设计标准」，
    具体引哪一版，现查。

# =============================================================================
# 四、检查
# =============================================================================
constraints:

  C21_volatile_verified:
    cn: 软约束出稿前须在保鲜期内
    rule: |
      被正文引用的软约束节点，其 verified_at 距出稿日不得超过该类的 ttl_days。
      超期的必须重新核验后才能出稿。
    severity: error
    at: G4 出稿前
    note: 只查**被引用的**。图上存着没用到的过期条目不拦——拦了会让人去删条目而不是去核验

  C21b_volatile_marked:
    cn: 软约束须标出来
    rule: 属于 volatile_classes 的节点必须带 volatility 字段，不许当成普通事实
    severity: warning
    why: 不标就会被当硬约束保护，查到新版也不敢换

  C21c_hard_not_auto_replaced:
    cn: 硬约束不得被检索结果替换
    rule: 硬约束节点的值变更，来源不得是 SEARCH
    severity: error
    why: 这是编造的一种，而且形式上看起来很像"更新"
