# =============================================================================
# 垂类：高校科研用房（L1）
# -----------------------------------------------------------------------------
# 状态：规则集已在真实报告上验算闭合，检查器命中的缺陷经人工确认。
#   验证记录留在 base 的 references/validation/，不随本包交付。
#
# ⚠️ 本文件不含任何具体项目的数据。所有算例均为合成示例，仅示范算式形状，
#    **不得作为任何项目的缺省取值或参照**。
#
# 基准：发改投资规〔2023〕304号《政府投资项目可行性研究报告编写通用大纲》
#
# 与「高校学生生活用房」垂类的根本差别：
#   科研用房的规模由**科研团队规模 × 人均指标**决定，论证落点是学科与平台；
#   学生生活用房的规模由**在校生规模 − 现有存量**决定，论证落点是缺口。
#   两者的驱动量、指标、论证重点、运营模式都不同，不宜合成一个垂类。
# =============================================================================

profile:
  id: edu-research
  cn: 高校科研用房
  extends: outline-gov-2023
  version: 0.1.0
  validated: true
  validation:
    # 「验证过」是关于**规则集**的陈述，不是关于某个项目的陈述。
    # 拿哪份报告验的、那份报告什么口径什么建设性质，都属项目信息，不进本包。
    method: 派生链在真实报告上逐条验算闭合；检查器在同一份报告上命中真实缺陷并被人工确认
    verified_chains: [规模链, 造价链, 资金链]
    findings_reproduced: [同一面积在不同章节写成不同值, 必要性论证缺 warrant, 设计规模超需求未说明, 规范名称引错, 法定章节覆盖不全]
    record: 验证记录与原始编码留在 base 的 references/validation/，不随本包交付
  validation_note: |
    验证得到的结论有两条，方向相反，都写进了本垂类的设计：
    ① **数据链可复用**——本文件与 rules.yaml 里的规则形状经得起真实数据检验；
    ② **旧口径报告的章节结构不可参照**——2023 大纲之前编制的报告普遍缺少
       规划政策符合性、需求分析、项目产出方案、要素保障、数字化方案、运营方案、
       财务可持续性、经济影响、碳达峰碳中和、风险应急预案等法定内容。
    所以骨架一律以 2023 大纲为准，不照抄任何一份样板报告。

# =============================================================================
# 适用范围
# =============================================================================
scope:
  includes:
    - 专职科研机构用房（研究中心、研究院、重点实验室）
    - 学科科研平台、交叉研究平台
    - 科研实验楼、中试基地
    - 附属的交流讨论、报告厅、阅览、档案等公共服务配套
  excludes:
    - 学生宿舍、食堂、生活配套 → 用 edu-student-life 垂类
    - 教学楼、图书馆等基本教学用房 → 指标口径不同，需另建垂类
    - 独立立项的科研信息化项目 → 无实体建设，本垂类不适用
  funding_regime: 政府投资（部属高校走中央预算内 + 学校自筹；地方高校走地方财政）
  typical_commercial: false
  typical_physical: true
  common_nature: [新建, 拆除重建, 改建]
  note: |
    科研用房项目常伴随既有建筑拆除（拆除既有教学楼原址重建是典型情形）。
    拆除会带来三件事：拆除面积与费用、CH5.4 征收补偿方案不可豁免、
    以及社会稳定风险（师生对施工影响的关切）。分诊时要问清楚。

# =============================================================================
# 抽象类特化
# =============================================================================
specialize:

  Subject:
    cn: 建设单位（高校）
    add_slots:
      school_tier: {type: enumeration, vocabulary: school_tier, tier: core}
      disciplines:
        type: object
        tier: core
        note: |
          学科体系与双一流建设学科清单。这是 D1 必要性最核心的论据——
          科研用房的必要性不来自"人多了要地方坐"，而来自学科发展的空间需求。
      research_output:
        type: object
        tier: core
        note: |
          近年科研成果：论文、项目、获奖、平台。
          用于证明"现有科研能力已受空间制约"，是 warrant 的实证支撑。

  Context:
    specialize_as: CampusSite
    add_slots:
      campus_plan: {type: ref, target: Mandate, tier: core,
                    note: 校园总体规划。既是 D2 合规基准，也是 D1 驱动}
      existing_building:
        type: object
        tier: optional
        note: |
          拟拆除的既有建筑：面积、建成年代、结构状况、现状用途、腾空安排。
          nature=拆除重建 时必填。它驱动拆除费、征收补偿方案与稳评。

  ProgramUnit:
    specialize_as: ResearchUnit
    add_slots:
      unit_type:
        type: enumeration
        vocabulary: research_unit_type
        tier: core
      staff_plan:
        type: entity_list
        tier: core
        item_class: StaffByLevel
        note: |
          规划人员构成，须分类：科研人员（含全职/特聘/访问）、
          研究生、博士生、博士后。分类是必须的——不同类别的人均指标不同。
      current_status:
        type: text
        tier: core
        note: |
          该机构现状：成立时间、现有人员、科研方向、已有成果。
          可研评审会问"这个机构是新设的还是已有的"，答不上来会被质疑规模依据。
    default_sizing_method: indexed
    note: |
      科研用房走纯指标法：规划人数 × 人均建筑面积指标。
      与学生生活用房不同，**通常不做缺额法**——因为科研机构多为新设或扩建，
      没有可比的"现有面积"基数。若学校要求做缺额，按 edu-student-life 的口径。

  Operation:
    add_slots:
      operator: {type: enumeration, tier: core,
                 note: 科研单位自用 / 校级平台共享 / 对外开放服务}
      sharing_policy:
        type: object
        tier: optional
        note: |
          大型仪器与实验空间的共享机制。
          这是 CH6.4 绩效管理方案的抓手——科研用房的绩效指标不是床位数，
          而是使用率、共享机时、承担项目数、产出成果数。

# =============================================================================
# 受控词表
# =============================================================================
vocabularies:
  project_type: [科研用房, 实验楼, 研究中心, 重点实验室, 交叉研究平台, 中试基地]
  legal_nature: [教育部直属高校, 其他中央部委属高校, 省属高校, 市属高校]
  school_tier: [部属, 省属, 市属]

  research_unit_type: [研究中心, 研究院, 重点实验室, 工程技术研究中心, 协同创新中心]

  campus_room_type:
    基本办学用房: [专用科研用房, 实验实习场所, 师生活动用房]
    公共服务配套: [交流讨论室, 接待室, 报告厅, 活动室, 阅览室, 档案室, 复印室, 贮藏室]
    其他用房: [设备用房, 人防工程, 地下车库]
    note: 严格按建标191-2018 的分类，不得自造类别

  tech_domain: [数字化, 建筑, 结构, 给排水, 暖通空调, 强电, 弱电, 消防, 总平面, 景观, 装配式]
  operation_model: [科研单位自用, 校级平台共享, 对外开放服务, 委托物业]

# =============================================================================
# 领域一致性要点
# =============================================================================
domain_checks:

  DC1_staff_classification:
    rule: 规划人数必须分类给出，不得只给总数
    why: |
      科研人员与研究生的人均指标不同，只给总数无法测算。
      只给总数就无法测算，也无法核验。
    severity: error

  DC2_index_version:
    rule: 面积指标必须绑定建标191-2018 现行版本，并核对是否适用于专职科研机构
    why: |
      这是本垂类最关键的一次核验。「专职科研机构用房」是否在该标准的
      适用范围内，属边界情形，必须查清而不是默认。
    severity: error
    see: references/norms.yaml → JB191-2018

  DC3_support_area_ratio:
    rule: 公共服务配套用房的使用面积→建筑面积换算系数必须显式声明
    why: |
      常见取值 0.55（合成样例：使用面积 900 ÷ 0.55 ≈ 1800 建筑面积）。
      这个系数没有国标依据，属编制单位口径，各项目取值不同，
      必须标为 E1 并请客户确认，不得沿用他例。
    severity: error

  DC4_design_vs_demand:
    rule: 设计面积超出需求测算值时，必须说明超出部分的构成与理由
    why: |
      常见写法是一句话带过（如「设计面积略高于需求测算值」）。
      正确做法：说明超出部分的具体构成与理由，
      例如「超出部分为地下设备用房，不属指标控制范围」。
    severity: warning
    note: 检查器在 qualifier 存在而 rebuttal 缺失时报警（C4a）

  DC5_demolition:
    rule: 涉及拆除的，拆除面积、拆除费、腾空安排、CH5.4 征收补偿方案缺一不可
    why: 拆除重建类项目最容易漏 CH5.4——以为"校内自拆不算征收"
    severity: error
    applicable_when: "project.nature == 拆除重建"

# =============================================================================
# 已知易错点（从真实报告的审校中归纳，已脱去项目信息）
# =============================================================================
known_pitfalls:

  - id: P1
    issue: 同一面积在不同章节写成不同值
    typical_case: 某一章把总面积写成 18219，其余十处写 18319——一个数字的笔误，人眼极难发现
    prevented_by: C1 恒等约束 + SSOT + render.py 的占位符强制

  - id: P2
    issue: 必要性论证断链
    typical_case: 从"国家重视某某领域"直接跳到"本校必须建这栋楼"，warrant 从未写出
    prevented_by: C4a
    how_to_fix: |
      warrant 应当是可检验的中间命题。科研用房的正确写法：
      「该学科现有科研用房 X ㎡，团队 Y 人，人均 Z ㎡，低于指标值；
       空间不足已导致 具体的某项科研活动 无法开展」——
      而不是"国家重视，所以我们要建"。

  - id: P3
    issue: 设计规模超需求但未说明
    typical_case: 设计规模超需求测算值一两个百分点，只有 qualifier 没有 rebuttal
    prevented_by: C4a

  - id: P4
    issue: 引错规范名称
    typical_case: 把《普通高等学校建筑面积指标》写成含「规划」二字的版本
    prevented_by: C5g 规范登记册比对

  - id: P5
    issue: 旧口径章节结构
    typical_case: |
      旧口径报告常缺 8 章法定内容：规划政策符合性、需求分析、项目产出方案、要素保障分析、
      数字化方案、整章的运营方案、盈利/偿债/财务可持续性分析、经济影响分析、
      碳达峰碳中和分析、风险应急预案。
      另设两个 2023 大纲已无独立位置的章：招投标方案、卫生防疫与劳动安全。
    prevented_by: C7 法定覆盖
