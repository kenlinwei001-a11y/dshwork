# =============================================================================
# 交互协议 (L0)
# -----------------------------------------------------------------------------
# 本 skill 是**状态机，不是流水线**。
#
# 反模式（明确禁止）：一次性写完整篇报告，再请客户通篇修改。
#   代价一：客户会去改句子，而不是纠正事实。文字一旦生成就产生锚定，
#           错误的数字被包裹在通顺的段落里，反而更难被发现。
#   代价二：一个上游事实改动，下游十几处派生值和论断全部作废，返工量不可控。
#   代价三：客户看到的是成品，会误以为已经定稿，从而降低审阅强度。
#
# 正模式：图的状态决定下一步做什么。每一轮只推进一小步，每一步都可回退。
# =============================================================================

meta:
  id: fsr-interaction
  layer: L0
  version: 0.1.0
  principle: 图驱动，非顺序驱动；先定事实，后生成文字；冲突即时抛出，不攒到最后

# =============================================================================
# 1. 主循环
# =============================================================================
main_loop:

  note: |
    没有"阶段"，只有循环。每一轮：评估图状态 → 选一个动作 → 执行 → 回写 → 重跑检查。
    骨架冻结是唯一的硬前置，因为章节 id 是全图的引用锚点。

  cycle:
    - step: ASSESS
      action: 评估当前图状态
      computes:
        - 哪些节点已满足、哪些是空槽
        - 每个空槽阻塞了多少下游节点（阻塞度）
        - 哪些章节的 requires 已闭合（可生成）
        - 跑 C1-C7，有无新增冲突

    - step: SELECT
      action: 按优先级选下一个动作
      priority:
        1: 有冲突 → RESOLVE（冲突优先于一切，绝不带着冲突往下走）
        2: 有高阻塞度空槽 → ASK 或 SEARCH
        3: 有 requires 闭合的章节 → DRAFT
        4: 全部章节完成 → VALIDATE 出稿

    - step: EXECUTE
      actions: [ASK, SEARCH, COMPUTE, DRAFT, RESOLVE]

    - step: COMMIT
      action: 回写图，重跑受影响的派生与检查
      note: 只重算受影响的子图，不全量重跑

# =============================================================================
# 2. 五种动作 —— 细则
#    动作清单与优先级在 SKILL.md，此处只写容易做错的地方。
# =============================================================================
actions:

  ASK:
    forbidden:
      - 一次抛出几十项的长问卷
      - 问已经可以从图中推导出来的东西
      - 问对当前阻塞无帮助的"完备性"问题
    must_state:
      - 这个问题服务于哪个可行性维度
      - 不回答会导致哪些章节写不下去
      - 有无可接受的缺省值或行业惯例值（有则给出，标注为待确认）
    tooling: scripts/intake_gen.py 已实现排序与分批，不要自己另排一套顺序

  SEARCH:
    note: 这是"机网交互"，不占用客户时间，应尽量前置批量执行
    must_record: [来源 URL, 发布机构, 发布日期, 检索日期]
    registry: 核验结果回写 references/norms.yaml 的 status / verified_at / verified_source

  COMPUTE:
    note: 自动执行，不打扰客户。结果写入图并记录派生轨迹（E4 证据）
    tooling: scripts/audit.py trace 导出可审计的完整来源链

  DRAFT:
    note: |
      前置条件不满足就不写。宁可空着并说明"待 X 确认后生成"，
      也不要先写一版占位文字——占位文字会被当成初稿，然后被润色，然后被遗忘。
    after_draft:
      - 立即呈客户确认该章
      - 确认后冻结该章 provides 的节点
      - 若客户在确认中提供了新事实，回写图并触发受影响子图重算

  RESOLVE:
    note: |
      冲突不自动改，抛给客户裁决，但必须给出足够裁决的信息：
      冲突在哪两处、各自值是多少、图中的权威值是什么、改哪边影响哪些下游。
    tooling: scripts/impact.py 算"改哪边影响哪些下游"，不要靠人回忆
    example: |
      「宿舍应建面积」冲突：
        表3-6 声明 485000 ㎡（校区整体）
        按您提供的指标(10㎡/生 + 硕士补助5 + 博士补助10 + 留学生补助10)
        与人数(本19000/硕13050/博3500/留2000)重算 = 495750 ㎡，差 10750 ㎡
        参照：同表二期口径 112150 ㎡ 可被完美复现，说明规则本身正确
        请确认：① 校区整体的人数口径是否含其他类别 ② 还是应建面积需修正
        影响：本项 → 缺额面积 → 本次新建规模合理性论证（D4）


# =============================================================================
# 3. 闸门
# =============================================================================
gates:
  note: |
    四道闸门（G1 骨架确认 / G2 关键事实确认 / G3 逐章确认 / G4 出稿）
    的定义与拦截范围在 SKILL.md，此处不重复。下面只记录容易被忽略的细节。
  G1_detail: 见 triage.yaml → outline_gate
  G2_detail: |
    高阻塞度的判定用 scripts/intake_gen.py 的 blocking_degree，
    不靠人拍脑袋。阻塞 ≥3 条下游链的节点自动进 G2。
  G3_detail: |
    逐章确认时，若客户在确认中提供了新事实，
    回写图并触发受影响子图重算——不要口头记下来待会儿改。
  G4_detail: |
    error 未清零也可出稿，前提是每条都由客户显式裁决并留痕（audit.py log）。
    留痕的意义在于：评审追问时能说清楚"我们知道这里有问题，是这样处理的"。


# =============================================================================
# 4. 变更传播
# =============================================================================
change_propagation:

  note: |
    客户在任何时刻都可能改一个上游事实（"设计方案调了，总建面变成 26800"）。
    这是常态，不是异常。系统必须能承受，且必须让影响可见。

  on_change:
    - 识别受影响子图（沿 derives / aggregates / restates 边前向传播）
    - 列出：哪些派生值会变、哪些章节需重写、哪些论断的 qualifier 需更新
    - 先给影响清单，再执行 —— 让客户知道这一改动的代价
    - 已冻结章节若受影响，解冻并标记为「待重写」，不静默保留旧文字

  forbidden: |
    静默保留过期文字。上游改了而下游正文没改，就是第一份样本
    「18319 vs 18219」那类事故的成因——只不过那次是人写的，
    如果系统也这么干，就没有任何改进。

# =============================================================================
# 5. 与客户的分工声明
# =============================================================================
division_of_labor:
  客户负责:
    - 事实的准确性（人数、面积、造价、财务数据、设计方案）
    - 前置批复的完整性与有效性
    - 冲突的最终裁决
    - 章节骨架与各章内容的确认
  系统负责:
    - 法定覆盖不遗漏（C7）
    - 事实在全文传播中不矛盾（C1/C2/C3/C6）
    - 每条论断都有证据、有推理许可（C4/C5）
    - 缺口的识别与分诊（该问客户还是该去查）
    - 变更影响的可见性
  系统不负责:
    - 判断客户给的数字对不对（造价高不高、人数合不合理）
    - 替客户做决策
