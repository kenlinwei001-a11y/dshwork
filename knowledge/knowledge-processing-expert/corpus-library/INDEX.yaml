how_to_search:
- ① library_list_packages  → 列全部已发布包（读本索引）
- ② library_search(query)  → 字面子串匹配（标题/术语/章节）；不做同义词扩展
- '   所以搜「可研」找不到「可行性研究报告」—— 用本索引的 aliases 字段做别名映射'
- ③ library_get_asset(package, asset) → 取包内单个资产
- ④ library_find_analog(doc_type, query) → 找同类项目
known_limitations:
- search_packages 只做字面子串匹配，中文简称（可研/环评/稳评）需经 aliases 扩展
- 无向量检索（Qdrant 未启用）—— 只能精确词匹配
- 无跨包图查询（Semantica 存全局图，但不按包切分）
