{
  "domains": [
    {
      "id": "ontology",
      "core_domain": "本体中心",
      "assembly_input": [
        "新项目领域",
        "对象",
        "属性",
        "关系",
        "历史本体版本"
      ],
      "assembly_method": "先匹配历史领域本体；对比类、属性、关系、约束的 Schema；复用兼容部分，新增或扩展不兼容部分；建立项目级本体版本",
      "mismatch_handling": "新增概念则增加类或属性；同名异义则创建不同概念或明确语义映射；类型变化则进行兼容性检查，不直接覆盖旧定义",
      "assembly_output": [
        "项目本体 Schema",
        "变更集",
        "映射表",
        "版本记录"
      ],
      "reusable_form": {
        "entity_types": [
          {
            "type": "Project",
            "desc": "项目"
          },
          {
            "type": "Base",
            "desc": "生产基地"
          },
          {
            "type": "ProductionLine",
            "desc": "生产线"
          },
          {
            "type": "Equipment",
            "desc": "设备"
          },
          {
            "type": "CostItem",
            "desc": "成本/投资项"
          },
          {
            "type": "FundingSource",
            "desc": "资金来源"
          },
          {
            "type": "Kpi",
            "desc": "业务指标"
          }
        ],
        "relations": [
          "has_value",
          "has_attribute",
          "instance_of",
          "part_of",
          "causes",
          "depends_on",
          "supports",
          "contradicts",
          "temporal",
          "located_in"
        ]
      }
    },
    {
      "id": "argument_chain",
      "core_domain": "论证链",
      "assembly_input": [
        "报告目标",
        "论点",
        "Claim",
        "前提",
        "证据",
        "推理关系"
      ],
      "assembly_method": "复用历史论证模式；解析新输入中的 Claim；将 Claim 与前提、证据、推论和结论关系连接；检查每条关键 Claim 的支撑情况",
      "mismatch_handling": "新增 Claim 时创建 Claim 节点及其关系；若历史模板没有对应关系类型，则扩展关系 Schema；不能把旧项目的论点或结论直接当成新项目结论",
      "assembly_output": [
        "项目论证图",
        "Claim 清单",
        "缺失证据清单",
        "推理任务"
      ],
      "reusable_form": {
        "claim_types": [
          "judgment",
          "prediction",
          "causal",
          "suggestion",
          "risk"
        ],
        "edge_types": [
          "supports",
          "contradicts",
          "depends_on"
        ]
      }
    },
    {
      "id": "scenario",
      "core_domain": "推演场景",
      "assembly_input": [
        "项目目标",
        "场景类型",
        "初始条件",
        "边界条件",
        "扰动因素"
      ],
      "assembly_method": "匹配历史场景模板；将新项目变量绑定到场景参数；复制场景结构而非旧模拟结果；生成基准、变化及极端情景",
      "mismatch_handling": "新增扰动因素则扩展场景参数；若关键参数缺失，标记待补充或采用明确声明的假设；不将旧项目的模拟输出迁移为新结果",
      "assembly_output": [
        "项目场景集",
        "参数绑定表",
        "场景运行配置"
      ],
      "reusable_form": {
        "scenario_types": [
          "基准",
          "变化",
          "极端"
        ],
        "params": [
          "产能占用率",
          "销售单价",
          "回收期"
        ]
      }
    },
    {
      "id": "variable",
      "core_domain": "变量定义",
      "assembly_input": [
        "输入字段",
        "业务指标",
        "单位",
        "类型",
        "公式",
        "数据来源"
      ],
      "assembly_method": "先做字段与变量的语义匹配；复用变量定义、单位和计算公式；建立输入字段到变量的映射；校验单位、取值范围和依赖",
      "mismatch_handling": "新字段可能是新变量、已有变量的别名或普通元数据；先分类再决定新增、映射或忽略；同名不同单位必须显式转换，不能仅凭名称匹配",
      "assembly_output": [
        "项目变量字典",
        "字段映射",
        "公式依赖图"
      ],
      "reusable_form": {
        "inputs": [
          {
            "label": "新增生产线数量",
            "unit": "条",
            "type": "int",
            "source": "客户提供"
          },
          {
            "label": "每年工作日",
            "unit": "天",
            "type": "int"
          },
          {
            "label": "每日班次",
            "unit": "班",
            "type": "int"
          },
          {
            "label": "每班时长",
            "unit": "小时",
            "type": "number"
          },
          {
            "label": "单线毛产出速率",
            "unit": "套/小时",
            "type": "number"
          },
          {
            "label": "有效开动率",
            "unit": "%",
            "type": "number"
          },
          {
            "label": "最终合格率",
            "unit": "%",
            "type": "number"
          },
          {
            "label": "正常年计划销售量",
            "unit": "套",
            "type": "number"
          },
          {
            "label": "不含税销售单价",
            "unit": "元",
            "type": "number"
          },
          {
            "label": "建筑与公辅工程合计",
            "unit": "万元",
            "type": "number"
          },
          {
            "label": "设备与系统购置费合计",
            "unit": "万元",
            "type": "number"
          },
          {
            "label": "工程建设其他费用",
            "unit": "万元",
            "type": "number"
          },
          {
            "label": "净营运资金需求",
            "unit": "万元",
            "type": "number"
          },
          {
            "label": "股东资金",
            "unit": "万元",
            "type": "number"
          },
          {
            "label": "正常年变动成本",
            "unit": "万元",
            "type": "number"
          },
          {
            "label": "年度固定付现成本",
            "unit": "万元",
            "type": "number"
          },
          {
            "label": "单套变动成本",
            "unit": "元",
            "type": "number"
          }
        ],
        "computed": [
          {
            "label": "正常年合格产能",
            "unit": "套",
            "formula": "floor(新增生产线数量*每年工作日*每日班次*每班时长*单线毛产出速率*有效开动率%*最终合格率%)"
          },
          {
            "label": "计划产能占用率",
            "unit": "%",
            "formula": "正常年计划销售量/正常年合格产能*100"
          },
          {
            "label": "安装集成费",
            "unit": "万元",
            "formula": "设备与系统购置费合计*6%"
          },
          {
            "label": "基本预备费",
            "unit": "万元",
            "formula": "(工程费用+工程建设其他费用)*8%"
          },
          {
            "label": "建设投资",
            "unit": "万元",
            "formula": "建筑与公辅工程合计+设备与系统购置费合计+安装集成费+工程建设其他费用+基本预备费"
          },
          {
            "label": "融资前项目资金需求",
            "unit": "万元",
            "formula": "建设投资+净营运资金需求"
          },
          {
            "label": "拟需借款",
            "unit": "万元",
            "formula": "max(融资前项目资金需求-股东资金, 0)"
          },
          {
            "label": "正常年营业收入",
            "unit": "万元",
            "formula": "正常年计划销售量*不含税销售单价/10000"
          },
          {
            "label": "正常年经营现金盈余",
            "unit": "万元",
            "formula": "正常年营业收入-正常年变动成本-年度固定付现成本"
          },
          {
            "label": "静态资金回收期",
            "unit": "年",
            "formula": "2+(融资前项目资金需求-首年经营现金盈余)/正常年经营现金盈余"
          },
          {
            "label": "经营付现收支平衡销量",
            "unit": "套",
            "formula": "ceil(年度固定付现成本*10000/(不含税销售单价-单套变动成本))"
          }
        ]
      }
    },
    {
      "id": "task_dag",
      "core_domain": "任务图 DAG",
      "assembly_input": [
        "项目目标",
        "任务清单",
        "资产依赖",
        "执行条件"
      ],
      "assembly_method": "复用历史任务模板；根据当前项目启用或跳过节点；为新增字段、Claim 或规则补充解析、验证、推理节点；重新计算任务依赖和拓扑顺序",
      "mismatch_handling": "新增 Claim 若需要证据检索和论证校验，应插入相应任务节点并连接上下游；如果新节点形成循环依赖，则停止执行并要求修正",
      "assembly_output": [
        "项目任务 DAG",
        "节点参数",
        "执行顺序和依赖检查结果"
      ],
      "reusable_form": {
        "stages": [
          "解析",
          "抽取",
          "建图",
          "回放",
          "质量",
          "写作"
        ],
        "nodes": {
          "建图": [
            "instantiate_project"
          ],
          "写作": [
            "build_work_package",
            "gate_check_draft"
          ]
        }
      }
    },
    {
      "id": "function",
      "core_domain": "函数库",
      "assembly_input": [
        "函数定义",
        "输入输出 Schema",
        "业务参数",
        "执行环境"
      ],
      "assembly_method": "按功能与接口匹配函数；复用经验证的实现；绑定项目变量；执行接口检查与测试；记录函数版本",
      "mismatch_handling": "新增字段不应自动传入所有函数；只有当函数的输入 Schema 或业务逻辑需要该字段时，才修改接口或增加适配器，并保留兼容版本",
      "assembly_output": [
        "函数绑定清单",
        "输入输出映射",
        "测试结果"
      ],
      "reusable_form": {
        "functions": [
          "safe_eval",
          "compute_label",
          "instantiate_project",
          "build_work_package",
          "gate_check_draft"
        ]
      }
    },
    {
      "id": "rule",
      "core_domain": "规则库",
      "assembly_input": [
        "业务规则",
        "条件",
        "阈值",
        "例外",
        "适用范围"
      ],
      "assembly_method": "匹配规则的领域、适用对象和生效版本；复用通用规则；将项目特定阈值作为参数注入；检查规则之间的冲突",
      "mismatch_handling": "新增 Claim 可能触发「关键 Claim 必须有证据」等规则；先判断是否属于当前报告类型的要求，再将规则绑定到对应任务或校验阶段",
      "assembly_output": [
        "项目规则集",
        "参数配置",
        "冲突报告"
      ],
      "reusable_form": [
        {
          "id": "R-产能",
          "kind": "compute",
          "label": "正常年合格产能",
          "expr": "floor({新增生产线数量}*{每年工作日}*{每日班次}*{每班时长}*{单线毛产出速率}*({有效开动率}/100)*({最终合格率}/100))",
          "deps": [
            "N-0001",
            "N-0002",
            "N-0003",
            "N-0004",
            "N-0005",
            "N-0006",
            "N-0007"
          ],
          "target": "N-0008"
        },
        {
          "id": "R-占用率",
          "kind": "compute",
          "label": "计划产能占用率",
          "expr": "round({正常年计划销售量}/{正常年合格产能}*100, 2)",
          "deps": [
            "N-0009",
            "N-0008"
          ],
          "target": "N-0010"
        },
        {
          "id": "R-安装",
          "kind": "compute",
          "label": "安装集成费",
          "expr": "round({设备与系统购置费合计}*0.06, 2)",
          "deps": [
            "N-0013"
          ],
          "target": "N-0014"
        },
        {
          "id": "R-预备费",
          "kind": "compute",
          "label": "基本预备费",
          "expr": "round(({工程费用}+{工程建设其他费用})*0.08, 2)",
          "deps": [
            "N-0016",
            "N-0015"
          ],
          "target": "N-0017"
        },
        {
          "id": "R-建设投资",
          "kind": "compute",
          "label": "建设投资",
          "expr": "round({建筑与公辅工程合计}+{设备与系统购置费合计}+{安装集成费}+{工程建设其他费用}+{基本预备费}, 2)",
          "deps": [
            "N-0012",
            "N-0013",
            "N-0014",
            "N-0015",
            "N-0017"
          ],
          "target": "N-0018"
        },
        {
          "id": "R-资金需求",
          "kind": "compute",
          "label": "融资前项目资金需求",
          "expr": "round({建设投资}+{净营运资金需求}, 2)",
          "deps": [
            "N-0018",
            "N-0019"
          ],
          "target": "N-0020"
        },
        {
          "id": "R-借款",
          "kind": "compute",
          "label": "拟需借款",
          "expr": "round(max({融资前项目资金需求}-{股东资金}, 0), 2)",
          "deps": [
            "N-0020",
            "N-0021"
          ],
          "target": "N-0022"
        },
        {
          "id": "R-营收",
          "kind": "compute",
          "label": "正常年营业收入",
          "expr": "round({正常年计划销售量}*{不含税销售单价}/10000, 2)",
          "deps": [
            "N-0009",
            "N-0011"
          ],
          "target": "N-0023"
        },
        {
          "id": "R-现金盈余",
          "kind": "compute",
          "label": "正常年经营现金盈余",
          "expr": "round({正常年营业收入}-{正常年变动成本}-{年度固定付现成本}, 2)",
          "deps": [
            "N-0023",
            "N-0024",
            "N-0025"
          ],
          "target": "N-0027"
        },
        {
          "id": "R-回收期",
          "kind": "compute",
          "label": "静态资金回收期",
          "expr": "round(2+({融资前项目资金需求}-{首年经营现金盈余})/{正常年经营现金盈余}, 2)",
          "deps": [
            "N-0020",
            "N-0026",
            "N-0027"
          ],
          "target": "N-0028"
        },
        {
          "id": "R-平衡销量",
          "kind": "compute",
          "label": "经营付现收支平衡销量",
          "expr": "ceil({年度固定付现成本}*10000/({不含税销售单价}-{单套变动成本}))",
          "deps": [
            "N-0025",
            "N-0011",
            "N-0029"
          ],
          "target": "N-0030"
        },
        {
          "id": "R-可行性",
          "kind": "select",
          "label": "结论·项目可行",
          "expr": "静态资金回收期 ≤ 行业基准 5 年 且 计划产能占用率 ≥ 80%",
          "deps": [
            "N-0028",
            "N-0010"
          ],
          "target": "N-0031",
          "guard": "任一前提不满足 => 待审"
        }
      ]
    },
    {
      "id": "invariant",
      "core_domain": "不变式",
      "assembly_input": [
        "必须成立的条件",
        "约束表达式",
        "适用范围"
      ],
      "assembly_method": "复用领域硬约束；绑定新项目的对象、变量和单位；在执行前验证约束是否可满足",
      "mismatch_handling": "新增字段只有在改变约束表达式或约束对象时才需扩展不变式；若新输入与硬约束矛盾，不应自动修改约束来迁就输入",
