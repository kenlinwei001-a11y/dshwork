[
  {
    "id": "R-产能",
    "kind": "compute",
    "label": "正常年合格产能",
    "expr": "floor({新增生产线数量}*{每年工作日}*{每日班次}*{每班时长}*{单线毛产出速率}*({有效开动率}/100)*({最终合格率}/100))",
    "deps": [
      "N-0001",
      "N-0002",
      "N-0003",
      "N-0004",
      "N-0005",
      "N-0006",
      "N-0007"
    ],
    "target": "N-0008"
  },
  {
    "id": "R-占用率",
    "kind": "compute",
    "label": "计划产能占用率",
    "expr": "round({正常年计划销售量}/{正常年合格产能}*100, 2)",
    "deps": [
      "N-0009",
      "N-0008"
    ],
    "target": "N-0010"
  },
  {
    "id": "R-安装",
    "kind": "compute",
    "label": "安装集成费",
    "expr": "round({设备与系统购置费合计}*0.06, 2)",
    "deps": [
      "N-0013"
    ],
    "target": "N-0014"
  },
  {
    "id": "R-预备费",
    "kind": "compute",
    "label": "基本预备费",
    "expr": "round(({工程费用}+{工程建设其他费用})*0.08, 2)",
    "deps": [
      "N-0016",
      "N-0015"
    ],
    "target": "N-0017"
  },
  {
    "id": "R-建设投资",
    "kind": "compute",
    "label": "建设投资",
    "expr": "round({建筑与公辅工程合计}+{设备与系统购置费合计}+{安装集成费}+{工程建设其他费用}+{基本预备费}, 2)",
    "deps": [
      "N-0012",
      "N-0013",
      "N-0014",
      "N-0015",
      "N-0017"
    ],
    "target": "N-0018"
  },
  {
    "id": "R-资金需求",
    "kind": "compute",
    "label": "融资前项目资金需求",
    "expr": "round({建设投资}+{净营运资金需求}, 2)",
    "deps": [
      "N-0018",
      "N-0019"
    ],
    "target": "N-0020"
  },
  {
    "id": "R-借款",
    "kind": "compute",
    "label": "拟需借款",
    "expr": "round(max({融资前项目资金需求}-{股东资金}, 0), 2)",
    "deps": [
      "N-0020",
      "N-0021"
    ],
    "target": "N-0022"
  },
  {
    "id": "R-营收",
    "kind": "compute",
    "label": "正常年营业收入",
    "expr": "round({正常年计划销售量}*{不含税销售单价}/10000, 2)",
    "deps": [
      "N-0009",
      "N-0011"
    ],
    "target": "N-0023"
  },
  {
    "id": "R-现金盈余",
    "kind": "compute",
    "label": "正常年经营现金盈余",
    "expr": "round({正常年营业收入}-{正常年变动成本}-{年度固定付现成本}, 2)",
    "deps": [
      "N-0023",
      "N-0024",
      "N-0025"
    ],
    "target": "N-0027"
  },
  {
    "id": "R-回收期",
    "kind": "compute",
    "label": "静态资金回收期",
    "expr": "round(2+({融资前项目资金需求}-{首年经营现金盈余})/{正常年经营现金盈余}, 2)",
    "deps": [
      "N-0020",
      "N-0026",
      "N-0027"
    ],
    "target": "N-0028"
  },
  {
    "id": "R-平衡销量",
    "kind": "compute",
    "label": "经营付现收支平衡销量",
    "expr": "ceil({年度固定付现成本}*10000/({不含税销售单价}-{单套变动成本}))",
    "deps": [
      "N-0025",
      "N-0011",
      "N-0029"
    ],
    "target": "N-0030"
  },
  {
    "id": "R-可行性",
    "kind": "select",
    "label": "结论·项目可行",
    "expr": "静态资金回收期 ≤ 行业基准 5 年 且 计划产能占用率 ≥ 80%",
    "deps": [
      "N-0028",
      "N-0010"
    ],
    "target": "N-0031",
    "guard": "任一前提不满足 => 待审"
  }
]